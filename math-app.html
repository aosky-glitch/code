<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#5B6BF0">
<title>初中数学学习小程序</title>
<style>
/* 初中数学学习小程序 —— 界面样式 */
:root {
  --bg: #F3F5FB;
  --card: #FFFFFF;
  --card2: #F8F9FE;
  --text: #1E2440;
  --sub: #858DAA;
  --line: #EAEDF6;
  --primary: #5B6BF0;
  --primary2: #8C6BF6;
  --accent: #FF9E45;
  --ok: #20B183;
  --bad: #F05C63;
  --shadow: 0 6px 22px rgba(38, 50, 110, .08);
  --shadow2: 0 12px 34px rgba(38, 50, 110, .14);
  --grad: linear-gradient(135deg, #5B6BF0 0%, #8C6BF6 100%);
}
body[data-theme='dark'] {
  --bg: #11152A;
  --card: #1C2240;
  --card2: #232A4C;
  --text: #EEF1FF;
  --sub: #8C95B8;
  --line: #2C3357;
  --primary: #7B8AFF;
  --primary2: #A98BFF;
  --accent: #FFB063;
  --ok: #3ACB98;
  --bad: #FF7379;
  --shadow: 0 6px 22px rgba(0, 0, 0, .28);
  --shadow2: 0 12px 34px rgba(0, 0, 0, .4);
  --grad: linear-gradient(135deg, #5468E8 0%, #8B63E8 100%);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
  background: linear-gradient(160deg, #E7EBFA 0%, #F5F0FC 55%, #EAF3FA 100%);
  color: var(--text);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
body[data-theme='dark'] { background: linear-gradient(160deg, #0B0E1E 0%, #14182F 60%, #101426 100%); }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input { font-family: inherit; }

/* ---------- 手机外框 ---------- */
.phone {
  position: relative;
  width: 420px; height: min(880px, 94vh);
  background: var(--bg);
  border-radius: 34px;
  box-shadow: 0 30px 80px rgba(30, 36, 80, .26), 0 0 0 9px rgba(255,255,255,.55);
  display: flex; flex-direction: column;
  overflow: hidden;
}
body[data-theme='dark'] .phone { box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 9px rgba(255,255,255,.07); }
@media (max-width: 520px) {
  body { display: block; }
  .phone { width: 100%; height: 100vh; height: 100dvh; border-radius: 0; box-shadow: none; }
}

/* ---------- 状态栏 ---------- */
.statusbar {
  height: 34px; flex: 0 0 34px; padding: 0 22px;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 12px; font-weight: 700; color: var(--text);
  background: var(--card); letter-spacing: .3px;
}
.statusbar .sb-right { display: flex; align-items: center; gap: 5px; }
.sb-bars { display: flex; align-items: flex-end; gap: 2px; height: 10px; }
.sb-bars i { width: 3px; background: var(--text); border-radius: 1px; display: block; }
.sb-bars i:nth-child(1) { height: 4px; } .sb-bars i:nth-child(2) { height: 6px; }
.sb-bars i:nth-child(3) { height: 8px; } .sb-bars i:nth-child(4) { height: 10px; }
.sb-battery { width: 20px; height: 10px; border: 1.5px solid var(--text); border-radius: 3px; position: relative; }
.sb-battery::after { content:''; position:absolute; right:-4px; top:2px; width:2px; height:4px; background:var(--text); border-radius:0 1px 1px 0; }
.sb-battery i { position: absolute; inset: 1.5px; width: 70%; background: var(--text); border-radius: 1px; }

/* ---------- 导航栏 ---------- */
.navbar {
  flex: 0 0 50px; height: 50px; background: var(--card);
  display: flex; align-items: center; padding: 0 14px;
  border-bottom: 1px solid var(--line); position: relative; z-index: 5;
}
.navbar .nav-title { font-size: 16px; font-weight: 700; flex: 1; text-align: center; }
.navbar .nav-left, .navbar .nav-right { width: 60px; display: flex; align-items: center; }
.navbar .nav-right { justify-content: flex-end; }
.nav-btn {
  width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
  font-size: 17px; color: var(--text); background: var(--card2); transition: .15s;
}
.nav-btn:active { transform: scale(.9); }
.nav-btn.plain { background: transparent; font-size: 14px; font-weight: 600; color: var(--primary); width: auto; padding: 0 4px; }

/* ---------- 内容区 ---------- */
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 14px 16px 30px; scrollbar-width: thin; }
.scroll::-webkit-scrollbar { width: 4px; }
.scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
.scroll.nopad { padding: 0 0 30px; }
.view { animation: fadeUp .3s ease both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* ---------- tabBar ---------- */
.tabbar {
  flex: 0 0 62px; height: 62px; background: var(--card);
  border-top: 1px solid var(--line); display: flex; align-items: stretch;
  padding-bottom: env(safe-area-inset-bottom, 0); z-index: 6;
}
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; color: var(--sub); font-size: 10.5px; font-weight: 600; transition: .2s; position: relative;
}
.tab .ti { font-size: 21px; line-height: 22px; height: 22px; display: block; }
.tab.active { color: var(--primary); }
.tab.active .ti { transform: translateY(-1px) scale(1.08); }
.tab.active::before { content:''; position:absolute; top:0; width:26px; height:3px; border-radius:0 0 3px 3px; background:var(--primary); }
.tab:active { opacity: .7; }

/* ---------- 通用组件 ---------- */
.card { background: var(--card); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
.card.tight { padding: 13px 14px; }
.section-title { font-size: 15px; font-weight: 800; margin: 18px 2px 11px; display: flex; align-items: center; justify-content: space-between; }
.section-title .more { font-size: 12px; color: var(--sub); font-weight: 600; }
.muted { color: var(--sub); }
.tiny { font-size: 11px; }
.mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 44px; padding: 0 18px; border-radius: 13px; font-size: 14px; font-weight: 700;
  background: var(--card2); color: var(--text); transition: .16s;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--grad); color: #fff; box-shadow: 0 6px 16px rgba(91,107,240,.32); }
.btn-ghost { background: var(--card2); color: var(--primary); border: 1px solid var(--line); }
.btn-block { width: 100%; }
.btn-sm { height: 32px; padding: 0 13px; font-size: 12px; border-radius: 10px; }
.btn-lg { height: 48px; font-size: 15px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 999px;
  font-size: 11px; font-weight: 700; background: var(--card2); color: var(--sub); border: 1px solid var(--line);
}
.chip.on { background: var(--primary); color: #fff; border-color: var(--primary); }
.chip.ok { background: rgba(32,177,131,.12); color: var(--ok); border-color: transparent; }
.chip.warn { background: rgba(255,158,69,.14); color: #E8892B; border-color: transparent; }
.row { display: flex; align-items: center; gap: 10px; }
.spread { display: flex; align-items: center; justify-content: space-between; }
.divider { height: 1px; background: var(--line); margin: 12px 0; }
.tag-cat { font-size: 10px; padding: 3px 7px; border-radius: 6px; font-weight: 700; color: #fff; }

/* ---------- 首页 ---------- */
.hero {
  background: var(--grad); border-radius: 20px; padding: 18px; color: #fff;
  box-shadow: 0 10px 26px rgba(91,107,240,.3); margin-bottom: 14px; position: relative; overflow: hidden;
}
.hero::after { content:''; position:absolute; right:-40px; top:-50px; width:160px; height:160px; border-radius:50%; background:rgba(255,255,255,.09); }
.hero::before { content:''; position:absolute; right:20px; bottom:-60px; width:110px; height:110px; border-radius:50%; background:rgba(255,255,255,.07); }
.hero h2 { margin: 0 0 4px; font-size: 19px; font-weight: 800; position: relative; z-index: 1; }
.hero p { margin: 0; font-size: 12px; opacity: .85; position: relative; z-index: 1; }
.hero .hero-ring { position: absolute; right: 18px; top: 16px; z-index: 1; }
.hero-stats { display: flex; gap: 22px; margin-top: 18px; position: relative; z-index: 1; }
.hero-stats div b { font-size: 20px; display: block; line-height: 1.1; }
.hero-stats div span { font-size: 10.5px; opacity: .8; }
.ring-wrap { position: relative; width: 72px; height: 72px; }
.ring-wrap svg { transform: rotate(-90deg); }
.ring-wrap .ring-txt { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; }
.ring-wrap .ring-txt small { font-size: 8px; font-weight: 600; opacity: .8; }

.quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 4px; }
.quick {
  background: var(--card); border-radius: 15px; padding: 13px 4px 11px; text-align: center;
  box-shadow: var(--shadow); transition: .16s;
}
.quick:active { transform: scale(.94); }
.quick .qi { width: 38px; height: 38px; margin: 0 auto 7px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 19px; color: #fff; }
.quick span { font-size: 10.5px; font-weight: 700; color: var(--text); }

.task-card { display: flex; align-items: center; gap: 12px; }
.task-ic { width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 21px; flex: 0 0 44px; }
.task-card b { font-size: 13.5px; display: block; }
.task-card p { margin: 3px 0 0; font-size: 11px; color: var(--sub); }

.kp-mini { display: flex; align-items: center; gap: 11px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.kp-mini:last-child { border-bottom: none; }
.kp-mini .km-ic { width: 34px; height: 34px; border-radius: 11px; flex: 0 0 34px; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #fff; }
.kp-mini .km-body { flex: 1; min-width: 0; }
.kp-mini b { font-size: 13px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kp-mini small { color: var(--sub); font-size: 10.5px; }
.kp-mini .arrow { color: var(--sub); font-size: 15px; }

.cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.cat-box { border-radius: 14px; padding: 12px 4px; text-align: center; color: #fff; font-size: 12px; font-weight: 700; transition: .16s; }
.cat-box:active { transform: scale(.94); }
.cat-box i { display: block; font-size: 20px; font-style: normal; margin-bottom: 5px; }
.cat-box small { display: block; font-size: 9px; opacity: .85; font-weight: 600; margin-top: 2px; }

/* ---------- 分段控件 / 搜索 ---------- */
.seg { display: flex; background: var(--card2); border-radius: 12px; padding: 3px; gap: 2px; margin-bottom: 12px; }
.seg button { flex: 1; height: 32px; border-radius: 9px; font-size: 12.5px; font-weight: 700; color: var(--sub); transition: .2s; }
.seg button.on { background: var(--card); color: var(--primary); box-shadow: 0 2px 8px rgba(40,50,100,.1); }
.search { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 12px; padding: 0 12px; height: 38px; margin-bottom: 12px; box-shadow: var(--shadow); }
.search input { flex: 1; border: none; outline: none; background: transparent; color: var(--text); font-size: 13px; }
.search input::placeholder { color: var(--sub); }
.search .si { color: var(--sub); font-size: 14px; }

/* ---------- 章节 / 知识点列表 ---------- */
.chapter { background: var(--card); border-radius: 16px; margin-bottom: 10px; overflow: hidden; box-shadow: var(--shadow); }
.ch-head { display: flex; align-items: center; gap: 10px; padding: 13px 14px; }
.ch-num { width: 28px; height: 28px; border-radius: 9px; background: var(--card2); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: var(--primary); flex: 0 0 28px; }
.ch-head b { font-size: 13.5px; flex: 1; }
.ch-head .ch-count { font-size: 10.5px; color: var(--sub); }
.ch-head .ch-arrow { color: var(--sub); font-size: 12px; transition: transform .2s; }
.chapter.open .ch-arrow { transform: rotate(90deg); }
.ch-body { display: none; padding: 0 14px 8px; }
.chapter.open .ch-body { display: block; animation: fadeUp .22s ease both; }
.kp-row { display: flex; align-items: center; gap: 9px; padding: 11px 2px; border-top: 1px solid var(--line); }
.kp-row .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); flex: 0 0 7px; }
.kp-row .dot.done { background: var(--ok); box-shadow: 0 0 0 3px rgba(32,177,131,.14); }
.kp-row span { flex: 1; font-size: 12.5px; }
.kp-row .go { color: var(--sub); font-size: 13px; }

/* ---------- 知识点详情 ---------- */
.kp-hero { background: var(--grad); border-radius: 18px; padding: 17px; color: #fff; margin-bottom: 14px; box-shadow: 0 8px 22px rgba(91,107,240,.25); }
.kp-hero .chips { display: flex; gap: 6px; margin-bottom: 10px; }
.kp-hero .chips span { background: rgba(255,255,255,.22); border-radius: 999px; padding: 3px 9px; font-size: 10px; font-weight: 700; }
.kp-hero h2 { margin: 0 0 6px; font-size: 19px; font-weight: 800; }
.kp-hero p { margin: 0; font-size: 12px; line-height: 1.7; opacity: .9; }
.block-title { font-size: 13.5px; font-weight: 800; margin: 0 0 10px; display: flex; align-items: center; gap: 7px; }
.block-title i { width: 4px; height: 14px; border-radius: 2px; background: var(--primary); }
.point { display: flex; gap: 9px; margin-bottom: 9px; font-size: 12.5px; line-height: 1.7; }
.point:last-child { margin-bottom: 0; }
.point .pn { width: 18px; height: 18px; border-radius: 6px; background: var(--card2); color: var(--primary); font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex: 0 0 18px; margin-top: 2px; }
.formula-line { background: var(--card2); border-left: 3px solid var(--primary); border-radius: 0 9px 9px 0; padding: 9px 11px; margin-bottom: 8px; font-size: 12.5px; line-height: 1.6; }
.example-q { font-size: 13px; font-weight: 700; line-height: 1.7; margin-bottom: 10px; }
.step { display: flex; gap: 9px; font-size: 12.5px; line-height: 1.7; margin-bottom: 7px; }
.step .sn { width: 18px; height: 18px; border-radius: 50%; background: var(--primary); color: #fff; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex: 0 0 18px; margin-top: 2px; }
.answer-box { background: rgba(32,177,131,.1); color: var(--ok); border-radius: 10px; padding: 10px 12px; font-size: 13px; font-weight: 800; margin-top: 10px; }
.action-bar { display: flex; gap: 9px; margin-top: 16px; }
.action-bar .btn { flex: 1; }

/* ---------- 练习 ---------- */
.mode-card { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: var(--card); box-shadow: var(--shadow); margin-bottom: 10px; transition: .16s; }
.mode-card:active { transform: scale(.98); }
.mode-ic { width: 44px; height: 44px; border-radius: 14px; flex: 0 0 44px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff; }
.mode-card b { font-size: 13.5px; display: block; }
.mode-card p { margin: 3px 0 0; font-size: 11px; color: var(--sub); }
.mode-card .arrow { color: var(--sub); }
.quiz-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; font-size: 11.5px; color: var(--sub); font-weight: 600; }
.quiz-top b { color: var(--primary); font-size: 13px; }
.progress { height: 6px; background: var(--line); border-radius: 6px; overflow: hidden; margin-bottom: 14px; }
.progress i { display: block; height: 100%; background: var(--grad); border-radius: 6px; transition: width .3s; }
.q-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
.q-text { font-size: 15px; font-weight: 700; line-height: 1.75; margin-bottom: 16px; }
.opt {
  display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
  background: var(--card); border: 1.5px solid var(--line); border-radius: 13px;
  padding: 12px 13px; margin-bottom: 9px; font-size: 13px; line-height: 1.5; transition: .18s;
}
.opt:active { transform: scale(.985); }
.opt .ol { width: 26px; height: 26px; border-radius: 9px; background: var(--card2); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: var(--sub); flex: 0 0 26px; }
.opt.sel { border-color: var(--primary); background: rgba(91,107,240,.07); }
.opt.sel .ol { background: var(--primary); color: #fff; }
.opt.right { border-color: var(--ok); background: rgba(32,177,131,.1); }
.opt.right .ol { background: var(--ok); color: #fff; }
.opt.wrong { border-color: var(--bad); background: rgba(240,92,99,.1); animation: shake .3s; }
.opt.wrong .ol { background: var(--bad); color: #fff; }
.opt:disabled { cursor: default; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
.fill-input { width: 100%; height: 46px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); padding: 0 13px; font-size: 14px; color: var(--text); outline: none; transition: .18s; }
.fill-input:focus { border-color: var(--primary); }
.fill-input.right { border-color: var(--ok); background: rgba(32,177,131,.08); }
.fill-input.wrong { border-color: var(--bad); background: rgba(240,92,99,.08); }
.feedback { border-radius: 13px; padding: 12px 13px; margin-top: 12px; font-size: 12.5px; line-height: 1.7; animation: fadeUp .25s ease both; }
.feedback.ok { background: rgba(32,177,131,.1); color: var(--ok); }
.feedback.no { background: rgba(240,92,99,.1); color: var(--bad); }
.feedback b { display: block; font-size: 13px; margin-bottom: 4px; }
.feedback .sol { color: var(--text); margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
.quiz-foot { margin-top: 16px; }

/* ---------- 结算 ---------- */
.result-head { text-align: center; padding: 22px 0 8px; }
.result-head .big { font-size: 40px; font-weight: 800; color: var(--primary); line-height: 1; }
.result-head .big small { font-size: 15px; color: var(--sub); }
.result-head p { margin: 8px 0 0; font-size: 12.5px; color: var(--sub); }
.result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0; }
.result-grid div { background: var(--card2); border-radius: 12px; padding: 12px 4px; text-align: center; }
.result-grid b { display: block; font-size: 18px; color: var(--text); }
.result-grid span { font-size: 10px; color: var(--sub); }
.wrong-review { border-left: 3px solid var(--bad); padding: 9px 11px; background: var(--card2); border-radius: 0 9px 9px 0; margin-bottom: 8px; font-size: 12px; line-height: 1.6; }

/* ---------- 公式 / 错题 ---------- */
.formula-cat { font-size: 12px; font-weight: 800; color: var(--primary); margin: 14px 2px 8px; }
.f-item { background: var(--card); border-radius: 13px; padding: 11px 13px; margin-bottom: 8px; box-shadow: var(--shadow); }
.f-item .fn { font-size: 12.5px; font-weight: 800; margin-bottom: 5px; }
.f-item .fe { font-size: 13px; color: var(--primary); background: var(--card2); border-radius: 8px; padding: 8px 10px; line-height: 1.6; word-break: break-all; }
.f-item .fd { font-size: 10.5px; color: var(--sub); margin-top: 6px; line-height: 1.5; }
.wrong-item { background: var(--card); border-radius: 14px; padding: 13px; margin-bottom: 10px; box-shadow: var(--shadow); }
.wrong-item .wq { font-size: 12.5px; font-weight: 700; line-height: 1.6; }
.wrong-item .wa { font-size: 11.5px; margin-top: 8px; color: var(--ok); }
.wrong-item .ws { font-size: 11.5px; margin-top: 5px; color: var(--sub); line-height: 1.6; }
.empty { text-align: center; padding: 44px 20px; color: var(--sub); }
.empty .ei { font-size: 42px; display: block; margin-bottom: 12px; opacity: .55; }
.empty b { display: block; font-size: 14px; color: var(--text); margin-bottom: 6px; }
.empty p { font-size: 12px; margin: 0 0 16px; }

/* ---------- 我的 ---------- */
.profile-head { background: var(--grad); border-radius: 0 0 24px 24px; padding: 20px 18px 24px; color: #fff; display: flex; align-items: center; gap: 13px; margin: -14px -16px 14px; }
.avatar { width: 54px; height: 54px; border-radius: 18px; background: rgba(255,255,255,.22); display: flex; align-items: center; justify-content: center; font-size: 26px; }
.profile-head b { font-size: 17px; display: block; }
.profile-head span { font-size: 11px; opacity: .85; }
.stat-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.stat-4 div { text-align: center; }
.stat-4 b { display: block; font-size: 19px; font-weight: 800; }
.stat-4 span { font-size: 10px; color: var(--sub); }
.chart { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; height: 96px; margin-top: 10px; }
.chart .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; height: 100%; justify-content: flex-end; }
.chart .bar { width: 100%; max-width: 26px; border-radius: 6px 6px 3px 3px; background: var(--grad); min-height: 3px; transition: height .4s; }
.chart .bar.zero { background: var(--line); }
.chart .bl { font-size: 9.5px; color: var(--sub); }
.menu-item { display: flex; align-items: center; gap: 11px; padding: 13px 2px; border-bottom: 1px solid var(--line); }
.menu-item:last-child { border-bottom: none; }
.menu-item .mi { width: 32px; height: 32px; border-radius: 10px; background: var(--card2); display: flex; align-items: center; justify-content: center; font-size: 15px; color: var(--primary); }
.menu-item b { flex: 1; font-size: 13px; font-weight: 600; }
.menu-item .mv { font-size: 11.5px; color: var(--sub); }
.menu-item .arrow { color: var(--sub); font-size: 14px; }
.switch { width: 42px; height: 24px; border-radius: 999px; background: var(--line); position: relative; transition: .2s; }
.switch i { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.15); transition: .2s; }
.switch.on { background: var(--primary); }
.switch.on i { left: 21px; }

/* ---------- Toast / Modal ---------- */
.toast {
  position: absolute; left: 50%; bottom: 84px; transform: translate(-50%, 12px);
  background: rgba(28,34,64,.92); color: #fff; padding: 10px 16px; border-radius: 11px;
  font-size: 12.5px; font-weight: 600; z-index: 30; opacity: 0; pointer-events: none; transition: .25s;
  max-width: 82%; text-align: center; box-shadow: var(--shadow2);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.mask { position: absolute; inset: 0; background: rgba(15,20,45,.5); z-index: 40; display: flex; align-items: center; justify-content: center; padding: 30px; animation: fadeUp .2s; }
.modal { background: var(--card); border-radius: 18px; padding: 20px; width: 100%; max-width: 320px; box-shadow: var(--shadow2); }
.modal h3 { margin: 0 0 8px; font-size: 16px; }
.modal p { margin: 0 0 18px; font-size: 12.5px; color: var(--sub); line-height: 1.7; }
.modal .mbtns { display: flex; gap: 9px; }
.modal .mbtns .btn { flex: 1; height: 40px; font-size: 13px; }
.btn-danger { background: rgba(240,92,99,.12); color: var(--bad); }

<script>
/* 初中数学学习小程序 —— 知识库 / 题库 / 公式手册数据 */
window.MATH_DATA = (function () {
  // k: id, g: 年级, c: 章节, t: 标题, cat: 分类, s: 简介, p: 要点, f: 公式定理, e: 例题
  const K = [
    { id:'k01', g:7, c:'有理数', t:'有理数的概念与运算', cat:'代数',
      s:'整数和分数统称有理数，数轴、相反数、绝对值是有理数学习的基础工具。',
      p:['正数、负数表示具有相反意义的量；0 既不是正数也不是负数。','绝对值表示数轴上该数到原点的距离，恒为非负数。','加减乘除与乘方混合运算时，先乘方、再乘除、后加减，有括号先算括号内。'],
      f:['|a| = a (a>0)；|a| = 0 (a=0)；|a| = -a (a<0)','互为相反数的两数之和为 0；互为倒数的两数之积为 1'],
      e:{ q:'计算：(-3) + 5 - (-2) - 2²', st:['先算乘方：2² = 4','去括号：-(-2) = +2','原式 = -3 + 5 + 2 - 4 = 0'], a:'0' } },
    { id:'k02', g:7, c:'整式的加减', t:'合并同类项与去括号', cat:'代数',
      s:'所含字母相同、且相同字母的指数也相同的项叫同类项，整式加减的本质就是合并同类项。',
      p:['同类项只与字母及字母的指数有关，与系数、字母顺序无关。','括号前是「+」号，去括号后各项符号不变；括号前是「-」号，去括号后各项都变号。','合并同类项时系数相加，字母和字母的指数保持不变。'],
      f:['a + (b - c) = a + b - c','a - (b - c) = a - b + c'],
      e:{ q:'化简：3a²b - 2ab² + a²b - ab²', st:['把同类项分组：(3a²b + a²b) + (-2ab² - ab²)','系数相加：4a²b + (-3ab²)'], a:'4a²b - 3ab²' } },
    { id:'k03', g:7, c:'一元一次方程', t:'解法与实际应用', cat:'代数',
      s:'只含一个未知数、未知数次数为 1 的等式叫一元一次方程，解法核心是等式的基本性质。',
      p:['解方程五步：去分母、去括号、移项、合并同类项、系数化为 1。','移项必须变号；去分母时不含分母的项也要乘公倍数。','应用题关键是找等量关系，常见类型有行程、工程、销售利润问题。'],
      f:['等式性质：a = b → a ± c = b ± c；a = b → ac = bc (c≠0)','利润 = 售价 - 进价；利润率 = 利润 ÷ 进价 × 100%'],
      e:{ q:'解方程：2(x - 1) = 3x + 4', st:['去括号：2x - 2 = 3x + 4','移项：2x - 3x = 4 + 2','合并：-x = 6，系数化为 1'], a:'x = -6' } },
    { id:'k04', g:7, c:'几何图形初步', t:'线段、角与余角补角', cat:'几何',
      s:'点、线、面、体构成几何图形，线段与角是最基本的几何对象。',
      p:['两点确定一条直线；两点之间线段最短，线段的长度叫两点间的距离。','若两角之和为 90° 互为余角，之和为 180° 互为补角。','同角（等角）的余角相等，同角（等角）的补角相等。'],
      f:['1° = 60′，1′ = 60″','∠α 的余角 = 90° - ∠α；补角 = 180° - ∠α'],
      e:{ q:'一个角的补角等于它本身的 3 倍，求这个角的度数。', st:['设这个角为 x°，则补角为 180° - x°','依题意：180 - x = 3x','解得 4x = 180，x = 45'], a:'45°' } },
    { id:'k05', g:7, c:'相交线与平行线', t:'平行线的判定与性质', cat:'几何',
      s:'同位角、内错角、同旁内角是判断两直线位置关系的核心角。',
      p:['判定：同位角相等 / 内错角相等 / 同旁内角互补 → 两直线平行。','性质：两直线平行 → 同位角相等、内错角相等、同旁内角互补。','平行于同一直线的两直线互相平行；过直线外一点有且只有一条直线与已知直线平行。'],
      f:['判定与性质互为逆命题：由角的关系推平行，由平行推角的关系','两直线平行，同旁内角之和 = 180°'],
      e:{ q:'两直线平行，一个同旁内角为 70°，求另一个同旁内角。', st:['两直线平行，同旁内角互补','180° - 70° = 110°'], a:'110°' } },
    { id:'k06', g:7, c:'实数', t:'平方根、立方根与无理数', cat:'代数',
      s:'无限不循环小数叫无理数，有理数与无理数统称实数，实数与数轴上的点一一对应。',
      p:['正数有两个互为相反数的平方根，0 的平方根是 0，负数没有平方根。','算术平方根 √a (a≥0) 恒为非负；任意实数都有唯一立方根。','常见无理数：开方开不尽的数、π、有规律但不循环的小数。'],
      f:['(√a)² = a (a≥0)；√(a²) = |a|','³√(-a) = -³√a'],
      e:{ q:'√16 的算术平方根是多少？', st:['先算 √16 = 4','题目求的是 4 的算术平方根','√4 = 2'], a:'2（易错：不是 4）' } },
    { id:'k07', g:7, c:'平面直角坐标系', t:'点的坐标特征', cat:'函数',
      s:'在平面内画两条互相垂直、原点重合的数轴，就建立了平面直角坐标系。',
      p:['第一象限 (+,+)，第二象限 (-,+)，第三象限 (-,-)，第四象限 (+,-)。','关于 x 轴对称：横坐标不变、纵坐标变号；关于 y 轴对称：纵坐标不变、横坐标变号。','关于原点对称：横纵坐标都变号；坐标轴上的点不属于任何象限。'],
      f:['点 P(x, y) 到 x 轴距离 = |y|，到 y 轴距离 = |x|','P(x,y) 关于原点对称点为 (-x, -y)'],
      e:{ q:'点 A(2, -3) 关于 x 轴对称的点坐标是？', st:['关于 x 轴对称，横坐标不变','纵坐标取相反数：-3 → 3'], a:'(2, 3)' } },
    { id:'k08', g:7, c:'二元一次方程组', t:'代入消元与加减消元', cat:'代数',
      s:'含有两个未知数、每个未知数次数都是 1 的方程组，基本思路是「消元」转化为一元一次方程。',
      p:['代入消元法：用一个未知数表示另一个未知数，再代入另一个方程。','加减消元法：把某未知数系数化为相同或相反，两式相减或相加。','实际应用注意检验解是否符合实际意义（如人数、件数为非负整数）。'],
      f:['代入法适合某个系数为 ±1 的方程组','加减法适合同一未知数系数成倍数关系的方程组'],
      e:{ q:'解方程组：x + y = 5，x - y = 1', st:['两式相加消去 y：2x = 6，得 x = 3','代入第一式：3 + y = 5，得 y = 2'], a:'x = 3，y = 2' } },
    { id:'k09', g:7, c:'一元一次不等式', t:'解法与数轴表示', cat:'代数',
      s:'用不等号表示不等关系的式子叫不等式，解法与方程类似，但要特别注意变号规则。',
      p:['不等式两边同乘或同除以一个负数，不等号方向必须改变。','解集在数轴上表示：大于向右，小于向左；含等号画实心点，不含等号画空心圈。','不等式组的解集是各不等式解集的公共部分，口诀：大大取大、小小取小、大小小大中间找。'],
      f:['a > b，c < 0 → ac < bc','大小小大中间找：x > a 且 x < b (a<b) → a < x < b'],
      e:{ q:'解不等式：-2x > 6', st:['两边同除以 -2（负数）','不等号方向改变'], a:'x < -3' } },
    { id:'k10', g:7, c:'数据的收集与整理', t:'频数分布与统计图', cat:'统计',
      s:'收集数据后用统计表和统计图描述，才能直观看出数据的分布规律。',
      p:['频数是落在各组内的数据个数，频率 = 频数 ÷ 数据总数，各组频率之和为 1。','条形图看数量多少，折线图看变化趋势，扇形图看各部分占总体的百分比。','扇形图中某部分圆心角 = 该部分百分比 × 360°。'],
      f:['频率 = 频数 / 总数','圆心角 = 频率 × 360°'],
      e:{ q:'50 个数据中某组频数为 10，求该组频率和扇形图圆心角。', st:['频率 = 10 ÷ 50 = 0.2','圆心角 = 0.2 × 360° = 72°'], a:'频率 0.2，圆心角 72°' } },

    { id:'k11', g:8, c:'三角形', t:'三边关系与内角和', cat:'几何',
      s:'由不在同一直线上的三条线段首尾顺次相接组成的图形叫三角形。',
      p:['任意两边之和大于第三边，任意两边之差小于第三边（判断能否构成三角形）。','三角形内角和等于 180°；一个外角等于与它不相邻的两个内角之和。','三角形具有稳定性；按角分为锐角、直角、钝角三角形。'],
      f:['|a - b| < c < a + b','∠A + ∠B + ∠C = 180°'],
      e:{ q:'三角形两边长为 3 和 7，第三边 x 的取值范围？', st:['两边之差 < 第三边：7 - 3 = 4','两边之和 > 第三边：7 + 3 = 10'], a:'4 < x < 10' } },
    { id:'k12', g:8, c:'全等三角形', t:'全等的判定 SSS/SAS/ASA/AAS/HL', cat:'几何',
      s:'能够完全重合的两个三角形叫全等三角形，对应边、对应角分别相等。',
      p:['一般三角形判定：SSS、SAS、ASA、AAS；直角三角形另有 HL。','SSA（两边及其中一边的对角）和 AAA（三个角）不能判定全等。','证全等时常需先找隐含条件：公共边、公共角、对顶角、平行带来的等角。'],
      f:['HL：斜边和一条直角边对应相等的两个直角三角形全等','全等三角形对应边相等、对应角相等、面积相等'],
      e:{ q:'下列条件中，不能判定两个三角形全等的是？', st:['SSS、SAS、ASA、AAS 均可判定全等','三个角对应相等（AAA）只能判定相似，大小可能不同'], a:'AAA（三个角对应相等）' } },
    { id:'k13', g:8, c:'轴对称与等腰三角形', t:'性质与判定', cat:'几何',
      s:'等腰三角形是轴对称图形，顶角平分线、底边上的中线和高「三线合一」。',
      p:['等边对等角：两底角相等；等角对等边可判定等腰三角形。','三线合一：顶角平分线、底边中线、底边上的高互相重合。','已知等腰三角形边长时，必须用三边关系检验能否构成三角形。'],
      f:['等腰三角形底角 = (180° - 顶角) ÷ 2','等边三角形每个内角 = 60°，有 3 条对称轴'],
      e:{ q:'等腰三角形两边长为 3 和 7，求周长。', st:['若腰为 3：3 + 3 = 6 < 7，不能构成三角形','只能腰为 7、底为 3：7 + 7 > 3 成立','周长 = 7 + 7 + 3 = 17'], a:'17' } },
    { id:'k14', g:8, c:'整式的乘法与因式分解', t:'乘法公式与因式分解', cat:'代数',
      s:'整式乘法与因式分解是互逆变形，乘法公式是化简与分解的核心工具。',
      p:['同底数幂相乘底数不变、指数相加；幂的乘方指数相乘。','平方差与完全平方公式要能正用、逆用、变形用。','因式分解顺序：先提公因式，再套公式，最后检查是否分解彻底。'],
      f:['(a + b)(a - b) = a² - b²','(a ± b)² = a² ± 2ab + b²'],
      e:{ q:'把 x² - 6x + 9 分解因式。', st:['观察：首项 x²，末项 9 = 3²，中间项 -6x = -2 · x · 3','符合完全平方公式 a² - 2ab + b² = (a - b)²'], a:'(x - 3)²' } },
    { id:'k15', g:8, c:'分式', t:'分式运算与分式方程', cat:'代数',
      s:'分母中含有字母的式子叫分式，分式有意义的条件是分母不为零。',
      p:['分式值为 0 的条件：分子为 0 且分母不为 0。','约分、通分的依据是分式的基本性质；异分母相加减要先通分。','解分式方程必须验根：使最简公分母为 0 的根是增根，要舍去。'],
      f:['A/B = (A·M)/(B·M) (M ≠ 0)','a/b ± c/d = (ad ± bc)/bd'],
      e:{ q:'解方程：2/x = 1/(x - 1)', st:['两边同乘 x(x-1)：2(x - 1) = x','2x - 2 = x，解得 x = 2','检验：x = 2 时分母都不为 0，是原方程的解'], a:'x = 2' } },
    { id:'k16', g:8, c:'二次根式', t:'化简与运算', cat:'代数',
      s:'形如 √a (a≥0) 的式子叫二次根式，结果要化为最简二次根式。',
      p:['被开方数不含分母、且不含能开得尽方的因数或因式，才是最简形式。','同类二次根式（化简后被开方数相同）才能合并。','分母有理化常用平方差公式：分子分母同乘分母的有理化因式。'],
      f:['√a · √b = √(ab) (a≥0, b≥0)','√a / √b = √(a/b) (a≥0, b>0)'],
      e:{ q:'化简：√12 × √2', st:['先化简：√12 = √(4×3) = 2√3','√12 × √2 = √24 = √(4×6) = 2√6','或先相乘再化简，结果一致'], a:'2√6' } },
    { id:'k17', g:8, c:'勾股定理', t:'定理及逆定理', cat:'几何',
      s:'直角三角形两直角边的平方和等于斜边的平方，是最经典的几何定理之一。',
      p:['已知两边求第三边时用 a² + b² = c²，注意先判断哪条是斜边。','逆定理：若 a² + b² = c²，则该三角形是直角三角形。','常见勾股数：3,4,5；5,12,13；6,8,10；7,24,25；8,15,17。'],
      f:['a² + b² = c²（c 为斜边）','c = √(a² + b²)；a = √(c² - b²)'],
      e:{ q:'直角三角形斜边 13，一条直角边 5，求另一条直角边。', st:['设另一条直角边为 b','b² = 13² - 5² = 169 - 25 = 144'], a:'b = 12' } },
    { id:'k18', g:8, c:'平行四边形', t:'性质与判定', cat:'几何',
      s:'两组对边分别平行的四边形叫平行四边形，是特殊平行四边形的基础。',
      p:['性质：对边平行且相等、对角相等、邻角互补、对角线互相平分。','判定：两组对边分别平行/相等、一组对边平行且相等、对角线互相平分。','平行四边形是中心对称图形，对称中心是两条对角线的交点。'],
      f:['周长 = 2(a + b)（a、b 为邻边）','邻角互补：∠A + ∠B = 180°'],
      e:{ q:'平行四边形周长为 40，两邻边之比为 3:2，求两边长。', st:['设两邻边为 3t 和 2t','2(3t + 2t) = 40，得 10t = 40，t = 4'], a:'12 和 8' } },
    { id:'k19', g:8, c:'特殊的平行四边形', t:'矩形、菱形、正方形', cat:'几何',
      s:'在平行四边形基础上加一个角或一组邻边的特殊条件，得到矩形、菱形、正方形。',
      p:['矩形：有一个角是直角，四个角都是直角，对角线相等且互相平分。','菱形：一组邻边相等，四边相等，对角线互相垂直平分且平分一组对角。','正方形兼具矩形和菱形的全部性质；菱形面积 = 对角线乘积的一半。'],
      f:['矩形对角线相等；菱形对角线互相垂直','S菱形 = (d₁ × d₂) ÷ 2'],
      e:{ q:'菱形两条对角线长为 6 和 8，求面积。', st:['菱形面积等于两对角线乘积的一半','S = (6 × 8) ÷ 2 = 24'], a:'24' } },
    { id:'k20', g:8, c:'一次函数', t:'图象与性质', cat:'函数',

  /* ===== 七年级 ===== */
  // k01 有理数
  { id:'q071', k:'k01', ty:'c', lv:1, q:'数轴上表示 -2 的点与表示 3 的点之间的距离是（ ）', o:['1','5','-5','6'], a:1, sol:'两点间距离等于两数之差的绝对值：|3 - (-2)| = 5。' },
  { id:'q072', k:'k01', ty:'f', lv:2, q:'计算：(-2)³ + (-3)² = ____', a:'1', acc:['1'], sol:'(-2)³ = -8，(-3)² = 9，-8 + 9 = 1。注意负数的奇次幂为负、偶次幂为正。' },
  { id:'q073', k:'k01', ty:'c', lv:2, q:'若 |a| = 5，则 a 的值是（ ）', o:['5','-5','5 或 -5','0'], a:2, sol:'绝对值等于 5 的数在数轴上有两个，到原点距离都是 5，即 ±5。' },
  { id:'q074', k:'k01', ty:'c', lv:3, q:'已知 |x - 2| + (y + 3)² = 0，则 x + y =（ ）', o:['-1','1','5','-5'], a:0, sol:'绝对值与平方都是非负数，和为 0 只能各自为 0：x = 2，y = -3，所以 x + y = -1。' },

  // k02 整式的加减
  { id:'q075', k:'k02', ty:'c', lv:1, q:'下列计算正确的是（ ）', o:['3a + 2b = 5ab','3a + 2a = 5a','5a - 3a = 2','3a² + 2a³ = 5a⁵'], a:1, sol:'只有同类项才能合并：3a + 2a = 5a；5a - 3a = 2a 而不是 2；字母或指数不同的项不能合并。' },
  { id:'q076', k:'k02', ty:'f', lv:2, q:'化简：2(3x - 1) - 3(x - 2) = ____', a:'3x+4', acc:['3x+4','3x + 4'], sol:'去括号得 6x - 2 - 3x + 6，合并同类项得 3x + 4。注意 -3 乘进括号时 -2 变为 +6。' },
  { id:'q077', k:'k02', ty:'c', lv:2, q:'多项式 3x²y - 2xy² + 5 的次数是（ ）', o:['2','3','4','5'], a:1, sol:'3x²y 的次数为 2+1 = 3，-2xy² 也是 3，常数项次数为 0，故多项式次数为 3。' },
  { id:'q078', k:'k02', ty:'c', lv:3, q:'若 A = 2x² - 3x + 1，B = x² + 2x - 3，则 A - 2B =（ ）', o:['-7x + 7','-7x - 5','3x² - 7x + 7','4x² + x - 5'], a:0, sol:'A - 2B = 2x² - 3x + 1 - 2x² - 4x + 6 = -7x + 7，二次项恰好抵消。' },

  // k03 一元一次方程
  { id:'q079', k:'k03', ty:'f', lv:1, q:'方程 3x - 6 = 0 的解是 x = ____', a:'2', acc:['2','x=2'], sol:'3x = 6，两边同除以 3 得 x = 2。' },
  { id:'q080', k:'k03', ty:'c', lv:2, q:'方程 (x-1)/2 = (2x+1)/3 的解是（ ）', o:['x = 5','x = -5','x = 1','x = -1'], a:1, sol:'去分母（两边乘 6）：3(x-1) = 2(2x+1) → 3x - 3 = 4x + 2 → x = -5。' },
  { id:'q081', k:'k03', ty:'c', lv:2, q:'若 x = 2 是方程 ax - 3 = 5 的解，则 a =（ ）', o:['1','2','4','8'], a:2, sol:'把 x = 2 代入：2a - 3 = 5 → 2a = 8 → a = 4。' },
  { id:'q082', k:'k03', ty:'f', lv:3, q:'某商品进价 100 元、标价 200 元，打 x 折销售后利润率为 20%，则 x = ____', a:'6', acc:['6','6折'], sol:'售价 = 100 × (1 + 20%) = 120 元；200 × x/10 = 120，解得 x = 6，即六折。' },

  // k04 几何图形初步
  { id:'q083', k:'k04', ty:'c', lv:1, q:'关于直线、射线与线段，下列说法正确的是（ ）', o:['两点之间直线最短','两点之间线段最短','过三点一定能画一条直线','射线可以度量长度'], a:1, sol:'两点之间线段最短，线段的长度叫两点间的距离；直线向两方无限延伸，无法度量。' },
  { id:'q084', k:'k04', ty:'f', lv:2, q:'计算：32°15′ + 28°45′ = ____ 度', a:'61', acc:['61','61°'], sol:'15′ + 45′ = 60′ = 1°，32° + 28° + 1° = 61°。角度是六十进制。' },
  { id:'q085', k:'k04', ty:'c', lv:2, q:'一个角的余角是 27°，则它的补角是（ ）', o:['63°','117°','153°','27°'], a:1, sol:'这个角 = 90° - 27° = 63°，补角 = 180° - 63° = 117°。' },
  { id:'q086', k:'k04', ty:'c', lv:3, q:'时钟 3 点整时，时针与分针的夹角是（ ）', o:['30°','60°','90°','120°'], a:2, sol:'钟面 12 大格每格 30°，3 点整分针指向 12、时针指向 3，相隔 3 格即 90°。' },

  // k05 相交线与平行线
  { id:'q087', k:'k05', ty:'c', lv:1, q:'关于同位角，下列说法正确的是（ ）', o:['同位角一定相等','两直线平行时同位角相等','同位角一定互补','同位角是对顶角'], a:1, sol:'同位角只是一种位置关系，只有在两直线平行的前提下才相等。' },
  { id:'q088', k:'k05', ty:'f', lv:2, q:'两直线平行，一个内错角为 55°，则另一个内错角为 ____ 度', a:'55', acc:['55','55°'], sol:'两直线平行，内错角相等，所以也是 55°。' },
  { id:'q089', k:'k05', ty:'c', lv:2, q:'两条平行线间的距离是指（ ）', o:['两平行线间任意线段的长度','两平行线间垂线段的长度','一条直线上两点间的距离','两平行线间斜线段的长度'], a:1, sol:'公垂线段最短且其长度处处相等，这个长度定义为两平行线间的距离。' },
  { id:'q090', k:'k05', ty:'c', lv:3, q:'两直线平行，∠1 与 ∠2 是同旁内角且 ∠1 = 2∠2，则 ∠1 =（ ）', o:['60°','90°','120°','150°'], a:2, sol:'同旁内角互补：∠1 + ∠2 = 180°，即 3∠2 = 180°，∠2 = 60°，∠1 = 120°。' },

  // k06 实数
  { id:'q091', k:'k06', ty:'c', lv:1, q:'下列各数中，是无理数的是（ ）', o:['0.5','-3','22/7','√2'], a:3, sol:'√2 是开方开不尽的数，为无限不循环小数；22/7 是分数，属于有理数。' },
  { id:'q092', k:'k06', ty:'f', lv:2, q:'计算：³√(-27) = ____', a:'-3', acc:['-3'], sol:'(-3)³ = -27，所以 -27 的立方根是 -3；负数没有平方根但有立方根。' },
  { id:'q093', k:'k06', ty:'c', lv:2, q:'√((-5)²) 的值是（ ）', o:['-5','5','±5','25'], a:1, sol:'先算 (-5)² = 25，再算 √25 = 5；也可直接用 √(a²) = |a| = 5。' },
  { id:'q094', k:'k06', ty:'c', lv:3, q:'若 √(a-1) + |b+2| = 0，则 a + b =（ ）', o:['-1','1','3','-3'], a:0, sol:'算术平方根与绝对值都非负，和为 0 则各自为 0：a = 1，b = -2，a + b = -1。' },

  // k07 平面直角坐标系
  { id:'q095', k:'k07', ty:'c', lv:1, q:'点 (0, -4) 在（ ）', o:['x 轴正半轴','x 轴负半轴','y 轴正半轴','y 轴负半轴'], a:3, sol:'横坐标为 0 说明在 y 轴上，纵坐标为负说明在 y 轴负半轴；坐标轴上的点不属于任何象限。' },
  { id:'q096', k:'k07', ty:'f', lv:2, q:'点 P(-3, 4) 到 x 轴的距离是 ____', a:'4', acc:['4'], sol:'点到 x 轴的距离等于纵坐标的绝对值 |4| = 4；到 y 轴的距离才是 |−3| = 3。' },
  { id:'q097', k:'k07', ty:'c', lv:2, q:'点 A(1, -2) 向右平移 3 个单位、再向上平移 2 个单位后的坐标是（ ）', o:['(4, 0)','(-2, 0)','(4, -4)','(-2, -4)'], a:0, sol:'右移横坐标加 3：1 + 3 = 4；上移纵坐标加 2：-2 + 2 = 0，得 (4, 0)。' },
  { id:'q098', k:'k07', ty:'c', lv:3, q:'若点 P(a-1, a+2) 在 y 轴上，则 a =（ ）', o:['-2','0','1','2'], a:2, sol:'y 轴上的点横坐标为 0：a - 1 = 0，得 a = 1，此时 P(0, 3)。' },

  // k08 二元一次方程组
  { id:'q099', k:'k08', ty:'f', lv:1, q:'已知 x = 2 且 x + y = 5，则 y = ____', a:'3', acc:['3','y=3'], sol:'把 x = 2 代入 x + y = 5，得 y = 3。' },
  { id:'q100', k:'k08', ty:'c', lv:2, q:'方程组 2x + y = 7，x + 2y = 8 的解是（ ）', o:['x=2, y=3','x=3, y=2','x=1, y=5','x=4, y=-1'], a:0, sol:'两式相加得 3x + 3y = 15 即 x + y = 5；与 2x + y = 7 相减得 x = 2，y = 3。' },
  { id:'q101', k:'k08', ty:'c', lv:2, q:'若 x = 1，y = -1 是方程 2x - ay = 5 的解，则 a =（ ）', o:['-3','3','1','-1'], a:1, sol:'代入得 2 - a×(-1) = 5，即 2 + a = 5，a = 3。' },
  { id:'q102', k:'k08', ty:'f', lv:3, q:'若 2x + y = 10 且 x - y = 2，则 x = ____', a:'4', acc:['4','x=4'], sol:'两式相加消去 y：3x = 12，x = 4，代回得 y = 2。' },

  // k09 一元一次不等式
  { id:'q103', k:'k09', ty:'c', lv:1, q:'不等式 2x - 4 ≥ 0 的解集是（ ）', o:['x ≥ 2','x ≤ 2','x > 2','x ≥ 4'], a:0, sol:'2x ≥ 4，两边同除以正数 2，不等号方向不变，得 x ≥ 2。' },
  { id:'q104', k:'k09', ty:'f', lv:2, q:'不等式 3x - 2 < 7 的正整数解共有 ____ 个', a:'2', acc:['2','2个'], sol:'3x < 9 → x < 3，正整数解为 1 和 2，共 2 个。' },
  { id:'q105', k:'k09', ty:'c', lv:2, q:'若 a < b，下列不等式一定成立的是（ ）', o:['a - 3 > b - 3','-2a < -2b','a - 3 < b - 3','a² < b²'], a:2, sol:'两边同减 3 不改变不等号方向；同乘 -2 应变号；a² < b² 在 a、b 含负数时不一定成立。' },
  { id:'q106', k:'k09', ty:'c', lv:3, q:'若不等式组 x > m 且 x ≤ 3 有解，则 m 满足（ ）', o:['m > 3','m ≥ 3','m < 3','m ≤ 0'], a:2, sol:'要有公共部分，需 m < 3，此时解集为 m < x ≤ 3；m = 3 时 x > 3 与 x ≤ 3 无公共部分。' },

  // k10 数据的收集与整理
  { id:'q107', k:'k10', ty:'c', lv:1, q:'要清楚表示各部分占总体的百分比，最适合的统计图是（ ）', o:['条形统计图','折线统计图','扇形统计图','频数分布直方图'], a:2, sol:'扇形图用圆心角大小表示各部分占比；条形图看数量，折线图看变化趋势。' },
  { id:'q108', k:'k10', ty:'f', lv:2, q:'一组数据共 200 个，某组频率为 0.15，则该组频数为 ____', a:'30', acc:['30'], sol:'频数 = 总数 × 频率 = 200 × 0.15 = 30。' },
  { id:'q109', k:'k10', ty:'c', lv:2, q:'在频数分布直方图中，各小长方形的高之比等于（ ）', o:['组距之比','频数之比','频率之和','数据总数'], a:1, sol:'组距相等时，小长方形的高与频数成正比，故高之比等于频数之比。' },
  { id:'q110', k:'k10', ty:'c', lv:3, q:'扇形统计图中某部分圆心角为 72°，则该部分占总体的（ ）', o:['10%','20%','25%','30%'], a:1, sol:'72° ÷ 360° = 0.2 = 20%。' },

  /* ===== 八年级 ===== */
  // k11 三角形
  { id:'q111', k:'k11', ty:'c', lv:1, q:'三角形一个外角为 120°，与它不相邻的一个内角为 50°，则另一个不相邻内角为（ ）', o:['50°','60°','70°','110°'], a:2, sol:'外角等于与它不相邻的两个内角之和：120° - 50° = 70°。' },
  { id:'q112', k:'k11', ty:'f', lv:2, q:'三角形两边长为 5 和 9，第三边长为整数，则第三边最大可取 ____', a:'13', acc:['13'], sol:'由三边关系 4 < c < 14，最大整数为 13。' },
  { id:'q113', k:'k11', ty:'c', lv:2, q:'三角形三个内角之比为 2:3:4，则最大角为（ ）', o:['40°','60°','80°','100°'], a:2, sol:'总份数 9，每份 180° ÷ 9 = 20°，最大角 4 × 20° = 80°。' },
  { id:'q114', k:'k11', ty:'c', lv:3, q:'三角形三个内角之比为 3:4:5，则这个三角形是（ ）', o:['锐角三角形','直角三角形','钝角三角形','等腰三角形'], a:0, sol:'每份 180° ÷ 12 = 15°，三角分别为 45°、60°、75°，都小于 90°，是锐角三角形。' },

  // k12 全等三角形
  { id:'q115', k:'k12', ty:'c', lv:1, q:'两个全等三角形的对应边（ ）', o:['相等','成比例','互相垂直','和为 180°'], a:0, sol:'全等即能够完全重合，对应边相等、对应角相等、面积相等。' },
  { id:'q116', k:'k12', ty:'c', lv:2, q:'下列条件能判定 △ABC ≌ △DEF 的是（ ）', o:['AB=DE，∠A=∠D，AC=DF','AB=DE，BC=EF，∠A=∠D','∠A=∠D，∠B=∠E，∠C=∠F','AB=DE，AC=DF，∠B=∠E'], a:0, sol:'两边及其夹角对应相等（SAS）可判定全等；其余分别是 SSA、AAA、SSA，均不能判定。' },
  { id:'q117', k:'k12', ty:'c', lv:2, q:'用尺规作一个角等于已知角，其理论依据是（ ）', o:['SSS','SAS','ASA','AAS'], a:0, sol:'作图时保证三边对应相等，由 SSS 判定两个三角形全等，从而对应角相等。' },
  { id:'q118', k:'k12', ty:'c', lv:3, q:'关于全等与面积，下列说法正确的是（ ）', o:['面积相等的两个三角形一定全等','全等三角形面积一定相等','周长相等的两个三角形一定全等','三个角相等的两个三角形一定全等'], a:1, sol:'全等则面积必相等；反之不成立，等底等高的三角形面积相等但形状可以不同。' },

  // k13 轴对称与等腰三角形
  { id:'q119', k:'k13', ty:'c', lv:1, q:'下列图形中，对称轴条数最多的是（ ）', o:['等腰三角形','等边三角形','正方形','圆'], a:3, sol:'圆有无数条对称轴（每条直径所在直线）；正方形 4 条，等边三角形 3 条，等腰三角形 1 条。' },
  { id:'q120', k:'k13', ty:'f', lv:2, q:'等腰三角形的一个角为 100°，则它的底角是 ____ 度', a:'40', acc:['40','40°'], sol:'100° 只能是顶角（底角为 100° 会超过内角和），底角 = (180° - 100°) ÷ 2 = 40°。' },
  { id:'q121', k:'k13', ty:'c', lv:2, q:'等边三角形共有对称轴（ ）', o:['1 条','2 条','3 条','6 条'], a:2, sol:'等边三角形每条边上的高所在直线都是对称轴，共 3 条。' },
  { id:'q122', k:'k13', ty:'c', lv:3, q:'等腰三角形底边上的高把顶角平分成 25°，则它的底角为（ ）', o:['25°','50°','65°','130°'], a:2, sol:'顶角 = 2 × 25° = 50°，底角 = (180° - 50°) ÷ 2 = 65°，体现三线合一。' },

  // k14 整式的乘法与因式分解
  { id:'q123', k:'k14', ty:'c', lv:1, q:'计算 (2a)³ 的结果是（ ）', o:['2a³','6a³','8a³','8a'], a:2, sol:'积的乘方等于各因式乘方的积：2³ × a³ = 8a³。' },
  { id:'q124', k:'k14', ty:'f', lv:2, q:'把 x² - 4x 分解因式，结果是 ____', a:'x(x-4)', acc:['x(x-4)','x(x - 4)'], sol:'提取公因式 x，得 x(x - 4)。因式分解要先提公因式。' },
  { id:'q125', k:'k14', ty:'c', lv:2, q:'化简 (a - b)² + 2ab 的结果是（ ）', o:['a² + b²','a² - b²','(a + b)²','a² - 2ab + b²'], a:0, sol:'(a² - 2ab + b²) + 2ab = a² + b²。' },
  { id:'q126', k:'k14', ty:'f', lv:3, q:'已知 a + b = 5，ab = 3，则 a² + b² = ____', a:'19', acc:['19'], sol:'a² + b² = (a+b)² - 2ab = 25 - 6 = 19，这是完全平方公式的常用变形。' },

  // k15 分式
  { id:'q127', k:'k15', ty:'c', lv:1, q:'当 x 取何值时，分式 (x+1)/(x-3) 无意义（ ）', o:['x = -1','x = 0','x = 3','任意实数'], a:2, sol:'分母为 0 时分式无意义：x - 3 = 0，即 x = 3。' },
  { id:'q128', k:'k15', ty:'f', lv:2, q:'化简：(a² - 1)/(a + 1) = ____', a:'a-1', acc:['a-1','a - 1'], sol:'分子用平方差公式分解为 (a+1)(a-1)，约去公因式 a+1 得 a - 1。' },
  { id:'q129', k:'k15', ty:'c', lv:2, q:'计算 1/x + 1/(2x) 的结果是（ ）', o:['1/(3x)','2/(3x)','3/(2x)','1/(2x²)'], a:2, sol:'通分为 2/(2x) + 1/(2x) = 3/(2x)。' },
  { id:'q130', k:'k15', ty:'c', lv:3, q:'若分式 (x²-4)/(x-2) 的值为 0，则 x =（ ）', o:['2','-2','±2','0'], a:1, sol:'分子为 0 得 x = ±2，但 x = 2 使分母为 0 必须舍去，故 x = -2。分式值为 0 要同时满足分子为 0 且分母不为 0。' },

  // k16 二次根式
  { id:'q131', k:'k16', ty:'c', lv:1, q:'要使 √(x-3) 有意义，则 x 满足（ ）', o:['x > 3','x ≥ 3','x < 3','x ≠ 3'], a:1, sol:'二次根式的被开方数必须非负：x - 3 ≥ 0，即 x ≥ 3。' },
  { id:'q132', k:'k16', ty:'f', lv:2, q:'计算：√18 - √8 = ____', a:'√2', acc:['√2','1√2'], sol:'√18 = 3√2，√8 = 2√2，同类二次根式相减得 √2。' },
  { id:'q133', k:'k16', ty:'c', lv:2, q:'下列与 √3 是同类二次根式的是（ ）', o:['√6','√9','√12','√18'], a:2, sol:'√12 = 2√3，化简后被开方数为 3，与 √3 是同类二次根式；√9 = 3，√18 = 3√2。' },
  { id:'q134', k:'k16', ty:'f', lv:3, q:'计算：(√5 + 2)(√5 - 2) = ____', a:'1', acc:['1'], sol:'用平方差公式：(√5)² - 2² = 5 - 4 = 1。' },

  // k17 勾股定理
  { id:'q135', k:'k17', ty:'c', lv:1, q:'直角三角形两直角边为 6 和 8，斜边长为（ ）', o:['10','12','14','100'], a:0, sol:'√(6² + 8²) = √100 = 10，是常见勾股数 6,8,10。' },
  { id:'q136', k:'k17', ty:'f', lv:2, q:'直角三角形斜边为 25，一条直角边为 7，另一条直角边为 ____', a:'24', acc:['24'], sol:'√(25² - 7²) = √(625 - 49) = √576 = 24，勾股数 7,24,25。' },
  { id:'q137', k:'k17', ty:'c', lv:2, q:'等腰直角三角形的直角边为 1，则斜边为（ ）', o:['1','√2','2','√3'], a:1, sol:'√(1² + 1²) = √2。' },
  { id:'q138', k:'k17', ty:'c', lv:3, q:'直角三角形两直角边为 5 和 12，则斜边上的高为（ ）', o:['60/13','30/13','12','13'], a:0, sol:'斜边 13，面积 = 5×12÷2 = 30，又面积 = 13×h÷2，故 h = 60/13。' },

  // k18 平行四边形
  { id:'q139', k:'k18', ty:'c', lv:1, q:'平行四边形的对角线（ ）', o:['相等','互相垂直','互相平分','平分一组对角'], a:2, sol:'平行四边形对角线互相平分；对角线相等是矩形性质，互相垂直是菱形性质。' },
  { id:'q140', k:'k18', ty:'f', lv:2, q:'平行四边形 ABCD 中，∠A = 65°，则 ∠C = ____ 度', a:'65', acc:['65','65°'], sol:'平行四边形对角相等，∠C = ∠A = 65°；邻角 ∠B 才是 115°。' },
  { id:'q141', k:'k18', ty:'c', lv:2, q:'平行四边形周长为 30，一边长为 8，则其邻边长为（ ）', o:['6','7','8','11'], a:1, sol:'周长 = 2(a + b)，即 2(8 + b) = 30，b = 7。' },
  { id:'q142', k:'k18', ty:'c', lv:3, q:'平行四边形两条对角线长 6 和 10，则它的一边长 x 满足（ ）', o:['2 < x < 8','4 < x < 16','3 < x < 5','1 < x < 4'], a:0, sol:'对角线互相平分，半对角线 3 和 5 与一边构成三角形，由三边关系 5 - 3 < x < 5 + 3，即 2 < x < 8。' },

  // k19 特殊的平行四边形
  { id:'q143', k:'k19', ty:'c', lv:1, q:'矩形的对角线（ ）', o:['互相垂直','相等且互相平分','平分一组对角','长度等于边长'], a:1, sol:'矩形是有一个角为直角的平行四边形，对角线相等且互相平分。' },
  { id:'q144', k:'k19', ty:'f', lv:2, q:'菱形边长为 5，一条对角线长为 6，则另一条对角线长为 ____', a:'8', acc:['8'], sol:'菱形对角线互相垂直平分，半对角线与边构成直角三角形：(6/2)² + (d/2)² = 5² → 9 + (d/2)² = 25 → d/2 = 4，d = 8。' },
  { id:'q145', k:'k19', ty:'c', lv:2, q:'正方形对角线长为 4，则它的面积为（ ）', o:['4','8','16','2√2'], a:1, sol:'正方形面积 = 对角线² ÷ 2 = 16 ÷ 2 = 8；边长 = 4/√2 = 2√2，边长平方也是 8。' },
  { id:'q146', k:'k19', ty:'c', lv:3, q:'顺次连接矩形四边中点所得的四边形是（ ）', o:['矩形','菱形','正方形','平行四边形'], a:1, sol:'由三角形中位线定理，新四边形四边都等于矩形对角线的一半，故四边相等为菱形。' },

  // k20 一次函数
  { id:'q147', k:'k20', ty:'c', lv:1, q:'一次函数 y = 3x - 6 与 x 轴的交点是（ ）', o:['(0, -6)','(2, 0)','(0, 2)','(-2, 0)'], a:1, sol:'令 y = 0：3x - 6 = 0，x = 2，交点为 (2, 0)；与 y 轴交点才是 (0, -6)。' },
  { id:'q148', k:'k20', ty:'f', lv:2, q:'一次函数 y = -x + 4 中，当 x = 3 时，y = ____', a:'1', acc:['1'], sol:'y = -3 + 4 = 1。' },
  { id:'q149', k:'k20', ty:'c', lv:2, q:'直线 y = 2x - 1 不经过（ ）', o:['第一象限','第二象限','第三象限','第四象限'], a:1, sol:'k > 0 图象上升，b = -1 < 0 与 y 轴交于负半轴，图象经过第一、三、四象限，不经过第二象限。' },
  { id:'q150', k:'k20', ty:'c', lv:3, q:'把直线 y = 2x + 1 向下平移 3 个单位，所得解析式为（ ）', o:['y = 2x + 4','y = 2x - 2','y = 5x + 1','y = 2(x-3) + 1'], a:1, sol:'上下平移只改变 b：1 - 3 = -2，得 y = 2x - 2，斜率不变。' },

  // k21 数据的分析
  { id:'q151', k:'k21', ty:'c', lv:1, q:'数据 3, 5, 7, 9 的平均数是（ ）', o:['5','6','7','8'], a:1, sol:'(3 + 5 + 7 + 9) ÷ 4 = 24 ÷ 4 = 6。' },
  { id:'q152', k:'k21', ty:'f', lv:2, q:'数据 2, 4, 4, 6, 9 的中位数是 ____', a:'4', acc:['4'], sol:'已按从小到大排列，共 5 个数，中间第 3 个是 4。' },
  { id:'q153', k:'k21', ty:'c', lv:2, q:'数据 1, 2, 3, 4, 5 的极差是（ ）', o:['2','3','4','5'], a:2, sol:'极差 = 最大值 - 最小值 = 5 - 1 = 4。' },
  { id:'q154', k:'k21', ty:'c', lv:3, q:'甲乙两组数据平均数相同，甲方差 0.5、乙方差 1.2，则（ ）', o:['甲组数据更稳定','乙组数据更稳定','两组一样稳定','无法比较'], a:0, sol:'方差越小说明波动越小、数据越稳定，0.5 < 1.2，故甲更稳定。' },

  // k22 多边形及其内角和
  { id:'q155', k:'k22', ty:'c', lv:1, q:'五边形的内角和是（ ）', o:['360°','540°','720°','900°'], a:1, sol:'(5 - 2) × 180° = 3 × 180° = 540°。' },
  { id:'q156', k:'k22', ty:'f', lv:2, q:'一个多边形的内角和为 1260°，则它的边数是 ____', a:'9', acc:['9'], sol:'(n-2) × 180 = 1260 → n - 2 = 7 → n = 9。' },
  { id:'q157', k:'k22', ty:'c', lv:2, q:'从九边形的一个顶点出发，可以引出对角线（ ）', o:['5 条','6 条','7 条','9 条'], a:1, sol:'从 n 边形一个顶点可引 (n - 3) 条对角线，9 - 3 = 6 条。' },
  { id:'q158', k:'k22', ty:'c', lv:3, q:'正多边形每个外角为 24°，则它的边数为（ ）', o:['12','15','18','20'], a:1, sol:'任意多边形外角和为 360°，360° ÷ 24° = 15。' },

  /* ===== 九年级 ===== */
  // k23 一元二次方程
  { id:'q159', k:'k23', ty:'c', lv:1, q:'方程 x² = 4 的根是（ ）', o:['x = 2','x = -2','x = ±2','x = 4'], a:2, sol:'直接开平方得 x = ±2，注意不要漏掉负根。' },
  { id:'q160', k:'k23', ty:'f', lv:2, q:'方程 x² - 3x = 0 的较大根是 ____', a:'3', acc:['3'], sol:'因式分解 x(x - 3) = 0，得 x₁ = 0，x₂ = 3，较大根为 3。' },
  { id:'q161', k:'k23', ty:'c', lv:2, q:'用配方法解 x² - 6x + 5 = 0，配方后得到（ ）', o:['(x - 3)² = 4','(x - 3)² = 14','(x - 6)² = 4','(x + 3)² = 4'], a:0, sol:'x² - 6x = -5，两边加 9：x² - 6x + 9 = 4，即 (x - 3)² = 4。' },
  { id:'q162', k:'k23', ty:'c', lv:3, q:'若方程 x² - 2x + m = 0 有两个相等的实数根，则 m =（ ）', o:['0','1','2','4'], a:1, sol:'Δ = (-2)² - 4m = 4 - 4m = 0，解得 m = 1，此时根为 x = 1。' },

  // k24 旋转与中心对称
  { id:'q163', k:'k24', ty:'c', lv:1, q:'下列图形中，既是轴对称图形又是中心对称图形的是（ ）', o:['等边三角形','平行四边形','矩形','正五边形'], a:2, sol:'矩形有两条对称轴，且绕对角线交点旋转 180° 与自身重合；一般平行四边形不是轴对称图形。' },
  { id:'q164', k:'k24', ty:'f', lv:2, q:'点 (3, 0) 绕原点逆时针旋转 90° 后的坐标是 ____（写成 (a, b) 形式）', a:'(0,3)', acc:['(0,3)','(0, 3)'], sol:'点 (x, y) 逆时针旋转 90° 变为 (-y, x)，故 (3, 0) → (0, 3)。' },
  { id:'q165', k:'k24', ty:'c', lv:2, q:'时钟的分针走 20 分钟，转过的角度是（ ）', o:['60°','90°','120°','180°'], a:2, sol:'分针每分钟转 6°，20 × 6° = 120°。' },
  { id:'q166', k:'k24', ty:'c', lv:3, q:'正三角形绕其中心至少旋转多少度能与自身重合（ ）', o:['60°','90°','120°','180°'], a:2, sol:'360° ÷ 3 = 120°，正 n 边形绕中心旋转 360°/n 的整数倍与自身重合。' },

  // k25 圆
  { id:'q167', k:'k25', ty:'c', lv:1, q:'圆中最长的弦是（ ）', o:['半径','直径','弦心距','弧'], a:1, sol:'直径是经过圆心的弦，长度为 2r，是圆中最长的弦。' },
  { id:'q168', k:'k25', ty:'f', lv:2, q:'半径为 6 的圆中，60° 圆心角所对的弧长为 ____（结果保留 π）', a:'2π', acc:['2π','2PI','2*pi'], sol:'弧长 l = (60/360) × 2πr = (1/6) × 12π = 2π。' },
  { id:'q169', k:'k25', ty:'c', lv:2, q:'圆内接四边形的对角（ ）', o:['相等','互补','互余','和为 90°'], a:1, sol:'圆内接四边形对角互补，且任一外角等于它的内对角。' },
  { id:'q170', k:'k25', ty:'c', lv:3, q:'半径为 4 的圆中，弦 AB 长为 4√2，则弦 AB 所对的圆周角为（ ）', o:['30°','45°','45° 或 135°','90°'], a:2, sol:'半弦 2√2、半径 4，弦心距 = √(16-8) = 2√2，故圆心角为 90°；优弧与劣弧所对圆周角分别为 135° 和 45°，两答案都要考虑。' },

  // k26 直线与圆
  { id:'q171', k:'k26', ty:'c', lv:1, q:'圆的半径为 4，圆心到直线 l 的距离为 6，则 l 与圆（ ）', o:['相离','相切','相交','无法确定'], a:0, sol:'d = 6 > r = 4，直线与圆相离，没有公共点。' },
  { id:'q172', k:'k26', ty:'f', lv:2, q:'圆半径为 3，圆心到直线的距离为 3，则直线与圆的公共点有 ____ 个', a:'1', acc:['1','1个'], sol:'d = r 时直线与圆相切，只有一个公共点。' },
  { id:'q173', k:'k26', ty:'c', lv:2, q:'三角形内切圆的圆心是（ ）', o:['三边垂直平分线的交点','三条角平分线的交点','三条中线的交点','三条高的交点'], a:1, sol:'内心是三条角平分线的交点，到三边距离相等；外心才是三边垂直平分线的交点。' },
  { id:'q174', k:'k26', ty:'c', lv:3, q:'从圆外一点 P 引圆的两条切线，切线长为 6，圆半径为 4，则 OP =（ ）', o:['10','2√13','√52','2√5'], a:1, sol:'半径垂直切线，由勾股定理 OP = √(6² + 4²) = √52 = 2√13。' },

  // k27 概率初步
  { id:'q175', k:'k27', ty:'c', lv:1, q:'必然事件的概率是（ ）', o:['0','0.5','1','无法确定'], a:2, sol:'必然事件一定发生，概率为 1；不可能事件概率为 0；随机事件概率在 0 与 1 之间。' },
  { id:'q176', k:'k27', ty:'f', lv:2, q:'袋中有 2 个红球和 3 个白球（除颜色外相同），任取 1 球是白球的概率为 ____', a:'3/5', acc:['3/5','0.6'], sol:'共 5 个等可能结果，白球 3 个，P = 3/5。' },
  { id:'q177', k:'k27', ty:'c', lv:2, q:'同时掷两枚均匀骰子，点数之和为 2 的概率是（ ）', o:['1/36','1/18','1/12','1/6'], a:0, sol:'共 6 × 6 = 36 种等可能结果，和为 2 只有 (1,1) 一种，P = 1/36。' },
  { id:'q178', k:'k27', ty:'c', lv:3, q:'袋中有 2 红 1 白共 3 个球，不放回连续取 2 次，两次都是红球的概率是（ ）', o:['1/3','4/9','2/3','1/2'], a:0, sol:'第一次取红概率 2/3，不放回后剩 1 红 1 白，第二次取红概率 1/2，相乘得 1/3。' },

  // k28 反比例函数
  { id:'q179', k:'k28', ty:'c', lv:1, q:'下列函数中是反比例函数的是（ ）', o:['y = 3x','y = 3/x','y = x²','y = 3x + 1'], a:1, sol:'形如 y = k/x (k ≠ 0) 的函数是反比例函数，等价于 xy = k。' },
  { id:'q180', k:'k28', ty:'f', lv:2, q:'反比例函数 y = k/x 的图象过点 (2, -3)，则 k = ____', a:'-6', acc:['-6'], sol:'k = xy = 2 × (-3) = -6。' },
  { id:'q181', k:'k28', ty:'c', lv:2, q:'反比例函数 y = 4/x 图象上一点向两坐标轴作垂线，所得矩形面积为（ ）', o:['2','4','8','16'], a:1, sol:'S = |x · y| = |k| = 4，这是 k 的几何意义。' },
  { id:'q182', k:'k28', ty:'c', lv:3, q:'反比例函数 y = -2/x 图象上有 A(x₁,y₁)、B(x₂,y₂)，且 x₁ < 0 < x₂，则（ ）', o:['y₁ < y₂','y₁ > y₂','y₁ = y₂','无法比较'], a:1, sol:'k < 0 时图象在第二、四象限：x₁ < 0 时 y₁ > 0，x₂ > 0 时 y₂ < 0，故 y₁ > y₂。' },

  // k29 二次函数
  { id:'q183', k:'k29', ty:'c', lv:1, q:'抛物线 y = (x - 2)² + 1 的对称轴是（ ）', o:['x = -2','x = 2','y = 1','x = 1'], a:1, sol:'顶点式 y = a(x-h)² + k 的对称轴为 x = h = 2，顶点 (2, 1)。' },
  { id:'q184', k:'k29', ty:'f', lv:2, q:'抛物线 y = x² + 2x - 3 的顶点横坐标是 ____', a:'-1', acc:['-1','x=-1'], sol:'对称轴 x = -b/(2a) = -2/2 = -1；配方 y = (x+1)² - 4 也可看出。' },
  { id:'q185', k:'k29', ty:'c', lv:2, q:'把抛物线 y = x² 向右平移 2 个单位、再向上平移 3 个单位，所得解析式为（ ）', o:['y = (x+2)² + 3','y = (x-2)² + 3','y = (x-2)² - 3','y = x² + 5'], a:1, sol:'左加右减、上加下减：右移 2 得 y = (x-2)²，上移 3 得 y = (x-2)² + 3。' },
  { id:'q186', k:'k29', ty:'c', lv:3, q:'二次函数 y = x² - 4x + 3，当 0 ≤ x ≤ 3 时的最小值为（ ）', o:['-1','0','3','-4'], a:0, sol:'对称轴 x = 2 在区间内，开口向上，顶点取最小值 y = 4 - 8 + 3 = -1。' },

  // k30 二次函数与方程
  { id:'q187', k:'k30', ty:'c', lv:1, q:'抛物线 y = x² - 1 与 x 轴的交点是（ ）', o:['(0, -1)','(1, 0)','(1, 0) 和 (-1, 0)','(0, 1) 和 (0, -1)'], a:2, sol:'令 y = 0：x² = 1，x = ±1，交点为 (1, 0) 与 (-1, 0)。' },
  { id:'q188', k:'k30', ty:'f', lv:2, q:'抛物线 y = x² - 3x + 2 与 x 轴两交点横坐标之和为 ____', a:'3', acc:['3'], sol:'交点是方程 x² - 3x + 2 = 0 的两根，由韦达定理和为 -b/a = 3（两根为 1 和 2）。' },
  { id:'q189', k:'k30', ty:'c', lv:2, q:'若抛物线 y = ax² + 2x + 1 与 x 轴只有一个交点，则 a =（ ）', o:['0','1','2','4'], a:1, sol:'Δ = 4 - 4a = 0 得 a = 1；a = 0 时退化为一次函数，不再是抛物线。' },
  { id:'q190', k:'k30', ty:'c', lv:3, q:'二次函数 y = -x² + 2x + 3 的最大值是（ ）', o:['3','4','5','6'], a:1, sol:'开口向下，顶点横坐标 x = -2/(2×(-1)) = 1，y = -1 + 2 + 3 = 4。' },

  // k31 相似三角形
  { id:'q191', k:'k31', ty:'c', lv:1, q:'两个相似三角形的对应角（ ）', o:['相等','互补','成比例','和为 180°'], a:0, sol:'相似三角形对应角相等、对应边成比例。' },
  { id:'q192', k:'k31', ty:'f', lv:2, q:'两个相似三角形相似比为 3:5，较小三角形面积为 9，则较大三角形面积为 ____', a:'25', acc:['25'], sol:'面积比 = 相似比的平方 = 9:25，故较大面积为 9 × 25/9 = 25。' },
  { id:'q193', k:'k31', ty:'c', lv:2, q:'△ABC 中 DE∥BC 交 AB、AC 于 D、E，若 AD:DB = 1:2，则 DE:BC =（ ）', o:['1:2','1:3','2:3','1:4'], a:1, sol:'由 DE∥BC 得 △ADE ∽ △ABC，AD:AB = 1:(1+2) = 1:3，故 DE:BC = 1:3。' },
  { id:'q194', k:'k31', ty:'c', lv:3, q:'两个相似三角形面积比为 1:4，则对应高的比为（ ）', o:['1:2','1:4','1:8','1:16'], a:0, sol:'面积比 = 相似比平方，故相似比为 1:2；对应高之比等于相似比，也是 1:2。' },

  // k32 锐角三角函数
  { id:'q195', k:'k32', ty:'c', lv:1, q:'cos30° 的值是（ ）', o:['1/2','√2/2','√3/2','√3'], a:2, sol:'特殊角：sin30° = 1/2，cos30° = √3/2，tan30° = √3/3。' },
  { id:'q196', k:'k32', ty:'f', lv:2, q:'直角三角形中 ∠A 的对边为 5、邻边为 12，则 tanA = ____', a:'5/12', acc:['5/12'], sol:'tanA = 对边 ÷ 邻边 = 5/12；此时斜边为 13，sinA = 5/13。' },
  { id:'q197', k:'k32', ty:'c', lv:2, q:'若 ∠A 为锐角且 sinA = 1/2，则 ∠A =（ ）', o:['30°','45°','60°','90°'], a:0, sol:'sin30° = 1/2，锐角范围内解唯一，∠A = 30°。' },
  { id:'q198', k:'k32', ty:'c', lv:3, q:'计算 2sin30° + tan45° - cos60° 的值是（ ）', o:['1','1.5','2','2.5'], a:1, sol:'2 × 1/2 + 1 - 1/2 = 1 + 1 - 0.5 = 1.5。' },

  // k33 解直角三角形
  { id:'q199', k:'k33', ty:'c', lv:1, q:'坡角越大，坡度（ ）', o:['越大','越小','不变','无法判断'], a:0, sol:'坡度 i = tanα，tan 在锐角范围内随角度增大而增大。' },
  { id:'q200', k:'k33', ty:'f', lv:2, q:'直角三角形斜边为 10，∠A = 30°，则 ∠A 的对边长为 ____', a:'5', acc:['5','5m'], sol:'对边 = 斜边 × sin30° = 10 × 1/2 = 5。' },
  { id:'q201', k:'k33', ty:'c', lv:2, q:'同一时刻，1 m 竹竿影长 1.5 m，旗杆影长 12 m，则旗杆高为（ ）', o:['6 m','8 m','18 m','24 m'], a:1, sol:'平行投影下物高与影长成比例：h/12 = 1/1.5，h = 8 m。' },
  { id:'q202', k:'k33', ty:'c', lv:3, q:'某斜坡坡度 i = 1:2.4，沿水平方向前进 12 m，则上升高度为（ ）', o:['2.4 m','5 m','10 m','12 m'], a:1, sol:'i = h/l = 1/2.4 = 5/12，h = 12 × 5/12 = 5 m。' },

  // k34 投影与视图
  { id:'q203', k:'k34', ty:'c', lv:1, q:'正方体的三视图都是（ ）', o:['圆','正方形','矩形','三角形'], a:1, sol:'正方体六个面都是全等正方形，从正面、左面、上面看都是正方形。' },
  { id:'q204', k:'k34', ty:'f', lv:2, q:'竖直放置的圆柱，其俯视图是 ____（填图形名称）', a:'圆', acc:['圆','圆形'], sol:'从上往下看圆柱看到的是上底面，为圆；主视图和左视图是矩形。' },
  { id:'q205', k:'k34', ty:'c', lv:2, q:'三视图中，主视图反映物体的（ ）', o:['长和宽','长和高','宽和高','长宽高'], a:1, sol:'长对正、高平齐、宽相等：主视图反映长和高，俯视图反映长和宽，左视图反映宽和高。' },
  { id:'q206', k:'k34', ty:'c', lv:3, q:'一个几何体的主视图和左视图都是矩形，俯视图是圆，该几何体是（ ）', o:['球','圆柱','圆锥','正方体'], a:1, sol:'主视图、左视图为矩形说明侧面是柱面，俯视图为圆说明底面是圆，故为竖直放置的圆柱。' },

  /* ===== 综合挑战题（跨知识点） ===== */
  { id:'q207', k:'k03', ty:'f', lv:3, q:'给某班同学分书：每人 3 本剩 8 本，每人 5 本差 6 本，该班有 ____ 人', a:'7', acc:['7','7人'], sol:'设 x 人，书数不变：3x + 8 = 5x - 6 → 2x = 14 → x = 7，共 29 本书。' },
  { id:'q208', k:'k14', ty:'f', lv:3, q:'若 x² + x - 1 = 0，则 x³ + 2x² + 1 = ____', a:'2', acc:['2'], sol:'由 x² + x = 1，原式 = x(x²+x) + (x²+1) = x + x² + 1 = (x²+x) + 1 = 2。整体代入避免求根。' },
  { id:'q209', k:'k17', ty:'c', lv:3, q:'一个直角三角形的三边是三个连续偶数，则斜边长为（ ）', o:['6','8','10','12'], a:2, sol:'设三边 2n-2, 2n, 2n+2，由 (2n-2)² + (2n)² = (2n+2)² 解得 n = 4，三边 6, 8, 10。' },
  { id:'q210', k:'k20', ty:'f', lv:3, q:'直线 y = kx + b 经过 (1, 2) 与 (-1, 4)，则 k = ____', a:'-1', acc:['-1'], sol:'两点代入得 k + b = 2、-k + b = 4，两式相减 2k = -2，k = -1，b = 3。' },
  { id:'q211', k:'k23', ty:'c', lv:3, q:'一个两位数，十位数字比个位数字小 3，两数字的平方和为 17，这个两位数是（ ）', o:['14','25','36','41'], a:0, sol:'设十位 a、个位 a+3：a² + (a+3)² = 17 → 2a² + 6a - 8 = 0 → a = 1（舍去负根），两位数为 14。' },
  { id:'q212', k:'k25', ty:'c', lv:3, q:'一条弦把圆分成度数之比为 1:3 的两条弧，则劣弧所对的圆周角为（ ）', o:['30°','45°','60°','90°'], a:1, sol:'劣弧占 1/4 圆周即 90° 圆心角，圆周角等于圆心角的一半，为 45°。' },
  { id:'q213', k:'k27', ty:'c', lv:3, q:'连续抛一枚均匀硬币 3 次，恰有 2 次正面朝上的概率是（ ）', o:['1/4','3/8','1/2','2/3'], a:1, sol:'共 2³ = 8 种等可能结果，恰 2 次正面的有 正正反、正反正、反正正 共 3 种，P = 3/8。' },
  { id:'q214', k:'k29', ty:'c', lv:3, q:'抛物线 y = ax² + bx + c 开口向下，且对称轴在 y 轴右侧，则 b（ ）', o:['大于 0','小于 0','等于 0','符号不定'], a:0, sol:'a < 0，对称轴 x = -b/(2a) > 0；因 2a < 0，需 -b < 0 即 b > 0。' },
  { id:'q215', k:'k31', ty:'c', lv:3, q:'△ABC 中 DE∥BC，若 S△ADE : S四边形DBCE = 1:3，则 AD:AB =（ ）', o:['1:2','1:3','1:4','1:9'], a:0, sol:'S△ADE : S△ABC = 1:4，面积比等于相似比平方，故相似比（即 AD:AB）= 1:2。' },
  { id:'q216', k:'k32', ty:'c', lv:3, q:'在 Rt△ABC 中 ∠C = 90°，若 sinA = 3/5，则 cosB =（ ）', o:['3/5','4/5','5/3','1/2'], a:0, sol:'∠A + ∠B = 90°，所以 cosB = sinA = 3/5；也可由 cosB = 邻边/斜边 = BC/AB = sinA。' },
  { id:'q217', k:'k32', ty:'f', lv:3, q:'已知 tanα = 2（α 为锐角），则 (sinα + cosα)/(sinα - cosα) = ____', a:'3', acc:['3'], sol:'分子分母同除以 cosα 得 (tanα + 1)/(tanα - 1) = 3/1 = 3。' },
  { id:'q218', k:'k33', ty:'f', lv:3, q:'等腰三角形两边长为 4 和 9，则它的周长为 ____', a:'22', acc:['22'], sol:'若腰为 4，则 4+4=8<9 不能构成三角形；只能腰 9 底 4，周长 9+9+4 = 22。' },
  { id:'q219', k:'k15', ty:'f', lv:3, q:'若 1/x - 1/y = 3，则 (2x + 3xy - 2y)/(x - 2xy - y) = ____', a:'3/5', acc:['3/5','0.6'], sol:'由 (y-x)/(xy) = 3 得 x - y = -3xy。分子 2(x-y) + 3xy = -3xy，分母 (x-y) - 2xy = -5xy，比值 = 3/5。' },
  { id:'q220', k:'k09', ty:'c', lv:3, q:'若关于 x 的不等式组 x > 2 且 x < a 无解，则 a 满足（ ）', o:['a > 2','a ≥ 2','a ≤ 2','a < 2'], a:2, sol:'x > 2 与 x < a 要有公共部分需 a > 2；无解则 a ≤ 2（a = 2 时两区间无交集）。' }
];

</script>
<script>
/* 初中数学学习小程序 —— 交互逻辑 */
(function () {
  const D = window.MATH_DATA;
  const K = D.knowledge, B = D.bank.concat(window.MATH_EXTRA_BANK || []), F = D.formulas, CATS = D.cats;
  const KM = {}; K.forEach(k => KM[k.id] = k);
  const QM = {}; B.forEach(q => QM[q.id] = q);
  const LS_KEY = 'math_mini_app_v1';
  const LETTERS = ['A', 'B', 'C', 'D', 'E'];

  /* ---------------- 状态 ---------------- */
  const DEFAULT = {
    mastered: [], wrong: {}, stats: { total: 0, correct: 0, days: {} },
    sessions: [], lastActive: '', streak: 0, theme: 'light'
  };
  function load() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) return Object.assign({}, DEFAULT);
      const o = JSON.parse(raw);
      return Object.assign({}, DEFAULT, o, {
        stats: Object.assign({}, DEFAULT.stats, o.stats || {})
      });
    } catch (e) { return Object.assign({}, DEFAULT); }
  }
  function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} }
  let S = load();

  const UI = {
    tab: 'home', view: { name: 'home' }, history: [],
    grade: 7, openCh: {}, kpQuery: '', fQuery: '', fCat: '全部',
    quiz: null, result: null, timerId: null, toastId: null
  };

  /* ---------------- 工具 ---------------- */
  const $ = id => document.getElementById(id);
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function dstr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function today() { return dstr(new Date()); }
  function yesterday() { const d = new Date(); d.setDate(d.getDate() - 1); return dstr(d); }
  function shuffle(a) {
    const r = a.slice();
    for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = r[i]; r[i] = r[j]; r[j] = t; }
    return r;
  }
  function normalize(s) {
    return String(s == null ? '' : s)
      .replace(/[\uFF01-\uFF5E]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
      .replace(/\s+/g, '').replace(/^[xX]=/, '')
      .replace(/(cm|m|M|米|元|°|度)$/, '');
  }
  function catColor(c) { const x = CATS.find(v => v.n === c); return x ? x.color : '#5B6BF0'; }
  function catIcon(c) { const x = CATS.find(v => v.n === c); return x ? x.icon : '◆'; }
  function gradeName(g) { return g === 7 ? '七年级' : g === 8 ? '八年级' : '九年级'; }
  function fmtSec(s) { return pad(Math.floor(s / 60)) + ':' + pad(s % 60); }
  function toast(msg) {
    const t = $('toast'); if (!t) return;
    t.textContent = msg; t.classList.add('show');
    clearTimeout(UI.toastId);
    UI.toastId = setTimeout(() => t.classList.remove('show'), 1800);
  }
  function touchActive() {
    const t = today();
    if (S.lastActive === t) return;
    S.streak = (S.lastActive === yesterday()) ? (S.streak || 0) + 1 : 1;
    S.lastActive = t; save();
  }
  function recordAnswer(q, ok) {
    S.stats.total++;
    if (ok) S.stats.correct++;
    const t = today();
    if (!S.stats.days[t]) S.stats.days[t] = { n: 0, c: 0 };
    S.stats.days[t].n++;
    if (ok) S.stats.days[t].c++;
    if (ok) { if (S.wrong[q.id]) delete S.wrong[q.id]; }
    else { const w = S.wrong[q.id] || { n: 0 }; S.wrong[q.id] = { n: w.n + 1, ts: Date.now() }; }
    touchActive(); save();
  }
  function accuracy() { return S.stats.total ? Math.round(S.stats.correct / S.stats.total * 100) : 0; }
  function masteryPct() { return Math.round(S.mastered.length / K.length * 100); }
  function wrongList() {
    return Object.keys(S.wrong)
      .map(id => ({ q: QM[id], w: S.wrong[id] }))
      .filter(x => x.q).sort((a, b) => b.w.ts - a.w.ts);
  }
  function ringSVG(pct, size, stroke, color) {
    const r = (size - stroke) / 2, c = 2 * Math.PI * r;
    const off = c * (1 - pct / 100);
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' +
      '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="' + stroke + '"/>' +
      '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="' + stroke + '" stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"/></svg>';
  }
  function greet() {
    const h = new Date().getHours();
    return h < 6 ? '夜深了，注意休息' : h < 11 ? '早上好' : h < 14 ? '中午好' : h < 18 ? '下午好' : '晚上好';
  }

  /* ---------------- 导航 ---------------- */
  function switchTab(t) { UI.tab = t; UI.view = { name: t }; UI.history = []; stopTimer(); render(); }
  function go(name, p) { UI.history.push(UI.view); UI.view = { name: name, p: p }; render(); }
  function back() { UI.view = UI.history.pop() || { name: UI.tab }; stopTimer(); render(); }
  function render(keepScroll) {
    const v = UI.view, n = v.name;
    document.body.dataset.theme = S.theme;
    const sub = n !== UI.tab || UI.history.length > 0;
    const titles = { home: '初中数学 · 学习助手', learn: '知识体系', practice: '练习与测验', profile: '我的',
      kp: '知识点详情', quiz: '答题中', result: '本次成绩', formula: '公式速查', wrong: '错题本', catlist: '分类练习' };
    $('nav-title').textContent = titles[n] || '初中数学';
    $('nav-left').innerHTML = UI.history.length
      ? '<button class="nav-btn" data-act="back" aria-label="返回">‹</button>'
      : '<div style="width:32px;height:32px;border-radius:10px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;">√</div>';
    $('nav-right').innerHTML = '<button class="nav-btn" data-act="theme" aria-label="切换主题">' +
      (S.theme === 'dark' ? '☀' : '☾') + '</button>';
    $('status-time').textContent = pad(new Date().getHours()) + ':' + pad(new Date().getMinutes());

    let html = '';
    switch (n) {
      case 'home': html = viewHome(); break;
      case 'learn': html = viewLearn(); break;
      case 'practice': html = viewPractice(); break;
      case 'profile': html = viewProfile(); break;
      case 'kp': html = viewKp(v.p); break;
      case 'quiz': html = viewQuiz(); break;
      case 'result': html = viewResult(); break;
      case 'formula': html = viewFormula(); break;
      case 'wrong': html = viewWrong(); break;
      case 'catlist': html = viewCatlist(v.p); break;
      default: html = viewHome();
    }
    $('scroll').innerHTML = '<div class="view">' + html + '</div>';
    $('scroll').className = 'scroll' + (n === 'profile' ? '' : '');
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), el => {
      el.classList.toggle('active', el.dataset.t === UI.tab);
    });
    if (!keepScroll) $('scroll').scrollTop = 0;
    if (n === 'quiz') startTimer();
  }

  /* ---------------- 首页 ---------------- */
  function viewHome() {
    const pct = masteryPct(), wl = wrongList().length;
    let h = '';
    h += '<div class="hero">' +
      '<div class="hero-ring"><div class="ring-wrap">' + ringSVG(pct, 72, 7, '#fff') +
      '<div class="ring-txt">' + pct + '%<small>掌握度</small></div></div></div>' +
      '<h2>' + greet() + '，同学</h2>' +
      '<p>每天进步一点点，数学其实很有趣</p>' +
      '<div class="hero-stats">' +
        '<div><b>' + S.streak + '</b><span>连续学习（天）</span></div>' +
        '<div><b>' + S.stats.total + '</b><span>累计做题</span></div>' +
        '<div><b>' + S.mastered.length + '</b><span>掌握知识点</span></div>' +
      '</div></div>';

    h += '<div class="quick-grid">' +
      quick('✦', '随机练习', '#5B6BF0', 'start', 'data-mode="random"') +
      quick('∑', '公式速查', '#8C6BF6', 'go', 'data-to="formula"') +
      quick('✕', '错题本', '#F0687A', 'go', 'data-to="wrong"') +
      quick('◷', '限时测验', '#FF9E45', 'start', 'data-mode="exam"') +
      '</div>';

    h += '<div class="section-title">今日任务 <span class="more">坚持打卡，养成习惯</span></div>';
    h += '<div class="card tight task-card" data-act="start" data-mode="daily" style="cursor:pointer">' +
      '<div class="task-ic" style="background:rgba(91,107,240,.12);color:var(--primary)">✧</div>' +
      '<div style="flex:1"><b>每日一练 · 10 道题</b><p>优先推荐你还没掌握的知识点</p></div>' +
      '<span class="chip on">去完成 ›</span></div>';
    if (wl > 0) {
      h += '<div class="card tight task-card" data-act="go" data-to="wrong" style="cursor:pointer;margin-top:-4px">' +
        '<div class="task-ic" style="background:rgba(240,92,99,.12);color:var(--bad)">↻</div>' +
        '<div style="flex:1"><b>还有 ' + wl + ' 道错题待攻克</b><p>错题重做是提分最快的方式</p></div>' +
        '<span class="chip warn">去复习 ›</span></div>';
    }

    h += '<div class="section-title">按专题学习 <span class="more">题库共 ' + B.length + ' 道</span></div><div class="cat-grid">';
    CATS.forEach(c => {
      const total = K.filter(k => k.cat === c.n).length;
      h += '<div class="cat-box" data-act="cat" data-c="' + c.n + '" style="background:' + c.color + '">' +
        '<i>' + c.icon + '</i>' + c.n + '<small>' + total + ' 个知识点</small></div>';
    });
    h += '</div>';

    const rec = K.filter(k => S.mastered.indexOf(k.id) < 0).slice(0, 3);
    if (rec.length) {
      h += '<div class="section-title">推荐学习 <span class="more" data-act="tab" data-t="learn">全部 ›</span></div><div class="card tight">';
      rec.forEach(k => {
        h += '<div class="kp-mini" data-act="kp" data-k="' + k.id + '" style="cursor:pointer">' +
          '<div class="km-ic" style="background:' + catColor(k.cat) + '">' + catIcon(k.cat) + '</div>' +
          '<div class="km-body"><b>' + esc(k.t) + '</b><small>' + gradeName(k.g) + ' · ' + esc(k.c) + '</small></div>' +
          '<span class="arrow">›</span></div>';
      });
      h += '</div>';
    }
    if (S.sessions.length) {
      const s = S.sessions[0];
      h += '<div class="section-title">最近一次成绩</div><div class="card tight spread">' +
        '<div><b style="font-size:14px">' + esc(s.mode) + '</b><p class="muted tiny" style="margin:4px 0 0">答对 ' + s.correct + '/' + s.total + ' 题 · 用时 ' + fmtSec(s.sec) + '</p></div>' +
        '<div style="font-size:22px;font-weight:800;color:var(--primary)">' + s.score + '<small class="muted" style="font-size:11px"> 分</small></div></div>';
    }
    return h;
  }
  function quick(icon, label, color, act, extra) {
    return '<div class="quick" data-act="' + act + '" ' + extra + '>' +
      '<div class="qi" style="background:' + color + '">' + icon + '</div><span>' + label + '</span></div>';
  }

  /* ---------------- 知识体系 ---------------- */
  function chapterHTML(list, query, direct) {
    const groups = {};
    list.forEach(k => { (groups[k.c] = groups[k.c] || []).push(k); });
    const keys = Object.keys(groups);
    if (!keys.length) return '<div class="empty"><span class="ei">▤</span><b>没有找到相关知识点</b><p>换个关键词试试吧</p></div>';
    let h = '';
    keys.forEach((c, i) => {
      const key = 'ch' + i;
      const open = query ? true : !!UI.openCh[key];
      const done = groups[c].filter(k => S.mastered.indexOf(k.id) >= 0).length;
      h += '<div class="chapter' + (open ? ' open' : '') + '">' +
        '<div class="ch-head" data-act="chapter" data-i="' + key + '">' +
          '<div class="ch-num">' + (i + 1) + '</div><b>' + esc(c) + '</b>' +
          '<span class="ch-count">' + done + '/' + groups[c].length + ' 已掌握</span>' +
          '<span class="ch-arrow">›</span></div>' +
        '<div class="ch-body">';
      groups[c].forEach(k => {
        h += '<div class="kp-row" data-act="' + (direct ? 'start" data-mode="kp' : 'kp') + '" data-k="' + k.id + '" style="cursor:pointer">' +
          '<span class="dot' + (S.mastered.indexOf(k.id) >= 0 ? ' done' : '') + '"></span>' +
          '<span>' + esc(k.t) + '</span>' +
          '<span class="chip" style="font-size:9px;padding:2px 6px">' + k.cat + '</span>' +
          '<span class="go">›</span></div>';
      });
      h += '</div></div>';
    });
    return h;
  }
  function viewLearn() {
    let h = '<div class="search"><span class="si">⌕</span><input id="search-kp" placeholder="搜索知识点或章节，如「勾股」" value="' + esc(UI.kpQuery) + '"></div>';
    h += '<div class="seg">' + [7, 8, 9].map(g =>
      '<button data-act="grade" data-g="' + g + '" class="' + (UI.grade === g ? 'on' : '') + '">' + gradeName(g) + '</button>').join('') + '</div>';
    h += '<div class="spread" style="margin:0 2px 10px"><span class="muted tiny">共 ' + K.filter(k => k.g === UI.grade).length + ' 个知识点 · 点击展开章节</span>' +
      '<span class="chip ok">已掌握 ' + K.filter(k => k.g === UI.grade && S.mastered.indexOf(k.id) >= 0).length + '</span></div>';
    h += '<div id="kp-list">' + filteredChapterHTML(false) + '</div>';
    return h;
  }
  function filteredChapterHTML(direct) {
    let list = K.filter(k => k.g === UI.grade);
    if (UI.kpQuery.trim()) {
      const q = UI.kpQuery.trim();
      list = K.filter(k => (k.t + k.c + k.cat + k.s).indexOf(q) >= 0);
    }
    return chapterHTML(list, UI.kpQuery.trim(), direct);
  }
  function viewCatlist(p) {
    const cat = p.cat;
    const list = K.filter(k => k.cat === cat);
    let h = '<div class="card tight" style="background:linear-gradient(135deg,' + catColor(cat) + '22,' + catColor(cat) + '08)">' +

  /* ---------------- 组卷 ---------------- */
  function buildQuiz(mode, p) {
    let list = [], label = '', limit = 0;
    p = p || {};
    if (mode === 'random') { list = shuffle(B).slice(0, 10); label = '随机综合'; }
    else if (mode === 'daily') {
      const weak = B.filter(q => S.mastered.indexOf(q.k) < 0);
      list = shuffle(weak).slice(0, 10);
      if (list.length < 10) list = list.concat(shuffle(B.filter(q => list.indexOf(q) < 0)).slice(0, 10 - list.length));
      label = '每日一练';
    }
    else if (mode === 'wrong') {
      list = wrongList().map(x => x.q).slice(0, 12); label = '错题重做';
    }
    else if (mode === 'exam') { list = shuffle(B).slice(0, 15); label = '限时测验'; limit = 600; }
    else if (mode === 'kp') {
      const own = B.filter(q => q.k === p.k);
      const k = KM[p.k];
      const extra = shuffle(B.filter(q => q.k !== p.k && KM[q.k].cat === k.cat)).slice(0, Math.max(0, 6 - own.length));
      list = shuffle(own.concat(extra)); label = k ? k.t : '专项练习';
    }
    else if (mode === 'cat') {
      const ids = K.filter(x => x.cat === p.cat).map(x => x.id);
      list = shuffle(B.filter(q => ids.indexOf(q.k) >= 0)).slice(0, 10); label = p.cat + '专题';
    }
    else if (mode === 'level') {
      const n = +p.lv || 1;
      list = shuffle(B.filter(q => q.lv === n)).slice(0, 10);
      label = n === 1 ? '基础巩固' : n === 2 ? '进阶提升' : '挑战冲刺';
    }
    return { list: list, label: label, limit: limit, mode: mode, p: p };
  }
  function startQuiz(mode, p) {
    const cfg = buildQuiz(mode, p);
    if (!cfg.list.length) { toast('暂时没有可练习的题目'); return; }
    stopTimer();
    UI.quiz = {
      list: cfg.list, label: cfg.label, limit: cfg.limit, mode: mode, p: cfg.p,
      idx: 0, sel: null, fill: '', checked: false, answers: [],
      startTs: Date.now(), elapsed: 0
    };
    go('quiz');
  }
  function stopTimer() { if (UI.timerId) { clearInterval(UI.timerId); UI.timerId = null; } }
  function startTimer() {
    stopTimer();
    const z = UI.quiz; if (!z) return;
    UI.timerId = setInterval(() => {
      if (UI.view.name !== 'quiz' || !UI.quiz) { stopTimer(); return; }
      const q = UI.quiz;
      q.elapsed = Math.floor((Date.now() - q.startTs) / 1000);
      const el = $('timer'); if (!el) return;
      const left = q.limit ? q.limit - q.elapsed : q.elapsed;
      el.textContent = (q.limit ? '剩余 ' : '用时 ') + fmtSec(Math.max(0, left));
      if (q.limit && q.elapsed >= q.limit) { stopTimer(); finishQuiz(); toast('时间到，已自动交卷'); }
    }, 1000);
  }

  /* ---------------- 答题 ---------------- */
  function curQ() { return UI.quiz ? UI.quiz.list[UI.quiz.idx] : null; }
  function viewQuiz() {
    const z = UI.quiz;
    if (!z) return '<div class="empty">练习已结束</div>';
    const q = curQ(); if (!q) return '<div class="empty">练习已结束</div>';
    const k = KM[q.k];
    const streak = (function () { let n = 0; for (let i = z.answers.length - 1; i >= 0; i--) { if (z.answers[i].ok) n++; else break; } return n; })();
    let h = '<div class="quiz-top"><span>第 <b>' + (z.idx + 1) + '</b> / ' + z.list.length + ' 题 · ' + esc(z.label) + '</span>' +
      '<span id="timer">' + (z.limit ? '剩余 ' + fmtSec(z.limit - z.elapsed) : '用时 ' + fmtSec(z.elapsed)) + '</span></div>';
    h += '<div class="progress"><i style="width:' + Math.round((z.idx + 1) / z.list.length * 100) + '%"></i></div>';
    h += '<div class="q-meta"><span class="chip">' + (k ? esc(k.c) : '综合') + '</span>' +
      '<span class="chip">' + (q.ty === 'c' ? '选择题' : '填空题') + '</span>' +
      '<span class="chip' + (q.lv === 3 ? ' warn' : q.lv === 1 ? ' ok' : '') + '">' +
        (q.lv === 3 ? '挑战' : q.lv === 2 ? '进阶' : '基础') + '</span>' +
      (streak >= 2 ? '<span class="chip ok">连对 ' + streak + '</span>' : '') + '</div>';
    h += '<div class="q-text">' + esc(q.q) + '</div>';

    if (q.ty === 'c') {
      q.o.forEach((o, i) => {
        let cls = 'opt';
        if (z.checked) {
          if (i === q.a) cls += ' right';
          else if (i === z.sel) cls += ' wrong';
        } else if (i === z.sel) cls += ' sel';
        h += '<button class="' + cls + '" data-act="opt" data-i="' + i + '" ' + (z.checked ? 'disabled' : '') + '>' +
          '<span class="ol">' + LETTERS[i] + '</span><span>' + esc(o) + '</span></button>';
      });
    } else {
      let cls = 'fill-input';
      if (z.checked) cls += (z.answers[z.answers.length - 1].ok ? ' right' : ' wrong');
      h += '<input class="' + cls + '" id="fill-input" placeholder="在此输入答案" value="' + esc(z.fill) + '" ' + (z.checked ? 'disabled' : '') + '>';
      h += '<p class="muted tiny" style="margin:8px 2px 0">提示：只填最终结果，如 4、x=2、-2、10√3</p>';
    }

    if (z.checked) {
      const last = z.answers[z.answers.length - 1];
      const right = q.ty === 'c' ? LETTERS[q.a] + '．' + q.o[q.a] : q.a;
      h += '<div class="feedback ' + (last.ok ? 'ok' : 'no') + '">' +
        '<b>' + (last.ok ? '✓ 回答正确' : '✗ 答错了') + '</b>' +
        (last.ok ? '' : '<div>正确答案：<strong>' + esc(right) + '</strong></div>') +
        '<div class="sol">' + esc(q.sol) + '</div></div>';
    }
    const isLast = z.idx === z.list.length - 1;
    h += '<div class="quiz-foot"><button class="btn btn-primary btn-block btn-lg" data-act="' +
      (z.checked ? 'next' : 'submit') + '">' +
      (z.checked ? (isLast ? '查看成绩 ›' : '下一题 ›') : '提交答案') + '</button></div>';
    if (z.limit) h += '<p class="muted tiny" style="text-align:center;margin-top:10px">限时测验结束后未作答的题目按错计分</p>';
    return h;
  }
  function submitAnswer() {
    const z = UI.quiz, q = curQ(); if (!z || !q || z.checked) return;
    let ok = false;
    if (q.ty === 'c') {
      if (z.sel === null) { toast('请先选择一个答案'); return; }
      ok = z.sel === q.a;
    } else {
      const el = $('fill-input'); z.fill = el ? el.value : z.fill;
      if (!normalize(z.fill)) { toast('请先填写答案'); return; }
      ok = (q.acc || [q.a]).some(a => normalize(a) === normalize(z.fill));
    }
    z.checked = true;
    z.answers.push({ qid: q.id, ok: ok });
    recordAnswer(q, ok);
    render(true);
  }
  function nextQuestion() {
    const z = UI.quiz; if (!z || !z.checked) return;
    if (z.idx >= z.list.length - 1) { finishQuiz(); return; }
    z.idx++; z.sel = null; z.fill = ''; z.checked = false;
    render(false);
  }
  function finishQuiz() {
    const z = UI.quiz; if (!z) return;
    stopTimer();
    const sec = Math.floor((Date.now() - z.startTs) / 1000);
    const correct = z.answers.filter(a => a.ok).length;
    const total = z.list.length;
    const score = Math.round(correct / total * 100);
    const wrongIds = z.answers.filter(a => !a.ok).map(a => a.qid);
    // 限时交卷时未作答的题目同样收进错题本（不计入做题统计）
    const answeredIds = z.answers.map(a => a.qid);
    const missedIds = z.list.map(q => q.id).filter(id => answeredIds.indexOf(id) < 0);
    missedIds.forEach(id => { const w = S.wrong[id] || { n: 0 }; S.wrong[id] = { n: w.n + 1, ts: Date.now() }; });
    wrongIds.push.apply(wrongIds, missedIds);
    S.sessions.unshift({ mode: z.label, score: score, correct: correct, total: total, sec: sec, ts: Date.now() });
    S.sessions = S.sessions.slice(0, 10); save();
    UI.result = { mode: z.label, score: score, correct: correct, total: total, sec: sec, wrongIds: wrongIds, modeKey: z.mode, p: z.p };
    UI.quiz = null;
    // 替换当前页，避免返回时回到空答题页
    UI.view = { name: 'result' };
    render();
  }
