<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="初中物理学习小程序：知识图谱、公式速查、互动实验、刷题与错题本">
<title>物理小课 · 初中物理学习</title>
<style>
/* ===== 物理小课 · 基础主题 ===== */
:root{
  --primary:#4F46E5;
  --primary-deep:#4338CA;
  --primary-soft:#EEF0FF;
  --violet:#7C3AED;
  --accent:#F59E0B;
  --accent-soft:#FFF6E5;
  --cyan:#06B6D4;
  --green:#10B981;
  --green-soft:#E8F8F1;
  --red:#EF4444;
  --red-soft:#FEECEC;
  --bg:#F5F6FB;
  --card:#FFFFFF;
  --text:#1E2333;
  --text-2:#4A5166;
  --muted:#939AAD;
  --line:#ECEEF6;
  --shadow:0 6px 22px rgba(38,44,90,.07);
  --shadow-lg:0 14px 40px rgba(38,44,90,.14);
  --radius:18px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--font);
  color:var(--text);
  background:#E9ECF7;
  -webkit-font-smoothing:antialiased;
  font-size:15px;
  line-height:1.6;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
svg{display:block}

/* ===== 桌面端的手机外框 ===== */
.desktop-bg{
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  background:
    radial-gradient(circle at 18% 18%,rgba(124,58,237,.16),transparent 42%),
    radial-gradient(circle at 82% 78%,rgba(6,182,212,.16),transparent 42%),
    linear-gradient(135deg,#EEF0FB 0%,#E5E9F7 100%);
}
.phone{
  position:relative;
  width:414px;height:min(864px,calc(100vh - 48px));
  background:var(--bg);
  border-radius:38px;
  box-shadow:var(--shadow-lg),0 0 0 9px rgba(255,255,255,.55),0 0 0 10px rgba(60,66,110,.08);
  display:flex;flex-direction:column;
  overflow:hidden;
}
.statusbar{
  height:36px;flex:none;padding:0 22px 0 28px;
  display:flex;align-items:center;justify-content:space-between;
  font-size:13px;font-weight:700;letter-spacing:.2px;
  background:var(--card);color:var(--text);
}
.sb-icons{display:flex;align-items:center;gap:5px}
.sb-battery{width:22px;height:11px;border:1.4px solid currentColor;border-radius:3px;position:relative;display:inline-block;padding:1.4px}
.sb-battery:after{content:"";position:absolute;right:-3.5px;top:3px;width:2px;height:5px;background:currentColor;border-radius:0 2px 2px 0}
.sb-battery span{display:block;height:100%;width:78%;background:currentColor;border-radius:1px}

.appbar{
  height:50px;flex:none;background:var(--card);
  display:flex;align-items:center;padding:0 14px;gap:6px;
  border-bottom:1px solid rgba(236,238,246,.7);
  position:relative;z-index:5;
}
.appbar-back{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex:none}
.appbar-back:active{background:var(--bg)}
.appbar-back svg{width:20px;height:20px}
.appbar-title{position:absolute;left:0;right:0;text-align:center;font-size:16px;font-weight:700;letter-spacing:.3px;pointer-events:none}
.capsule{
  width:78px;height:30px;flex:none;border:1px solid var(--line);border-radius:16px;
  display:flex;align-items:center;justify-content:space-evenly;color:#5B6175;
  margin-left:auto;position:relative;z-index:1;background:var(--card);
}
.appbar-back{position:relative;z-index:1}
.cap-dots{font-size:13px;letter-spacing:1px;line-height:1}
.cap-split{width:1px;height:16px;background:var(--line)}
.cap-circle{width:14px;height:14px;border:1.6px solid currentColor;border-radius:50%;position:relative}
.cap-circle:after{content:"";position:absolute;width:5px;height:5px;background:currentColor;border-radius:50%;top:3px;left:3px}

.view{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;padding:16px 16px 28px}
.view::-webkit-scrollbar{width:0}
.tabbar{
  flex:none;height:62px;background:rgba(255,255,255,.94);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  display:flex;align-items:stretch;padding-bottom:env(safe-area-inset-bottom);
  z-index:5;
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:#A2A8BB;font-size:10.5px;font-weight:600;transition:color .18s;position:relative;
}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.active{color:var(--primary)}
.tab.active:before{content:"";position:absolute;top:0;width:22px;height:3px;border-radius:0 0 3px 3px;background:var(--primary)}

/* ===== 通用组件 ===== */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 11px;font-size:16px;font-weight:700}
.section-title:first-child{margin-top:4px}
.section-title .st-left{display:flex;align-items:center;gap:8px}
.section-title .st-left:before{content:"";width:4px;height:16px;border-radius:3px;background:linear-gradient(180deg,var(--primary),var(--violet));flex:none}
.section-more{font-size:12px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:2px}
.muted{color:var(--muted)}
.small{font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between}
.grow{flex:1;min-width:0}
.divider{height:1px;background:var(--line);margin:12px 0}
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;background:var(--primary-soft);color:var(--primary)}
.badge.easy{background:var(--green-soft);color:#059669}
.badge.mid{background:var(--accent-soft);color:#D97706}
.badge.hard{background:var(--red-soft);color:#DC2626}
.badge.gray{background:#F1F3F9;color:#7A8198}
.tag{display:inline-block;padding:3px 9px;border-radius:8px;background:var(--primary-soft);color:var(--primary);font-size:11.5px;font-weight:600}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:42px;padding:0 20px;border-radius:13px;font-size:14.5px;font-weight:700;
  background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.24);
  transition:transform .12s,opacity .12s;
}
.btn:active{transform:scale(.975);opacity:.9}
.btn.block{width:100%}
.btn.ghost{background:var(--primary-soft);color:var(--primary);box-shadow:none}
.btn.gray{background:#F1F3F9;color:var(--text-2);box-shadow:none}
.btn.outline{background:#fff;color:var(--primary);border:1.5px solid var(--primary);box-shadow:none}
.btn:disabled{opacity:.45;box-shadow:none;cursor:not-allowed}
.btn.sm{height:34px;padding:0 14px;font-size:12.5px;border-radius:10px}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty svg{width:56px;height:56px;margin:0 auto 12px;opacity:.5}
.empty p{margin:0 0 16px;font-size:13.5px}

/* ===== 首页 ===== */
.hero{
  border-radius:22px;padding:20px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(125deg,#5B54E8 0%,#6D4BE0 48%,#8B5CF6 100%);
  box-shadow:0 12px 26px rgba(91,84,232,.28);margin-bottom:16px;
}
.hero:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-60px;top:-80px;background:rgba(255,255,255,.10)}
.hero:before{content:"";position:absolute;width:120px;height:120px;border-radius:50%;right:20px;bottom:-70px;background:rgba(255,255,255,.08)}
.hero-in{position:relative;z-index:1;display:flex;align-items:center;gap:14px}
.hero-txt{flex:1;min-width:0}
.hero-hi{font-size:12px;opacity:.82;margin-bottom:4px}
.hero-title{font-size:20px;font-weight:800;letter-spacing:.5px;margin:0 0 6px}
.hero-sub{font-size:12px;opacity:.88;line-height:1.5}
.ring{width:76px;height:76px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;font-weight:800;line-height:1.1}
.ring-txt small{font-size:9px;font-weight:500;opacity:.8;margin-top:2px}
.hero-stats{position:relative;z-index:1;display:flex;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.22)}
.hero-stats div{flex:1;text-align:center}
.hero-stats div+div{border-left:1px solid rgba(255,255,255,.2)}
.hero-stats b{display:block;font-size:17px;font-weight:800}
.hero-stats span{font-size:10.5px;opacity:.82}

.module-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.module-card{
  background:var(--card);border-radius:16px;padding:14px 8px 12px;text-align:center;
  box-shadow:var(--shadow);transition:transform .14s;position:relative;overflow:hidden;
}
.module-card:active{transform:scale(.96)}
.module-icon{
  width:44px;height:44px;margin:0 auto 8px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
}
.module-icon svg{width:24px;height:24px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.module-name{font-size:13px;font-weight:700}
.module-count{font-size:10.5px;color:var(--muted);margin-top:2px}
.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.quick-item{
  background:var(--card);border-radius:15px;padding:13px 14px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:10px;transition:transform .14s;
}
.quick-item:active{transform:scale(.97)}
.quick-ic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
.quick-ic svg{width:19px;height:19px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.quick-t b{display:block;font-size:13.5px}
.quick-t span{font-size:10.5px;color:var(--muted)}
.daily{
  background:linear-gradient(120deg,#FFF8E9,#FFFDF7);border:1px solid #FDECC9;
  border-radius:18px;padding:16px;box-shadow:var(--shadow);
}
.daily .q-stem{font-size:14px;font-weight:600;line-height:1.65;margin:10px 0 12px}
.daily-opts{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.daily-opt{
  display:flex;align-items:center;gap:9px;background:#fff;border:1px solid #F3E7D2;
  border-radius:11px;padding:9px 11px;font-size:12.5px;transition:all .15s;
}
.daily-opt .k{width:20px;height:20px;border-radius:6px;background:#F6F4EE;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none;color:#8A846F}
.daily-opt.ok{background:var(--green-soft);border-color:#A7E7C9;color:#047857;font-weight:600}
.daily-opt.ok .k{background:#10B981;color:#fff}
.daily-opt.no{background:var(--red-soft);border-color:#F7BDBD;color:#B91C1C;font-weight:600}
.daily-opt.no .k{background:var(--red);color:#fff}
.daily-exp{font-size:12px;color:var(--text-2);background:#fff;border-radius:10px;padding:10px 12px;line-height:1.6;display:none;border:1px solid #F3E7D2}
.daily-exp.show{display:block}

/* ===== 搜索 & 分段 ===== */
.search-box{
  display:flex;align-items:center;gap:8px;background:#fff;border-radius:13px;
  padding:0 13px;height:42px;box-shadow:var(--shadow);margin-bottom:12px;
}
.search-box svg{width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.search-box input{border:none;outline:none;flex:1;font-size:13.5px;background:transparent;color:var(--text);min-width:0}
.search-box input::placeholder{color:#B4B9C9}
.search-clear{color:var(--muted);font-size:18px;line-height:1;padding:0 2px;display:none}
.segmented{display:flex;background:#EAECF5;border-radius:12px;padding:3px;margin-bottom:14px}
.segmented button{flex:1;height:34px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);transition:all .18s}
.segmented button.on{background:#fff;color:var(--primary);box-shadow:0 2px 8px rgba(50,56,100,.10)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{height:0}
.chip{
  flex:none;padding:7px 15px;border-radius:20px;background:#fff;border:1px solid var(--line);
  font-size:12.5px;font-weight:600;color:var(--text-2);transition:all .16s;
}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.25)}

/* ===== 列表 ===== */
.topic-item{
  display:flex;align-items:flex-start;gap:12px;background:#fff;border-radius:15px;
  padding:14px;margin-bottom:10px;box-shadow:var(--shadow);transition:transform .14s;
}
.topic-item:active{transform:scale(.985)}
.topic-idx{
  width:29px;height:29px;border-radius:9px;background:var(--primary-soft);color:var(--primary);
  font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px;
}
.topic-item.done .topic-idx{background:var(--green-soft);color:#059669}
.topic-tt{font-size:14px;font-weight:700;line-height:1.4;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.topic-ss{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.topic-arrow{width:16px;height:16px;color:#C7CBD9;flex:none;margin-top:6px}

.formula-card{background:#fff;border-radius:15px;padding:14px 15px;margin-bottom:10px;box-shadow:var(--shadow)}
.fc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.fc-name{font-size:13.5px;font-weight:700}
.fc-expr{
  margin:10px 0 8px;padding:11px 13px;background:linear-gradient(100deg,#F4F5FF,#FAFAFF);
  border-left:3px solid var(--primary);border-radius:0 10px 10px 0;
  font-family:"Times New Roman",Georgia,serif;font-size:19px;font-weight:700;
  color:var(--primary-deep);letter-spacing:.4px;overflow-x:auto;white-space:nowrap;
}
.fc-meta{font-size:11.5px;color:var(--muted);line-height:1.6}
.fc-note{font-size:12px;color:var(--text-2);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);line-height:1.6;display:none}
.formula-card.open .fc-note{display:block}
.fc-unit{color:var(--primary);font-weight:600}

/* ===== 详情页 ===== */
.detail-head{
  background:linear-gradient(125deg,#5B54E8,#8B5CF6);border-radius:20px;padding:18px;color:#fff;
  margin-bottom:14px;box-shadow:0 10px 22px rgba(91,84,232,.24);position:relative;overflow:hidden;
}
.detail-head:after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;right:-50px;top:-70px;background:rgba(255,255,255,.10)}
.dh-tag{font-size:11px;opacity:.85;display:inline-block;background:rgba(255,255,255,.18);padding:3px 10px;border-radius:20px;margin-bottom:9px}
.dh-title{font-size:19px;font-weight:800;margin:0 0 7px;position:relative;z-index:1}
.dh-sum{font-size:12.5px;opacity:.92;line-height:1.65;position:relative;z-index:1}
.dh-actions{display:flex;gap:8px;margin-top:14px;position:relative;z-index:1}
.dh-actions button{
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);color:#fff;
  border-radius:10px;padding:6px 12px;font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:5px;
}
.dh-actions button.on{background:#fff;color:var(--primary)}
.dh-actions svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.d-sec{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.d-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin:0 0 12px}
.d-h .dot{width:7px;height:7px;border-radius:50%;background:var(--primary)}
.d-h .dot.orange{background:var(--accent)}
.d-h .dot.green{background:var(--green)}
.point-list{margin:0;padding:0;list-style:none}
.point-list li{position:relative;padding-left:20px;font-size:13px;line-height:1.75;color:var(--text-2);margin-bottom:9px}
.point-list li:last-child{margin-bottom:0}
.point-list li:before{content:"";position:absolute;left:5px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--primary);opacity:.55}
.point-list li b{color:var(--text)}
.expr-line{
  font-family:"Times New Roman",Georgia,serif;font-size:18px;font-weight:700;color:var(--primary-deep);
  background:#F5F6FF;border-radius:10px;padding:10px 13px;margin-bottom:8px;overflow-x:auto;white-space:nowrap;
}
.expr-note{font-size:11.5px;color:var(--muted);margin:-3px 0 10px}
.callout{border-radius:12px;padding:12px 13px;font-size:12.5px;line-height:1.7}
.callout.warn{background:#FFF7E8;color:#8A5B0B;border-left:3px solid var(--accent)}
.callout.tip{background:#EAF8F3;color:#0B6B4D;border-left:3px solid var(--green)}
.callout.info{background:#EEF4FF;color:#2549A6;border-left:3px solid var(--primary)}
.callout b{font-weight:700}
.diagram-box{background:#FBFCFF;border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:4px}
.diagram-box svg{width:100%;height:auto}
.diagram-cap{text-align:center;font-size:11px;color:var(--muted);margin-top:6px}
.example{background:#F8F9FD;border-radius:12px;padding:12px 13px;font-size:12.5px;line-height:1.75;color:var(--text-2)}
.example b{color:var(--primary)}
.nav-bottom{display:flex;gap:10px;margin-top:16px}
.nav-bottom .btn{flex:1}

/* ===== 练习 ===== */
.quiz-setup .qs-card{background:#fff;border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.qs-title{font-size:14px;font-weight:700;margin-bottom:12px}
.qs-num{display:flex;gap:8px;flex-wrap:wrap}
.qs-num button{
  min-width:52px;height:38px;border-radius:11px;background:#F2F4FA;color:var(--text-2);
  font-size:13px;font-weight:700;
}
.qs-num button.on{background:var(--primary);color:#fff;box-shadow:0 5px 14px rgba(79,70,229,.25)}
.qs-info{display:flex;gap:10px;margin-bottom:14px}
.qs-info div{flex:1;background:#fff;border-radius:14px;padding:12px;text-align:center;box-shadow:var(--shadow)}
.qs-info b{display:block;font-size:19px;color:var(--primary)}
.qs-info span{font-size:10.5px;color:var(--muted)}

.quiz-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:12px;color:var(--muted)}
.quiz-bar{height:6px;background:#E7E9F3;border-radius:6px;overflow:hidden;margin-bottom:16px}
.quiz-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--primary),var(--violet));transition:width .3s}
.q-card{background:#fff;border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.q-meta{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.q-stem{font-size:15.5px;font-weight:650;line-height:1.75;margin-bottom:16px}
.options{display:flex;flex-direction:column;gap:10px}
.option{
  display:flex;align-items:flex-start;gap:11px;border:1.5px solid var(--line);border-radius:13px;
  padding:12px 13px;background:#fff;transition:all .16s;font-size:13.5px;line-height:1.55;
}
.option .k{
  width:23px;height:23px;border-radius:7px;background:#F2F4FA;color:#7A8198;font-size:12px;
  font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px;
}
.option.selected{border-color:var(--primary);background:#F7F7FF}
.option.selected .k{background:var(--primary);color:#fff}
.option.correct{border-color:var(--green);background:var(--green-soft)}
.option.correct .k{background:var(--green);color:#fff}
.option.wrong{border-color:var(--red);background:var(--red-soft)}
.option.wrong .k{background:var(--red);color:#fff}
.option.dim{opacity:.55}
.explain-box{margin-top:14px;border-radius:13px;padding:13px 14px;font-size:12.5px;line-height:1.75;display:none}
.explain-box.show{display:block;animation:fadeUp .25s}
.explain-box.ok{background:var(--green-soft);border-left:3px solid var(--green)}
.explain-box.no{background:var(--red-soft);border-left:3px solid var(--red)}
.explain-box .eh{font-weight:800;margin-bottom:5px;display:flex;align-items:center;gap:6px}
.explain-box .ans{font-weight:700;color:var(--primary-deep)}
.quiz-foot{margin-top:16px;display:flex;gap:10px}

.result-hero{
  background:linear-gradient(125deg,#5B54E8,#8B5CF6);border-radius:22px;padding:24px 18px;
  text-align:center;color:#fff;margin-bottom:14px;box-shadow:0 12px 26px rgba(91,84,232,.26);
}
.result-ring{width:112px;height:112px;margin:0 auto 12px;position:relative}
.result-ring svg{transform:rotate(-90deg)}
.result-ring .rr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.result-ring b{font-size:32px;line-height:1}
.result-ring small{font-size:10.5px;opacity:.85;margin-top:3px}
.result-title{font-size:17px;font-weight:800;margin-bottom:4px}
.result-sub{font-size:12px;opacity:.88}
.result-stats{display:flex;background:#fff;border-radius:16px;padding:16px 8px;box-shadow:var(--shadow);margin-bottom:14px}
.result-stats div{flex:1;text-align:center}
.result-stats div+div{border-left:1px solid var(--line)}
.result-stats b{display:block;font-size:19px;font-weight:800}
.result-stats span{font-size:10.5px;color:var(--muted)}

/* ===== 实验 ===== */
.lab-intro{background:linear-gradient(120deg,#EEF4FF,#F7F4FF);border:1px solid #E3E7FF;border-radius:16px;padding:13px 14px;font-size:12px;color:#4B4F7A;line-height:1.65;margin-bottom:14px}
.lab-card{background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.lab-h{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:750;margin-bottom:4px}
.lab-h .lab-ic{width:32px;height:32px;border-radius:10px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center}
.lab-h .lab-ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.lab-desc{font-size:11.5px;color:var(--muted);margin-bottom:12px;line-height:1.6}
.lab-stage{background:#FAFBFF;border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:14px}
.lab-stage svg{width:100%;height:auto}
.slider-row{margin-bottom:13px}
.slider-row label{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:7px}
.slider-row label b{color:var(--primary);font-variant-numeric:tabular-nums}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:5px;
  background:linear-gradient(90deg,var(--primary) var(--p,50%),#E8EAF3 var(--p,50%));outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:19px;height:19px;border-radius:50%;background:#fff;
  border:3px solid var(--primary);box-shadow:0 2px 7px rgba(79,70,229,.35);cursor:pointer;
}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:#fff;border:3px solid var(--primary);cursor:pointer}
.seg-mini{display:flex;gap:7px;margin-bottom:13px}
.seg-mini button{flex:1;height:32px;border-radius:9px;background:#F1F3F9;font-size:12px;font-weight:600;color:var(--text-2)}
.seg-mini button.on{background:var(--primary);color:#fff}
.readout{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:2px}
.readout div{background:#F7F8FD;border-radius:11px;padding:9px 6px;text-align:center}
.readout b{display:block;font-size:15px;color:var(--primary-deep);font-variant-numeric:tabular-nums}
.readout span{font-size:10px;color:var(--muted)}
.lab-note{margin-top:12px;background:var(--accent-soft);border-radius:11px;padding:10px 12px;font-size:12px;line-height:1.65;color:#8A5B0B}
.lab-note b{color:#B45309}

/* ===== 我的 ===== */
.profile{background:linear-gradient(125deg,#5B54E8,#8B5CF6);border-radius:20px;padding:18px;color:#fff;display:flex;align-items:center;gap:14px;margin-bottom:14px;box-shadow:0 10px 24px rgba(91,84,232,.24)}
.avatar{width:52px;height:52px;border-radius:17px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.profile b{font-size:16px;display:block}
.profile span{font-size:11.5px;opacity:.86}
.profile .lv{margin-top:6px;display:inline-block;background:rgba(255,255,255,.2);padding:2px 9px;border-radius:20px;font-size:10.5px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat-grid div{background:#fff;border-radius:14px;padding:13px 4px;text-align:center;box-shadow:var(--shadow)}
.stat-grid b{display:block;font-size:18px;font-weight:800;color:var(--primary)}
.stat-grid span{font-size:10px;color:var(--muted)}
.menu-list{background:#fff;border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.menu-item{display:flex;align-items:center;gap:12px;padding:14px 15px;border-bottom:1px solid var(--line)}
.menu-item:last-child{border-bottom:none}
.menu-item:active{background:#FAFBFF}
.mi-ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.mi-ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.menu-item .mi-t{flex:1;font-size:13.5px;font-weight:600}
.menu-item .mi-v{font-size:12px;color:var(--muted)}
.menu-item .mi-arrow{width:15px;height:15px;color:#C7CBD9}
.heat{display:flex;gap:5px;margin-top:10px}
.heat i{flex:1;height:26px;border-radius:6px;background:#EFF1F8;display:flex;align-items:center;justify-content:center;font-size:9px;color:#A8AEBF;font-style:normal}
.heat i.on{background:var(--primary);color:#fff;font-weight:700}
.wrong-item{background:#fff;border-radius:14px;padding:14px;box-shadow:var(--shadow);margin-bottom:10px}
.wi-stem{font-size:13px;font-weight:600;line-height:1.6;margin-bottom:8px}
.wi-ans{font-size:11.5px;color:var(--green);font-weight:600;margin-bottom:6px}
.wi-exp{font-size:11.5px;color:var(--muted);line-height:1.6;display:none;margin-bottom:10px}
.wrong-item.open .wi-exp{display:block}
.wi-foot{display:flex;gap:8px;justify-content:flex-end}

/* ===== 杂项 ===== */
.toast{
  position:fixed;left:50%;bottom:90px;transform:translate(-50%,14px);
  background:rgba(28,32,48,.92);color:#fff;padding:10px 18px;border-radius:22px;
  font-size:12.5px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:99;
  box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:80vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade-in{animation:fadeUp .26s ease-out}
.foot-tip{text-align:center;font-size:11px;color:#AFB5C6;padding:8px 0 2px;line-height:1.7}

/* ===== 图标与按钮的补充规则 ===== */
.btn svg,.appbar-back svg,.section-more svg,.topic-arrow svg,.mi-arrow svg,
.search-clear svg,.empty svg,.lab-intro svg,.callout svg{
  stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}
.btn svg{width:16px;height:16px}
.appbar-back svg{stroke-width:2.2}
.section-more svg{width:13px;height:13px;display:inline-block}
.topic-arrow svg{width:16px;height:16px}
.mi-arrow svg{width:15px;height:15px}
.search-clear svg{width:14px;height:14px}
.empty svg{width:52px;height:52px;stroke-width:1.5}
.lab-intro svg,.callout svg{width:15px;height:15px;display:inline-block;vertical-align:-3px;margin-right:4px}
.topic-item,.menu-item{width:100%;text-align:left}

/* ===== 移动端全屏 ===== */
@media (max-width:480px){
  body{background:var(--bg)}
  .desktop-bg{padding:0;min-height:100dvh;background:none}
  .phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}
  .statusbar{padding-top:env(safe-area-inset-top);height:calc(34px + env(safe-area-inset-top))}
}

</style>

        <svg viewBox="0 0 18 12" width="17" height="11" aria-hidden="true"><path d="M1 9.5h2v2H1zm4-2.5h2v4.5H5zm4-3h2v7.5H9zm4-3h2v10.5h-2z" fill="currentColor"/></svg>
        <svg viewBox="0 0 16 12" width="15" height="11" aria-hidden="true"><path d="M8 11.2a1.3 1.3 0 1 0 0-2.6 1.3 1.3 0 0 0 0 2.6zM3.4 6.6a6.6 6.6 0 0 1 9.2 0l-1.3 1.3a4.8 4.8 0 0 0-6.6 0zM.8 4a10.4 10.4 0 0 1 14.4 0L13.9 5.3a8.6 8.6 0 0 0-11.8 0z" fill="currentColor"/></svg>

<script>
/* ============================================================
   物理小课 · 初中物理知识库
   数据文件：模块 / 知识点 / 公式 / 题库
   ============================================================ */

const MODULES = [
  { id:'sound',       name:'声现象',   icon:'sound',       color:'#06B6D4', soft:'#E2F7FB', desc:'产生、传播、特性与利用' },
  { id:'light',       name:'光学',     icon:'light',       color:'#F59E0B', soft:'#FFF4DF', desc:'反射、折射与透镜成像' },
  { id:'thermal',     name:'热学',     icon:'thermal',     color:'#EF6A5B', soft:'#FFEDEA', desc:'物态变化、内能与比热容' },
  { id:'mechanics',   name:'力学',     icon:'mechanics',   color:'#3B82F6', soft:'#E7F0FF', desc:'力、压强、浮力与机械' },
  { id:'electricity', name:'电学',     icon:'electricity', color:'#8B5CF6', soft:'#F1EAFF', desc:'电路、欧姆定律与电功率' },
  { id:'magnetism',   name:'磁与能源', icon:'magnetism',   color:'#10B981', soft:'#E4F8F0', desc:'磁场、电磁感应与能源' }
];

const MODULE_MAP = Object.fromEntries(MODULES.map(m => [m.id, m]));

/* ---------------- 知识点 ---------------- */
const TOPICS = [
  /* ===== 声现象 ===== */
  {
    id:'s1', m:'sound', title:'声音的产生与传播',
    sum:'一切声音都由物体振动产生；传播必须依靠介质，真空不能传声。',
    points:[
      '<b>产生</b>：发声体都在振动，振动停止，<b>发声</b>也停止（但已发出的声音仍会继续传播）。',
      '<b>传播</b>：需要介质（固体、液体、气体都能传声），<b>真空不能传声</b>。',
      '<b>声速</b>：15℃空气中约为 <b>340 m/s</b>；一般 v<sub>固</sub> &gt; v<sub>液</sub> &gt; v<sub>气</sub>；声速还与温度有关。',
      '<b>人耳听声</b>：声音经介质传到耳朵，引起鼓膜振动，再由听觉神经传给大脑。'
    ],
    formulas:[{ e:'v = s / t', n:'声速、路程与时间的关系，声音在空气中传播时常用 v=340 m/s' }],
    pitfall:['「振动停止，声音消失」是错的——停止的只是发声，已经发出的声波还在介质中传播。','太空舱外没有空气，所以宇航员必须靠无线电通话。'],
    example:'对着山谷大喊，2 s 后听到回声，人与山壁距离 s = vt/2 = 340×2/2 = <b>340 m</b>。',
    diagram:'sound_wave'
  },
  {
    id:'s2', m:'sound', title:'声音的三个特性',
    sum:'音调看频率，响度看振幅，音色看发声体本身。三者互相独立。',
    points:[
      '<b>音调</b>：声音的高低，由发声体振动的<b>频率</b>决定。频率越高音调越高，单位赫兹（Hz）。',
      '<b>响度</b>：声音的大小（强弱），与<b>振幅</b>和距发声体的远近有关，还与声音分散程度有关。',
      '<b>音色</b>：声音的品质，由发声体的<b>材料和结构</b>决定，是辨别不同发声体的依据。',
      '人耳听觉范围 <b>20 Hz ~ 20000 Hz</b>；高于 20000 Hz 叫超声波，低于 20 Hz 叫次声波。'
    ],
    formulas:[{ e:'f = n / t', n:'频率＝振动次数/时间，单位 Hz；1 Hz 表示每秒振动 1 次' }],
    pitfall:['「女高音」「男低音」说的是<b>音调</b>；「引吭高歌」「震耳欲聋」说的是<b>响度</b>。','「闻其声知其人」「听声辨西瓜生熟」依据的是<b>音色</b>。','超声波和次声波人耳都听不到，但它们仍是声音，也需要介质传播。'],
    example:'用大小不同的力敲同一音叉，改变的是<b>响度</b>；换用不同频率的音叉，改变的是<b>音调</b>。'
  },
  {
    id:'s3', m:'sound', title:'噪声的危害与控制',
    sum:'从声源、传播过程、人耳三个环节减弱噪声；声音等级用分贝（dB）表示。',
    points:[
      '<b>物理学角度</b>：发声体做无规则振动时发出的声音；<b>环保角度</b>：妨碍人们正常休息、学习和工作的声音。',
      '等级：0 dB 是人刚能听到的最微弱声音；<b>30~40 dB</b> 较理想安静环境；超过 <b>90 dB</b> 会损伤听力。',
      '<b>减弱噪声三途径</b>：①在声源处（摩托车消声器、禁鸣喇叭）；②在传播过程中（隔音墙、植树）；③在人耳处（戴耳塞）。'
    ],
    formulas:[],
    pitfall:['「禁止鸣笛」属于在<b>声源处</b>减弱；「道路两旁设置隔音板」属于在<b>传播过程中</b>减弱。'],
    example:'高速公路旁的声屏障，是在<b>传播过程中</b>减弱噪声。'
  },
  {
    id:'s4', m:'sound', title:'回声与声速计算',
    sum:'回声是声音遇到障碍物反射回来形成的；测距时注意路程是往返的两倍。',
    points:[
      '人耳能把回声与原声区分开，两者时间间隔需大于 <b>0.1 s</b>，对应距障碍物约 <b>17 m</b> 以上。',
      '回声测距要用 <b>s = vt / 2</b>，因为声音走了一个来回。',
      '回声可以加强原声（如空房间里说话更响），也可用于测海深、探测鱼群和潜艇声呐。'
    ],
    formulas:[{ e:'s = v t / 2', n:'回声测距；v 取声速，t 为从发声到听到回声的总时间' }],
    pitfall:['最常见的错误是忘记除以 2，把往返路程当成单程距离。'],
    example:'声呐向海底发射超声波，4 s 后收到回波，水中声速 1500 m/s，海深 h = 1500×4/2 = <b>3000 m</b>。'
  },
  {
    id:'s5', m:'sound', title:'声的利用：超声波与次声波',
    sum:'声既能传递信息，也能传递能量。',
    points:[
      '<b>传递信息</b>：B 超检查、声呐探测、回声定位、超声探伤、蝙蝠靠超声波辨路、地震火山伴随次声波可预报。',
      '<b>传递能量</b>：超声波清洗精密仪器、超声波击碎体内结石、超声波加湿器。',
      '超声波特点：方向性好、穿透能力强、遇杂质易反射；次声波传播距离远、能量衰减小，可绕过障碍物。'
    ],
    formulas:[],
    pitfall:['「B 超」是传递<b>信息</b>，「超声波碎石」是传递<b>能量</b>，这两类应用最容易被混淆。'],
    example:'医生用 B 超观察胎儿，利用的是声能传递<b>信息</b>。'
  },

  /* ===== 光学 ===== */
  {
    id:'l1', m:'light', title:'光的直线传播',
    sum:'光在同种均匀介质中沿直线传播；真空中光速约 3×10⁸ m/s。',
    points:[
      '条件：<b>同种、均匀、透明</b>介质。介质不均匀时（如海面上方空气疏密不同）光路会弯曲。',
      '典型现象：影子的形成、日食月食、小孔成像、激光准直、射击「三点一线」。',
      '<b>小孔成像</b>：成倒立的实像，像的形状与物体相同、与孔的形状无关，大小由物距与像距决定。',
      '光速：真空中 c = <b>3×10⁸ m/s</b> = 3×10⁵ km/s，空气中略小；光年是<b>长度</b>单位。'
    ],
    formulas:[{ e:'c = 3×10⁸ m/s', n:'真空中的光速，是宇宙中最快的速度' }],
    pitfall:['小孔所成的是<b>实像</b>（能被光屏承接）且一定是<b>倒立</b>的；影子不是像。','光年指光一年走过的距离，是长度单位，不是时间单位。'],
    example:'太阳光透过树叶缝隙在地面形成圆形光斑，是太阳通过小孔所成的<b>倒立实像</b>，所以是圆形。',
    diagram:'pinhole'
  },
  {
    id:'l2', m:'light', title:'光的反射与平面镜成像',
    sum:'反射角等于入射角；平面镜成正立、等大的虚像，像与物关于镜面对称。',
    points:[
      '<b>反射定律</b>：反射光线、入射光线和法线在同一平面内；反射光线与入射光线分居法线两侧；<b>反射角等于入射角</b>。',
      '光路是<b>可逆</b>的；镜面反射与漫反射都遵守反射定律。',
      '<b>平面镜成像特点</b>：像与物大小相等、到镜面距离相等、连线与镜面垂直、左右相反，是<b>正立的虚像</b>。',
      '注意：入射角是入射光线与<b>法线</b>的夹角，不是与镜面的夹角。'
    ],
    formulas:[{ e:'∠r = ∠i', n:'反射角等于入射角；若光线与镜面成 θ 角，则入射角为 90°−θ' }],
    pitfall:['人走向平面镜时，<b>像的大小不变</b>（因为像始终与物等大），只是视角变大所以「看起来变大」。','平面镜成的是虚像，<b>不能用光屏承接</b>；影子、小孔成像、照相机成的都是实像。'],
    example:'入射光线与镜面成 30°，则入射角 = 90°−30° = <b>60°</b>，反射角也是 60°，反射光线与入射光线夹角为 120°。',
    diagram:'reflection'
  },
  {
    id:'l3', m:'light', title:'光的折射',

  { id:'q10', m:'light', lv:2, stem:'光从空气斜射入水中时，下列说法正确的是（　）', opts:['折射角大于入射角','折射角小于入射角','传播方向一定不变','折射角等于入射角'], ans:1, exp:'光从空气（光疏）斜射入水（光密），向法线偏折，折射角小于入射角。垂直入射时方向才不变。' },
  { id:'q11', m:'light', lv:2, stem:'人在岸上看水中的鱼，看到的是鱼的（　）', opts:['实像，位置比实际深','虚像，位置比实际浅','虚像，位置比实际深','实像，位置不变'], ans:1, exp:'鱼反射的光由水进入空气发生折射，人眼逆着折射光线看去，看到的是位置偏高（变浅）的虚像，所以叉鱼要瞄准更深处。' },
  { id:'q12', m:'light', lv:2, stem:'物体位于凸透镜 2 倍焦距以外时，成的像是（　）', opts:['倒立、缩小的实像','倒立、放大的实像','正立、放大的虚像','正立、等大的虚像'], ans:0, exp:'u > 2f 时成倒立、缩小的实像，应用是照相机；f < u < 2f 成倒立放大实像（投影仪）；u < f 成正立放大虚像（放大镜）。' },
  { id:'q13', m:'light', lv:3, stem:'物体从距凸透镜较远处向透镜靠近（始终大于焦距），则像和像距的变化是（　）', opts:['像变小，像距变小','像变大，像距变大','像变大，像距变小','像不变，像距不变'], ans:1, exp:'成实像时遵循「物近像远像变大」：物距减小，像距增大，像也变大。' },
  { id:'q14', m:'light', lv:2, stem:'近视眼成像位置和矫正方法是（　）', opts:['像成在视网膜后，用凸透镜','像成在视网膜前，用凹透镜','像成在视网膜前，用凸透镜','像成在视网膜后，用凹透镜'], ans:1, exp:'近视眼晶状体折光能力太强或眼球前后径过长，像成在视网膜前，需用对光有发散作用的凹透镜矫正。' },
  { id:'q15', m:'light', lv:2, stem:'电视遥控器使用的、以及验钞机使用的分别是（　）', opts:['紫外线、红外线','红外线、紫外线','都是红外线','都是紫外线'], ans:1, exp:'遥控器利用红外线（热效应、可遥控），验钞机利用紫外线能使荧光物质发光。' },

  /* 热学 8 */
  { id:'q16', m:'thermal', lv:1, stem:'关于温度计的使用，下列做法正确的是（　）', opts:['玻璃泡碰到容器底','读数时把温度计取出液体','待示数稳定后再读数','视线与液柱上表面成 45°'], ans:2, exp:'玻璃泡要全部浸入且不碰底和壁；读数时不能离开被测液体；视线应与液柱上表面相平；必须等示数稳定。' },
  { id:'q17', m:'thermal', lv:2, stem:'晶体在熔化过程中（　）', opts:['温度升高，内能不变','温度不变，内能增加','温度不变，内能不变','温度降低，内能减少'], ans:1, exp:'晶体熔化时温度保持在熔点不变，但需要持续吸热，因此内能增加，物质处于固液共存态。' },
  { id:'q18', m:'thermal', lv:1, stem:'夏天在地上洒水感觉凉快，主要是因为（　）', opts:['水的温度低','水蒸发吸热','水液化放热','水的比热容大'], ans:1, exp:'水蒸发（汽化）时从周围吸收热量，有致冷作用。扇扇子也是加快汗液蒸发吸热，并不降低气温。' },
  { id:'q19', m:'thermal', lv:2, stem:'冬天嘴里呼出的「白气」，其形成过程和物态变化是（　）', opts:['水蒸气，汽化','小水滴，液化','小冰晶，凝华','小水滴，熔化'], ans:1, exp:'水蒸气无色透明不可见；呼出的水蒸气遇冷液化成小水滴悬浮在空中，才形成可见的「白气」。' },
  { id:'q20', m:'thermal', lv:2, stem:'下列现象中属于凝华的是（　）', opts:['露水的形成','雾的形成','霜的形成','冰化成水'], ans:2, exp:'霜、雾凇、窗上的冰花是水蒸气直接变成小冰晶，属于凝华（放热）；露和雾是液化，冰化水是熔化。' },
  { id:'q21', m:'thermal', lv:2, stem:'水沸腾时，下列说法正确的是（　）', opts:['气泡上升变小','温度不断升高','继续吸热但温度不变','不需要继续吸热'], ans:2, exp:'沸腾是在沸点下内部和表面同时剧烈汽化，气泡上升变大；沸腾时温度保持不变，但必须继续吸热。' },
  { id:'q22', m:'thermal', lv:2, stem:'沿海地区昼夜温差比内陆小，主要原因是（　）', opts:['水的密度大','水的比热容大','水的沸点高','海水会流动'], ans:1, exp:'水的比热容大，在吸收或放出相同热量时温度变化小，因此对气温有调节作用，也是汽车用水作冷却剂的原因。' },
  { id:'q23', m:'thermal', lv:3, stem:'2 kg 水温度从 20℃ 升高到 70℃，吸收的热量是 [c水=4.2×10³ J/(kg·℃)]（　）', opts:['4.2×10⁴ J','1.68×10⁵ J','4.2×10⁵ J','8.4×10⁵ J'], ans:2, exp:'Q = cmΔt = 4.2×10³ × 2 × (70−20) = 4.2×10⁵ J。注意 Δt 是温度变化量 50℃，不是 70℃。' },
  { id:'q24', m:'thermal', lv:2, stem:'下列改变物体内能的方式中，属于做功的是（　）', opts:['用热水袋暖手','阳光晒热棉被','反复弯折铁丝发热','把冰块放入饮料'], ans:2, exp:'弯折铁丝是克服摩擦/形变做功，机械能转化为内能；其余三项都是热传递（能量的转移）。' },

  /* 力学 12 */
  { id:'q25', m:'mechanics', lv:1, stem:'把一块铁从地球带到月球，不发生变化的物理量是（　）', opts:['质量','重力','密度','质量和密度'], ans:3, exp:'质量是物体属性，与位置无关；密度是物质特性，也不变。重力因月球 g 较小而变小（约为地球的 1/6）。' },
  { id:'q26', m:'mechanics', lv:2, stem:'一瓶矿泉水喝掉一半后，剩下水的密度（　）', opts:['变为原来的一半','变为原来的 2 倍','不变','无法判断'], ans:2, exp:'密度是物质的特性，质量和体积同比例减半，比值 ρ = m/V 保持不变。' },
  { id:'q27', m:'mechanics', lv:2, stem:'关于惯性，下列说法正确的是（　）', opts:['运动越快的物体惯性越大','静止的物体没有惯性','惯性大小只与质量有关','惯性是一种力'], ans:2, exp:'一切物体在任何状态下都有惯性，惯性大小只由质量决定，与速度、受力无关；惯性不是力，不能说「受到惯性」。' },
  { id:'q28', m:'mechanics', lv:2, stem:'书静止在水平桌面上，下列属于一对平衡力的是（　）', opts:['书受到的重力与书对桌面的压力','书受到的重力与桌面对书的支持力','书对桌面的压力与桌面对书的支持力','书受到的重力与桌面受到的重力'], ans:1, exp:'平衡力必须作用在同一物体上：重力与支持力都作用在书上，等大反向共线。C 是一对相互作用力，分别作用在桌面和书上。' },
  { id:'q29', m:'mechanics', lv:1, stem:'下列实例中，为了增大压强的是（　）', opts:['书包背带做得较宽','铁轨铺在枕木上','菜刀刀刃磨得很薄','滑雪板做得宽大'], ans:2, exp:'刀刃磨薄是减小受力面积来增大压强；其余三项都是增大受力面积来减小压强。' },
  { id:'q30', m:'mechanics', lv:2, stem:'关于液体压强，下列说法正确的是（　）', opts:['与容器形状有关','与液体总重有关','只与液体密度和深度有关','越深处压强越小'], ans:2, exp:'p = ρgh，液体压强只与密度和该点到自由液面的竖直深度有关，与容器形状、液体总量无关；越深压强越大。' },
  { id:'q31', m:'mechanics', lv:2, stem:'用吸管把饮料吸进嘴里，主要利用了（　）', opts:['嘴的吸力','大气压','液体压强','浮力'], ans:1, exp:'吸气使管内气压减小，外界大气压把饮料压入管内。钢笔吸墨水、吸盘挂钩同理。' },
  { id:'q32', m:'mechanics', lv:2, stem:'列车进站时人要站在安全线以外，因为列车高速通过时（　）', opts:['车速大，人与车之间空气流速大、压强小','车速大，人与车之间压强大','空气不流动','列车有吸引力'], ans:0, exp:'流体流速越大的位置压强越小，人与车之间空气流速大压强小，外侧较大的气压会把人推向列车。' },
  { id:'q33', m:'mechanics', lv:2, stem:'一个物体完全浸没在水中后继续下沉（未触底），它受到的浮力（　）', opts:['变大','变小','不变','先变大后变小'], ans:2, exp:'完全浸没后 V排 不变，水的密度不变，由 F浮=ρ液gV排 可知浮力不变；变化的是液体压强随深度增大。' },
  { id:'q34', m:'mechanics', lv:3, stem:'轮船从长江驶入大海（始终漂浮），它受到的浮力和吃水深度（　）', opts:['浮力变大，吃水变深','浮力不变，吃水变浅','浮力变小，吃水变浅','浮力不变，吃水变深'], ans:1, exp:'漂浮时 F浮 = G 始终不变；海水密度大于江水，由 V排=F浮/(ρ液g) 可知 V排 变小，船会上浮一些、吃水变浅。' },
  { id:'q35', m:'mechanics', lv:2, stem:'下列工具中，属于费力杠杆的是（　）', opts:['开瓶扳手','老虎钳','镊子','撬棒'], ans:2, exp:'镊子动力臂小于阻力臂，是费力杠杆但省距离；开瓶器、老虎钳、撬棒都是省力杠杆。' },
  { id:'q36', m:'mechanics', lv:2, stem:'关于功和功率，下列说法正确的是（　）', opts:['做功越多，功率一定越大','功率越大，做功越快','机械效率越高，功率越大','用力推石头没推动，也做了功'], ans:1, exp:'功率表示做功快慢，P = W/t，做功多但时间很长功率未必大；机械效率与功率无必然关系；有力无距离不做功。' },
  { id:'q37', m:'mechanics', lv:3, stem:'用滑轮组把 100 N 的物体匀速提升 2 m，拉力做功 250 J，该滑轮组的机械效率是（　）', opts:['40%','50%','80%','125%'], ans:2, exp:'W有 = Gh = 100×2 = 200 J，W总 = 250 J，η = 200/250×100% = 80%。机械效率恒小于 100%。' },

  /* 电学 11 */
  { id:'q38', m:'electricity', lv:1, stem:'关于电流表的使用，下列说法正确的是（　）', opts:['与被测用电器并联','可以直接接在电源两极','必须串联在被测电路中','电流从「−」接线柱流入'], ans:2, exp:'电流表必须串联，电流「+」进「−」出，不能超过量程，绝不允许不经过用电器直接接到电源两极（会短路烧表）。' },
  { id:'q39', m:'electricity', lv:1, stem:'关于电压表的使用，下列说法正确的是（　）', opts:['必须串联在电路中','必须并联在被测电路两端','不能直接接电源两极','电流从「−」接线柱流入'], ans:1, exp:'电压表并联在被测电路两端，可直接接在电源两极测电源电压，同样要「+」进「−」出、不超量程。' },
  { id:'q40', m:'electricity', lv:1, stem:'串联电路中，各处电流的关系是（　）', opts:['越靠近正极越大','各处相等','与电阻成正比','与电阻成反比'], ans:1, exp:'串联电路只有一条电流路径，I = I₁ = I₂ = …；并联电路干路电流等于各支路电流之和。' },
  { id:'q41', m:'electricity', lv:2, stem:'关于电阻，下列说法正确的是（　）', opts:['导体电阻与电压成正比','导体电阻与电流成反比','电阻是导体本身的属性','电压为 0 时电阻也为 0'], ans:2, exp:'电阻由材料、长度、横截面积和温度决定，与所加电压、通过的电流无关。R = U/I 只是计算式，不是决定式。' },
  { id:'q42', m:'electricity', lv:2, stem:'滑动变阻器改变电阻的原理是改变接入电路中电阻丝的（　）', opts:['材料','长度','横截面积','温度'], ans:1, exp:'滑片移动改变接入电路电阻丝的长度从而改变电阻；接线要「一上一下」，闭合开关前调到阻值最大处保护电路。' },
  { id:'q43', m:'electricity', lv:2, stem:'某导体两端电压为 6 V 时通过的电流为 0.3 A，若电压变为 3 V，则电流和电阻分别为（　）', opts:['0.15 A，10 Ω','0.15 A，20 Ω','0.6 A，20 Ω','0.3 A，20 Ω'], ans:1, exp:'R = U/I = 6/0.3 = 20 Ω，电阻不变；电压减半则 I = 3/20 = 0.15 A。' },
  { id:'q44', m:'electricity', lv:2, stem:'R₁=10 Ω 与 R₂=20 Ω 串联接在 6 V 电源上，R₂ 两端电压为（　）', opts:['2 V','3 V','4 V','6 V'], ans:2, exp:'串联总电阻 30 Ω，I = 6/30 = 0.2 A，U₂ = IR₂ = 0.2×20 = 4 V（U₁ = 2 V）；串联分压与电阻成正比。' },
  { id:'q45', m:'electricity', lv:2, stem:'两个电阻并联后的总电阻（　）', opts:['大于其中任一个','小于其中任一个','等于两者之和','等于两者之差'], ans:1, exp:'并联相当于增大导体横截面积，总电阻变小且小于任一支路电阻；两个 10 Ω 并联为 5 Ω。' },
  { id:'q46', m:'electricity', lv:3, stem:'标有「220 V 100 W」的灯泡接在 110 V 电路中（灯丝电阻不变），实际功率为（　）', opts:['100 W','50 W','25 W','200 W'], ans:2, exp:'P实/P额 = (U实/U额)² = (110/220)² = 1/4，故 P实 = 25 W。灯泡亮度由实际功率决定。' },
  { id:'q47', m:'electricity', lv:2, stem:'焦耳定律 Q = I²Rt 说明，电流产生的热量（　）', opts:['与电流成正比','与电流的平方成正比','与电阻成反比','与时间成反比'], ans:1, exp:'热量与电流的平方、电阻、通电时间成正比。所以电流增大为 2 倍，相同时间内产生的热量变为 4 倍。' },
  { id:'q48', m:'electricity', lv:2, stem:'关于家庭电路，下列做法正确的是（　）', opts:['开关接在零线上','各用电器串联','三孔插座上孔接地线','用铜丝代替保险丝'], ans:2, exp:'三孔插座「左零右火上接地」；开关必须接火线，各用电器并联，保险丝不能用铜丝铁丝代替（熔点太高起不到保护作用）。' },
  { id:'q49', m:'electricity', lv:3, stem:'串联电路中滑动变阻器阻值调大时（电源电压不变），下列说法正确的是（　）', opts:['电流表示数变大，定值电阻两端电压变大','电流表示数变小，定值电阻两端电压变小','电流表示数变小，定值电阻两端电压变大','电流表示数不变'], ans:1, exp:'总电阻变大 → I = U/R 变小 → 定值电阻 U = IR 变小；滑变两端电压因总电压不变而变大（串联分压）。' },

  /* 磁与能源 5+ */
  { id:'q50', m:'magnetism', lv:1, stem:'关于磁感线，下列说法正确的是（　）', opts:['磁感线是真实存在的','磁体外部磁感线从 N 极到 S 极','磁感线可以相交','磁感线越疏磁场越强'], ans:1, exp:'磁感线是为描述磁场而假想的曲线，并不真实存在；外部从 N 到 S、内部从 S 到 N 构成闭合曲线且不相交；越密磁场越强。' },
  { id:'q51', m:'magnetism', lv:2, stem:'奥斯特实验说明了（　）', opts:['磁能生电','电流周围存在磁场','磁场对电流有力的作用','通电导体在磁场中运动'], ans:1, exp:'奥斯特发现通电导线使附近小磁针偏转，说明电流周围存在磁场（电流的磁效应），且方向与电流方向有关。' },
  { id:'q52', m:'magnetism', lv:2, stem:'发电机和电动机的工作原理分别是（　）', opts:['都是电磁感应','电磁感应、磁场对通电导线有力的作用','磁场对通电导线有力的作用、电磁感应','都是电流的磁效应'], ans:1, exp:'发电机把机械能转化为电能，原理是电磁感应；电动机把电能转化为机械能，原理是通电导体在磁场中受力。' },
  { id:'q53', m:'magnetism', lv:2, stem:'闭合电路的一部分导体在磁场中运动，一定能产生感应电流的情况是（　）', opts:['沿磁感线方向运动','静止不动','做切割磁感线运动','只要导体在磁场中'], ans:2, exp:'产生感应电流需同时满足：闭合电路、一部分导体、做切割磁感线运动。沿磁感线方向运动不切割，无感应电流。' },

const LAB_STATE = {
  refraction: { i:35, medium:'air_water' },
  lens:       { u:25, f:10 },
  ohm:        { U:6, R:20 }
};

const MEDIUMS = {
  air_water:  { label:'空气 → 水',   n1:1,    n2:1.33 },
  air_glass:  { label:'空气 → 玻璃', n1:1,    n2:1.5  },
  water_air:  { label:'水 → 空气',   n1:1.33, n2:1    }
};

function labCompute(key){
  const s = LAB_STATE[key];
  if(key === 'refraction'){
    const med = MEDIUMS[s.medium];
    const rad = s.i * Math.PI / 180;
    const sinR = med.n1 * Math.sin(rad) / med.n2;
    const total = sinR > 1;
    const r = total ? null : Math.asin(sinR) * 180 / Math.PI;
    const critical = med.n1 > med.n2 ? Math.asin(med.n2/med.n1) * 180 / Math.PI : null;
    return { s, med, r, total, critical, i:s.i };
  }
  if(key === 'lens'){
    const { u, f } = s;
    const near = Math.abs(u - f) < 0.01;
    const v = near ? Infinity : f*u/(u-f);
    const real = u > f;
    const m = near ? Infinity : Math.abs(v/u);
    let kind, use;
    if(near){ kind = '不成像（光线平行射出）'; use = 'u = f 是成实像与虚像的分界点'; }
    else if(u > 2*f){ kind = '倒立、缩小的实像'; use = '照相机 / 摄像头'; }
    else if(Math.abs(u-2*f) < 0.01){ kind = '倒立、等大的实像'; use = '可用来测量焦距'; }
    else if(real){ kind = '倒立、放大的实像'; use = '投影仪 / 幻灯机'; }
    else { kind = '正立、放大的虚像'; use = '放大镜'; }
    return { s, u, f, v, real, m, near, kind, use };
  }
  // ohm
  const I = s.U / s.R;
  return { s, U:s.U, R:s.R, I };
}

  return svgBox(s, 200);
}

function labReadout(key){
  const c = labCompute(key);
  if(key === 'refraction'){
    return '<div><b>' + c.i + '°</b><span>入射角 i</span></div>' +
           '<div><b>' + c.i + '°</b><span>反射角</span></div>' +
           '<div><b>' + (c.total ? '全反射' : c.r.toFixed(1) + '°') + '</b><span>折射角 r</span></div>';
  }
  if(key === 'lens'){
    const v = c.near ? '∞' : (c.real ? c.v.toFixed(1) : '−' + Math.abs(c.v).toFixed(1));
    return '<div><b>' + c.u.toFixed(1) + ' cm</b><span>物距 u</span></div>' +
           '<div><b>' + v + '</b><span>' + (c.real?'实像像距':'虚像像距') + '</span></div>' +
           '<div><b>' + (c.near ? '—' : c.m.toFixed(2) + '×') + '</b><span>放大率</span></div>';
  }
  return '<div><b>' + c.U.toFixed(1) + ' V</b><span>电压 U</span></div>' +
         '<div><b>' + c.R + ' Ω</b><span>电阻 R</span></div>' +
         '<div><b>' + c.I.toFixed(3) + ' A</b><span>电流 I = U/R</span></div>';
}

function labNote(key){
  const c = labCompute(key);
  if(key === 'refraction'){
    let t = '<b>规律：</b>反射角始终等于入射角；光从光疏介质斜射入光密介质时折射角小于入射角，反之大于入射角。';
    if(c.total) t += ' 当前入射角超过临界角 ' + c.critical.toFixed(1) + '°，发生<b>全反射</b>，折射光线消失（光纤通信的原理）。';
    else if(c.med.n1 > c.med.n2) t += ' 当前从水射向空气，折射角大于入射角；继续增大入射角到 ' + c.critical.toFixed(1) + '° 以上就会发生全反射。';
    else t += ' 试试切换到「水 → 空气」并增大入射角，观察全反射现象。';
    return t;
  }
  if(key === 'lens'){
    return '<b>' + c.kind + '</b>　·　应用：' + c.use + '。<br>' +
      '口诀：一倍焦距分虚实，二倍焦距分大小；成实像时「物近像远像变大」。';
  }
  return '<b>结论：</b>电阻 R 一定时，电流 I 与电压 U 成正比（图线是过原点的直线）；电压一定时，I 与 R 成反比。<br>' +
    '图线斜率 = 1/R，电阻越大直线越平缓。当前 I = ' + c.U.toFixed(1) + ' V / ' + c.R + ' Ω = ' + c.I.toFixed(3) + ' A。';
}

  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 1800);
}
function stripTags(s){ return String(s).replace(/<[^>]+>/g,''); }
function ringSVG(pct, r, stroke){
  const c = 2 * Math.PI * r, size = (r + 7) * 2, cc = r + 7;
  return '<svg viewBox="0 0 ' + size + ' ' + size + '" width="' + size + '" height="' + size + '">' +
    '<circle cx="' + cc + '" cy="' + cc + '" r="' + r + '" fill="none" stroke="rgba(255,255,255,.24)" stroke-width="6"/>' +
    '<circle cx="' + cc + '" cy="' + cc + '" r="' + r + '" fill="none" stroke="' + (stroke||'#fff') +
    '" stroke-width="6" stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) +
    '" stroke-dashoffset="' + (c*(1-pct)).toFixed(1) + '"/></svg>';
}
function modOf(id){ return MODULE_MAP[id] || MODULES[0]; }
function modTag(id){ const m = modOf(id); return '<span class="tag" style="background:' + m.soft + ';color:' + m.color + '">' + m.name + '</span>'; }

/* ---------------- 路由 ---------------- */
function go(tab, page, params){
  state.stack.push({ tab:state.tab, page:state.page, params:state.params });
  state.tab = tab; state.page = page; state.params = params || {};
  document.getElementById('view').scrollTop = 0;
  render();
}
function back(){
  if(!state.stack.length) return;
  const p = state.stack.pop();
  state.tab = p.tab; state.page = p.page; state.params = p.params;
  document.getElementById('view').scrollTop = 0;
  render();
}
function switchTab(tab){
  state.stack = [];
  state.tab = tab; state.page = DEFAULT_PAGE[tab]; state.params = {};
  document.getElementById('view').scrollTop = 0;
  render();
}
function titleFor(){
  const p = state.page, t = state.tab;
  if(t === 'home') return '物理小课';
  if(t === 'learn') return p === 'detail' ? '知识点详情' : '知识地图';
  if(t === 'lab') return '互动实验';
  if(t === 'quiz'){
    if(p === 'running') return '第 ' + (state.quiz ? state.quiz.idx+1 : 1) + ' 题';
    if(p === 'result') return '练习报告';
    return '刷题练习';
  }
  if(t === 'me'){
    return { main:'我的', wrong:'错题本', fav:'我的收藏', stats:'学习统计' }[p] || '我的';
  }
  return '物理小课';
}

/* ---------------- 渲染入口 ---------------- */
function render(){
  document.getElementById('appTitle').textContent = titleFor();
  document.getElementById('backBtn').innerHTML = state.stack.length ? icon('back') : '';
  document.getElementById('tabbar').innerHTML = [
    ['home','home','首页'],['learn','book','知识'],['lab','flask','实验'],['quiz','quiz','练习'],['me','user','我的']
  ].map(t => '<button class="tab' + (state.tab===t[0]?' active':'') + '" data-act="tab" data-tab="' + t[0] + '">' + icon(t[1]) + '<span>' + t[2] + '</span></button>').join('');

  const map = { home:renderHome, learn:renderLearn, lab:renderLab, quiz:renderQuiz, me:renderMe };
  document.getElementById('view').innerHTML = map[state.tab]();
  initSliders();
}

      else cls += ' dim';
    } else if(i === qz.picked) cls += ' selected';
    return '<button class="' + cls + '" data-act="quizOpt" data-i="' + i + '"><span class="k">' + letters[i] + '</span><span>' + o + '</span></button>';
  }).join('');
  const ok = qz.picked === q.ans;

  let h = '<div class="quiz-head"><span>第 ' + (qz.idx+1) + ' / ' + qz.list.length + ' 题</span>' +
    '<span>' + modOf(q.m).name + ' · ' + ['','基础','进阶','提高'][q.lv] + '</span></div>' +
    '<div class="quiz-bar"><i style="width:' + ((qz.idx+1)/qz.list.length*100) + '%"></i></div>' +
    '<div class="q-card"><div class="q-meta">' + modTag(q.m) + '<span class="badge gray">单选题</span></div>' +
    '<div class="q-stem">' + q.stem + '</div><div class="options">' + opts + '</div>' +
    '<div class="explain-box ' + (qz.checked ? (ok?'ok':'no') : '') + (qz.checked?' show':'') + '">' +
      (qz.checked ? '<div class="eh">' + (ok ? '✓ 回答正确' : '✗ 回答错误') + '</div>' +
        '<div>正确答案：<span class="ans">' + letters[q.ans] + '. ' + q.opts[q.ans] + '</span></div>' +
        '<div style="margin-top:6px">' + q.exp + '</div>' : '') +
    '</div></div>';

  h += '<div class="quiz-foot">';
  if(!qz.checked){
    h += '<button class="btn block" data-act="quizConfirm"' + (qz.picked===null?' disabled':'') + '>确认答案</button>';
  } else {
    h += '<button class="btn ghost" style="flex:0 0 34%" data-act="quizFav" data-id="' + q.id + '">' + icon('star') + '收藏题</button>';
    h += '<button class="btn block" data-act="quizNext">' + (qz.idx+1===qz.list.length?'查看报告':'下一题') + '</button>';
  }
  h += '</div>';
  h += '<div class="foot-tip">答错的题目会自动进入错题本，方便集中复盘</div>';
  return h;
}
function quizConfirm(){
  const qz = state.quiz; if(!qz || qz.checked || qz.picked===null) return;
  const q = qz.list[qz.idx];
  const ok = qz.picked === q.ans;
  qz.checked = true;
  state.data.answered++;
  if(ok){ qz.right++; state.data.correct++; }
  else {
    qz.wrongIds.push(q.id);
    if(!state.data.wrong.includes(q.id)) state.data.wrong.push(q.id);
  }
  const st = state.data.moduleStat[q.m] || {a:0,c:0};
  st.a++; if(ok) st.c++;
  state.data.moduleStat[q.m] = st;
  saveData();
  render();
}
function quizNext(){
  const qz = state.quiz; if(!qz) return;
  if(qz.idx + 1 >= qz.list.length){
    state.data.sessions++;
    saveData();
    state.page = 'result';
  } else {
    qz.idx++; qz.picked = null; qz.checked = false;
  }
  render();
}
function renderQuizResult(){
  const qz = state.quiz;
  if(!qz){ state.page='setup'; return renderQuizSetup(); }
  const total = qz.list.length, pct = qz.right/total;
  const title = pct === 1 ? '满分！太厉害了' : pct >= 0.8 ? '掌握得很不错' : pct >= 0.6 ? '继续加油，快到手了' : '别灰心，回头看看知识点';
  let h = '<div class="result-hero"><div class="result-ring">' + ringSVG(pct, 48) +
    '<div class="rr"><b>' + Math.round(pct*100) + '</b><small>分</small></div></div>' +
    '<div class="result-title">' + title + '</div><div class="result-sub">共 ' + total + ' 题，答对 ' + qz.right + ' 题</div></div>';
  h += '<div class="result-stats"><div><b style="color:#10B981">' + qz.right + '</b><span>答对</span></div>' +
       '<div><b style="color:#EF4444">' + (total-qz.right) + '</b><span>答错</span></div>' +
       '<div><b>' + Math.round(pct*100) + '%</b><span>正确率</span></div>' +
       '<div><b>' + state.data.sessions + '</b><span>累计组数</span></div></div>';

  if(qz.wrongIds.length){
    h += '<div class="section-title"><div class="st-left"><span>本组错题</span></div><span class="badge gray">' + qz.wrongIds.length + ' 题</span></div>';
    h += qz.wrongIds.map(id => {
      const q = QUESTIONS.find(x=>x.id===id);
      return q ? '<div class="wrong-item open"><div class="wi-stem">' + q.stem + '</div>' +
        '<div class="wi-ans">正确答案：' + 'ABCD'[q.ans] + '. ' + q.opts[q.ans] + '</div>' +
        '<div class="wi-exp">' + q.exp + '</div></div>' : '';
    }).join('');
  } else {
    h += '<div class="callout tip">本组全部答对，没有错题。可以换个模块或提高难度继续挑战。</div>';
  }
  h += '<div class="nav-bottom" style="margin-top:16px">' +
    '<button class="btn gray" data-act="quizAgain">再来一组</button>' +
    '<button class="btn primary grow" data-act="quizWrong"' + (state.data.wrong.length?'':' disabled') + '>错题重练</button></div>';
  h += '<button class="btn outline block" style="margin-top:10px" data-act="tab" data-tab="home">返回首页</button>';
  return h;
}

/* ============================================================
   我的
   ============================================================ */
function renderMe(){
  if(state.page !== 'main') return renderMeSub();
  const lvl = state.data.answered >= 100 ? '物理达人' : state.data.answered >= 40 ? '进阶探索者' : state.data.answered >= 10 ? '入门学徒' : '新手上路';
  let h = '<div class="profile"><div class="avatar">⚛️</div><div class="grow">' +
    '<b>物理探索者</b><span>每天进步一点点</span><div class="lv">' + lvl + ' · 连续打卡 ' + streakDays() + ' 天</div></div></div>';
  h += '<div class="stat-grid">' +
    '<div><b>' + state.data.done.length + '</b><span>已学知识点</span></div>' +
    '<div><b>' + state.data.answered + '</b><span>累计做题</span></div>' +
    '<div><b>' + accuracy() + '%</b><span>正确率</span></div>' +
    '<div><b>' + state.data.wrong.length + '</b><span>错题</span></div></div>';

  h += '<div class="card"><div class="d-h" style="margin-bottom:4px"><i class="dot"></i>最近 7 天打卡</div>' +
    '<div class="heat">' + (function(){
      const set = new Set(state.data.days); let s = '';
      for(let i=6;i>=0;i--){
        const d = new Date(); d.setDate(d.getDate()-i);
        const key = fmtDate(d);
        s += '<i class="' + (set.has(key)?'on':'') + '">' + (d.getMonth()+1) + '/' + d.getDate() + '</i>';
      }
      return s;
    })() + '</div></div>';

  const menu = [
    ['wrong','错题本','#FEECEC','#DC2626', state.data.wrong.length + ' 题'],
    ['fav','我的收藏','#FFF4DF','#D97706', state.data.fav.length + ' 个'],
    ['stats','学习统计','#EEF0FF','#4F46E5','查看报告'],
    ['clear','清空学习数据','#F1F3F9','#7A8198','']
  ];
  h += '<div class="menu-list">' + menu.map(m =>
    '<button class="menu-item" data-act="mePage" data-p="' + m[0] + '"><div class="mi-ic" style="background:' + m[2] + ';color:' + m[3] + '">' +
    icon(m[0]==='clear'?'trash':m[0]==='stats'?'chart':m[0]==='fav'?'star':'wrong') + '</div>' +
    '<div class="mi-t">' + m[1] + '</div><div class="mi-v">' + m[4] + '</div><div class="mi-arrow">' + icon('arrow') + '</div></button>'
  ).join('') + '</div>';
  h += '<div class="foot-tip">学习数据保存在本机浏览器，不会上传<br>物理小课 v1.0 · 初中物理同步</div>';
  return h;
}
function renderMeSub(){
  const p = state.page;
  if(p === 'wrong'){
    const list = state.data.wrong.map(id => QUESTIONS.find(q=>q.id===id)).filter(Boolean);
    if(!list.length) return emptyHTML('错题本是空的', '保持得不错，继续刷题吧') +
      '<button class="btn block" data-act="tab" data-tab="quiz">去练习</button>';
    return '<div class="callout info" style="margin-bottom:14px">共 ' + list.length + ' 道错题。点击卡片展开解析，也可以集中重练一遍。</div>' +
      list.map(q => '<div class="wrong-item" id="wi' + q.id + '"><div class="row" style="margin-bottom:8px">' + modTag(q.m) + '<span class="badge gray">' + q.id.toUpperCase() + '</span></div>' +
        '<div class="wi-stem" data-act="wrongToggle" data-id="' + q.id + '">' + q.stem + '</div>' +
        '<div class="wi-ans">正确答案：' + 'ABCD'[q.ans] + '. ' + q.opts[q.ans] + '</div>' +
        '<div class="wi-exp">' + q.exp + '</div>' +
        '<div class="wi-foot"><button class="btn gray sm" data-act="wrongRemove" data-id="' + q.id + '">已掌握，移除</button>' +
        '<button class="btn ghost sm" data-act="wrongToggle" data-id="' + q.id + '">查看解析</button></div></div>').join('') +
      '<button class="btn block" style="margin-top:6px" data-act="quizWrong">重练全部错题</button>';
  }
  if(p === 'fav'){
    const items = state.data.fav.map(fid => {
      const t = TOPICS.find(x => x.id === fid); if(t) return { type:'topic', t };
      const q = QUESTIONS.find(x => x.id === fid); if(q) return { type:'quiz', q };
      return null;
    }).filter(Boolean);
    if(!items.length) return emptyHTML('还没有收藏', '在知识点详情页或练习解析里点击「收藏」即可加入') +
      '<button class="btn block" data-act="tab" data-tab="learn">去看知识点</button>';
    return '<div class="callout info" style="margin-bottom:14px">共 ' + items.length + ' 条收藏。点击知识点可查看详情，点击题目可单独重做。</div>' +
      items.map(o => {
        if(o.type === 'topic'){
          return '<button class="topic-item" data-act="topic" data-id="' + o.t.id + '">' +
            '<div class="topic-idx" style="background:#FFF4DF;color:#D97706">★</div>' +
            '<div class="grow"><div class="topic-tt">' + o.t.title + '</div><div class="topic-ss">' + o.t.sum + '</div></div>' +
            '<div class="topic-arrow">' + icon('arrow') + '</div></button>';
        }
        return '<button class="topic-item" data-act="favQuiz" data-id="' + o.q.id + '">' +
          '<div class="topic-idx" style="background:#EEF0FF;color:#4F46E5">题</div>' +
          '<div class="grow"><div class="topic-tt">' + o.q.stem + '</div><div class="topic-ss">' + modOf(o.q.m).name + ' · 点击单独重做</div></div>' +
          '<div class="topic-arrow">' + icon('arrow') + '</div></button>';
      }).join('');
  }
  // stats
  const donePct = Math.round(state.data.done.length/TOPICS.length*100);
  const weak = MODULES.map(m => {
    const st = state.data.moduleStat[m.id] || {a:0,c:0};
    return { m, rate: st.a ? Math.round(st.c/st.a*100) : null, n:st.a };
  }).sort((a,b) => (a.rate===null?101:a.rate) - (b.rate===null?101:b.rate));
  let h = '<div class="card"><div class="d-h"><i class="dot"></i>知识点掌握进度</div>' +
    '<div class="spread small"><span>已学 ' + state.data.done.length + ' / ' + TOPICS.length + ' 个</span><b>' + donePct + '%</b></div>' +
    '<div class="quiz-bar" style="margin-top:8px"><i style="width:' + donePct + '%"></i></div>' +
    MODULES.map(m => {
      const total = TOPICS.filter(t=>t.m===m.id).length;
      const got = TOPICS.filter(t=>t.m===m.id && state.data.done.includes(t.id)).length;
      return '<div style="margin-top:12px"><div class="spread small"><span>' + m.name + '</span><span class="muted">' + got + '/' + total + '</span></div>' +
        '<div class="quiz-bar" style="height:5px;margin-top:5px;margin-bottom:0"><i style="width:' + (got/total*100) + '%;background:' + m.color + '"></i></div></div>';
    }).join('') + '</div>';
  h += '<div class="card"><div class="d-h"><i class="dot orange"></i>各模块答题表现</div>' +
    MODULES.map(m => {
      const st = state.data.moduleStat[m.id] || {a:0,c:0};
      const r = st.a ? Math.round(st.c/st.a*100) : 0;
      return '<div class="spread" style="padding:7px 0;border-bottom:1px solid var(--line)">' +
        '<span class="small">' + m.name + '</span><span class="small"><b>' + st.a + '</b> 题 · 正确率 <b style="color:' + (r>=80?'#10B981':r>=60?'#D97706':'#EF4444') + '">' + (st.a?r+'%':'—') + '</b></span></div>';
    }).join('') + '</div>';
  const w = weak.find(x => x.rate !== null && x.rate < 80);
  h += '<div class="callout ' + (w?'warn':'tip') + '">' +
    (w ? '<b>学习建议：</b>「' + w.m.name + '」正确率约 ' + w.rate + '%，建议回到知识地图重看该模块要点，再做几道配套练习。'
       : '<b>学习建议：</b>各模块表现稳定，可以试试「提高」难度的题目挑战一下。') + '</div>';
  return h;
}

/* ============================================================
   事件
   ============================================================ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const a = el.getAttribute('data-act');
  const id = el.getAttribute('data-id');
  const m = el.getAttribute('data-m');
  switch(a){
    case 'tab': switchTab(el.getAttribute('data-tab')); break;
    case 'back': back(); break;
    case 'module':
      state.learnModule = m; state.learnTab = 'topics'; state.search = '';
      switchTab('learn'); break;
    case 'quick': {
      const to = el.getAttribute('data-to');
      if(to === 'formula'){ state.learnTab='formulas'; state.learnModule='all'; state.search=''; switchTab('learn'); }
      else if(to === 'quiz') switchTab('quiz');
      else if(to === 'lab') switchTab('lab');
      else if(to === 'wrong'){ go('me','wrong',{}); }
      break;
    }
    case 'dailyOpt': answerDaily(+el.getAttribute('data-i')); break;
    case 'dailyHint': answerDaily(-1); break;

    case 'seg': state.learnTab = el.getAttribute('data-v'); state.search=''; render(); break;
    case 'chip': state.learnModule = m; refreshLearnList(); break;
    case 'searchClear':
      state.search = '';
      document.getElementById('searchInput').value = '';
      refreshLearnList(); break;
    case 'formula': {
      const fc = document.getElementById('fc' + el.getAttribute('data-i'));
      if(fc) fc.classList.toggle('open');
      break;
    }
    case 'topic': go('learn','detail',{id:id}); break;
    case 'topicNav': if(id) { state.params = {id:id}; render(); } break;
    case 'fav': {
      const i = state.data.fav.indexOf(id);
      if(i >= 0){ state.data.fav.splice(i,1); toast('已取消收藏'); }
      else { state.data.fav.push(id); toast('已加入收藏'); }
      saveData(); render(); break;
    }
    case 'toggleDone': {
      const i = state.data.done.indexOf(id);
      if(i >= 0){ state.data.done.splice(i,1); toast('已标记为未学'); }
      else { state.data.done.push(id); toast('已标记为学完'); }
      saveData(); render(); break;
    }
    case 'quizModule': {
      state.quizCfg.m = m; state.quizCfg.lv = 'all'; state.quizCfg.num = 10;
      switchTab('quiz'); toast('已切换到「' + modOf(m).name + '」练习'); break;
    }

    case 'labTab': state.labKey = el.getAttribute('data-k'); render(); break;
    case 'labOpt': {
      const k = el.getAttribute('data-key'), v = el.getAttribute('data-val');
      LAB_STATE[state.labKey][k] = (k === 'f') ? +v : v;
      render(); break;
    }

    case 'cfg': {
      const k = el.getAttribute('data-k'), v = el.getAttribute('data-v');
      state.quizCfg[k] = (k === 'num') ? +v : v;
      render(); break;
    }
    case 'quizStart': quizStart(); break;
    case 'quizWrong': {
      const list = shuffle(state.data.wrong.map(qid => QUESTIONS.find(q=>q.id===qid)).filter(Boolean));
      startQuiz(list); break;
    }
    case 'quizDaily': startQuiz(shuffle(QUESTIONS).slice(0,5)); break;
    case 'favQuiz': {
      const q = QUESTIONS.find(x => x.id === id);
      if(q) startQuiz([q]);
      break;
    }
    case 'quizOpt': {
      if(!state.quiz || state.quiz.checked) return;
      state.quiz.picked = +el.getAttribute('data-i');
      render(); break;
    }
    case 'quizConfirm': quizConfirm(); break;
    case 'quizNext': quizNext(); break;
    case 'quizFav': {
      const qi = state.data.fav.indexOf(id);
      if(qi >= 0){ state.data.fav.splice(qi,1); toast('已取消收藏'); }
      else { state.data.fav.push(id); toast('已收藏（可在「我的」查看）'); }
      saveData(); break;
    }
    case 'quizAgain': state.page='setup'; state.quiz=null; render(); break;

    case 'mePage': {
      const p = el.getAttribute('data-p');
      if(p === 'clear'){
        if(confirm('确定要清空全部学习数据吗？已学记录、收藏、错题和做题统计都会被删除，且无法恢复。')){
          state.data = defaultData();
          saveData();
          toast('学习数据已清空');
          render();
        }
      } else { state.stack.push({tab:state.tab,page:state.page,params:state.params}); state.page = p; render(); }
      break;
    }
    case 'wrongToggle': {
      const wi = document.getElementById('wi' + id);
      if(wi) wi.classList.toggle('open');
      break;
    }
    case 'wrongRemove': {
      const i = state.data.wrong.indexOf(id);
      if(i >= 0){ state.data.wrong.splice(i,1); saveData(); toast('已移出错题本'); render(); }
      break;
    }
  }
});

/* 输入事件：搜索 / 实验滑块 */
document.addEventListener('input', e => {
  const t = e.target;
  if(t.matches && t.matches('input[type=range][data-labkey]')){
    const key = t.getAttribute('data-labkey'), k = t.getAttribute('data-k');
    LAB_STATE[key][k] = Number(t.value);
    const min = +t.min, max = +t.max;
    t.style.setProperty('--p', ((+t.value-min)/(max-min)*100) + '%');
    updateLabView();
    return;
  }
  if(t.id === 'searchInput'){
    state.search = t.value;
    refreshLearnList();
  }
});

/* 返回按钮 & 初始化 */
document.getElementById('backBtn').addEventListener('click', back);
(function init(){
  checkIn();
  const now = new Date();
  document.getElementById('sbTime').textContent = now.getHours() + ':' + pad(now.getMinutes());
  render();
})();

</script>
