<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#12B8A6">
<meta name="description" content="初中化学学习小程序：知识点、元素周期表、化学方程式、必背口诀、刷题与错题本">
<title>初中化学学习小程序</title>
<style>
/* ============================================================
   初中化学学习小程序 - 样式（微信小程序视觉风格 / 移动端优先）
   ============================================================ */

:root{
  --brand:#12B8A6; --brand-d:#0A988A; --brand-soft:#E4F7F4;
  --blue:#4A6CF7; --blue-soft:#EAF0FF;
  --bg:#F3F6F8; --card:#FFFFFF; --text:#1B2530; --sub:#5A6875;
  --muted:#93A0AD; --line:#EBF0F3; --line-2:#E1E8EC;
  --ok:#1FB27A; --ok-soft:#E5F7EF;
  --err:#F06464; --err-soft:#FEECEC;
  --warn:#F2A33C; --warn-soft:#FFF3E2;
  --shadow:0 2px 10px rgba(28,54,72,.05);
  --shadow-lg:0 10px 30px rgba(28,54,72,.12);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
svg{width:16px;height:16px;flex:none}
sub{font-size:.72em;vertical-align:-.22em;line-height:0}
html,body{height:100%;margin:0}
body{
  font-family:var(--font); color:var(--text); background:#DFE7EC;
  background-image:radial-gradient(circle at 20% 10%,#EAF4F2 0,transparent 45%),radial-gradient(circle at 85% 85%,#E7ECFA 0,transparent 48%);
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  font-size:14px; line-height:1.6;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;padding:0}
input{font-family:inherit;outline:none;border:none;background:none;color:inherit}
ul{margin:0;padding:0;list-style:none}

/* ---------- 手机外壳 ---------- */
.phone{
  position:relative; width:390px; height:min(844px,94vh);
  background:var(--bg); border-radius:44px; overflow:hidden;
  box-shadow:0 30px 70px rgba(16,40,58,.28), 0 0 0 11px #1E2833, 0 0 0 13px #35424F;
  display:flex; flex-direction:column;
}
.phone::after{
  content:""; position:absolute; left:50%; top:9px; transform:translateX(-50%);
  width:104px; height:25px; border-radius:14px; background:#1E2833; z-index:60; pointer-events:none;
}
.app{display:flex;flex-direction:column;height:100%;width:100%;position:relative}

/* ---------- 状态栏 / 导航栏 ---------- */
.statusbar{
  height:44px; flex:none; padding:0 26px; display:flex; align-items:center; justify-content:space-between;
  font-size:12px; font-weight:700; letter-spacing:.3px; color:var(--text); background:var(--card); z-index:50;
}
.sb-right{display:flex;align-items:center;gap:5px}
.sb-signal{display:flex;align-items:flex-end;gap:2px;height:10px}
.sb-signal i{width:3px;background:var(--text);border-radius:1px;display:block}
.sb-signal i:nth-child(1){height:4px}.sb-signal i:nth-child(2){height:6px}.sb-signal i:nth-child(3){height:8px}.sb-signal i:nth-child(4){height:10px}
.sb-wifi{width:13px;height:10px;border:2px solid var(--text);border-bottom:none;border-radius:9px 9px 0 0;position:relative}
.sb-wifi::after{content:"";position:absolute;bottom:-3px;left:4px;width:3px;height:3px;background:var(--text);border-radius:50%}
.sb-bat{width:20px;height:10px;border:1.5px solid var(--text);border-radius:3px;position:relative;padding:1px}
.sb-bat::after{content:"";position:absolute;right:-3px;top:2px;width:2px;height:4px;background:var(--text);border-radius:0 1px 1px 0}
.sb-bat i{display:block;height:100%;width:76%;background:var(--text);border-radius:1px}

.navbar{
  height:46px; flex:none; background:var(--card); display:flex; align-items:center; gap:8px;
  padding:0 14px; border-bottom:1px solid var(--line); position:relative; z-index:40;
}
.nav-title{flex:1;min-width:0;font-size:16px;font-weight:700;letter-spacing:.4px;display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden}
.nav-title .dot{width:7px;height:7px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 4px var(--brand-soft);flex:none}
.nav-back{flex:none;display:none;align-items:center;justify-content:center;width:22px;height:28px;color:var(--sub)}
.nav-back.show{display:flex}
.nav-back svg{width:18px;height:18px}
.capsule{
  display:flex;align-items:center;height:30px;border:1px solid var(--line-2);border-radius:16px;
  background:rgba(255,255,255,.9);overflow:hidden;
}
.capsule span{width:36px;display:flex;align-items:center;justify-content:center;height:100%;font-size:15px;color:var(--sub)}
.capsule span+span{border-left:1px solid var(--line-2)}
.capsule .cap-dots{letter-spacing:1px;font-size:12px;line-height:1}
.capsule .cap-target{width:15px;height:15px;border:1.8px solid var(--sub);border-radius:50%;position:relative}
.capsule .cap-target::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--sub)}

/* ---------- 页面容器 ---------- */
.pages{flex:1;position:relative;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:14px 14px 24px;display:none;-webkit-overflow-scrolling:touch}
.page.active{display:block;animation:fade .26s ease}
.page::-webkit-scrollbar{width:0}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* ---------- 通用组件 ---------- */
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 10px}
.sec-head h3{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:7px}
.sec-head h3::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--brand)}
.sec-head .more{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:2px}
.sec-head .more svg{width:12px;height:12px}
.muted{color:var(--muted)}
.sub{color:var(--sub)}

.tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:5px;background:var(--brand-soft);color:var(--brand-d);font-weight:600;line-height:1.5;white-space:nowrap}
.tag.blue{background:var(--blue-soft);color:var(--blue)}
.tag.gray{background:#F0F3F5;color:var(--muted)}
.tag.warn{background:var(--warn-soft);color:#C77A17}
.tag.ok{background:var(--ok-soft);color:#12875C}

.chip{
  flex:none;padding:7px 13px;border-radius:18px;background:#fff;color:var(--sub);font-size:12px;
  border:1px solid var(--line-2);white-space:nowrap;transition:.18s;
}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;box-shadow:0 3px 9px rgba(18,184,166,.3)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}

.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line-2);border-radius:12px;padding:9px 12px;margin-bottom:10px}
.search svg{width:15px;height:15px;color:var(--muted);flex:none}
.search input{flex:1;font-size:13px;min-width:0}
.search input::placeholder{color:var(--muted)}
.search .clear{font-size:15px;color:var(--muted);width:18px;text-align:center}

.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .ico{width:52px;height:52px;margin:0 auto 12px;border-radius:16px;background:#EAF0F2;display:flex;align-items:center;justify-content:center;font-size:22px;color:#B9C6CE}
.empty p{margin:0;font-size:13px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--brand);color:#fff;border-radius:12px;padding:11px 18px;font-size:14px;font-weight:600;box-shadow:0 5px 14px rgba(18,184,166,.28);transition:.15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--brand-soft);color:var(--brand-d);box-shadow:none}
.btn.gray{background:#F0F3F5;color:var(--sub);box-shadow:none}
.btn.block{width:100%}
.btn.sm{padding:8px 14px;font-size:12px;border-radius:10px}

/* ---------- 首页 ---------- */
.hero{
  border-radius:18px;padding:18px 18px 16px;color:#fff;position:relative;overflow:hidden;margin-bottom:12px;
  background:linear-gradient(135deg,#14BFA9 0%,#0FA0A6 48%,#3E7BE0 100%);box-shadow:0 8px 22px rgba(15,150,160,.26);
}
.hero::before{content:"";position:absolute;right:-40px;top:-55px;width:170px;height:170px;border:1px solid rgba(255,255,255,.2);border-radius:50%}
.hero::after{content:"";position:absolute;right:10px;top:-20px;width:110px;height:110px;border:1px solid rgba(255,255,255,.16);border-radius:50%}
.hero h2{margin:0 0 5px;font-size:20px;font-weight:750;letter-spacing:.5px;position:relative}
.hero p{margin:0 0 14px;font-size:12px;opacity:.9;position:relative;max-width:230px;line-height:1.6}
.hero-row{display:flex;align-items:center;gap:16px;position:relative}
.ring{width:64px;height:64px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;font-weight:750;line-height:1.1}
.ring .num small{font-size:8px;opacity:.85;font-weight:500}
.hero-stats{display:flex;gap:18px}
.hero-stat b{display:block;font-size:17px;font-weight:750;line-height:1.2}
.hero-stat span{font-size:10px;opacity:.85}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:4px}
.quick-item{background:#fff;border-radius:14px;padding:12px 4px 10px;text-align:center;box-shadow:var(--shadow);transition:.15s}
.quick-item:active{transform:scale(.95)}
.quick-ico{width:38px;height:38px;border-radius:12px;margin:0 auto 7px;display:flex;align-items:center;justify-content:center}
.quick-ico svg{width:20px;height:20px}
.quick-item span{font-size:11px;color:var(--sub);font-weight:600}

.daily{background:#fff;border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px;position:relative;overflow:hidden}
.daily::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--brand),var(--blue))}
.daily h4{margin:0 0 8px;font-size:13px;display:flex;align-items:center;gap:6px}
.daily .q{font-size:13px;line-height:1.65;margin:0 0 10px}
.daily .row{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted)}

.ch-list{display:flex;flex-direction:column;gap:9px}
.ch-item{display:flex;align-items:center;gap:11px;background:#fff;border-radius:14px;padding:11px 12px;box-shadow:var(--shadow);transition:.15s}
.ch-item:active{transform:scale(.985)}
.ch-badge{width:42px;height:42px;border-radius:13px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:700;line-height:1.1}
.ch-badge b{font-size:14px}.ch-badge small{font-size:8px;opacity:.85;margin-top:2px}
.ch-info{flex:1;min-width:0}
.ch-info h4{margin:0;font-size:13.5px;font-weight:650;display:flex;align-items:center;gap:6px}
.ch-info p{margin:3px 0 0;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-arrow{color:#C8D2D9;flex:none}
.ch-arrow svg{width:15px;height:15px}
.ch-prog{width:34px;text-align:right;flex:none;font-size:10px;color:var(--muted)}

/* hue 配色 */
.hue-teal{--h:#12B8A6;--hs:#E4F7F4}.hue-blue{--h:#4A6CF7;--hs:#EAF0FF}
.hue-violet{--h:#8B6DF0;--hs:#F0EBFF}.hue-cyan{--h:#20A8D8;--hs:#E3F5FC}
.hue-orange{--h:#F08A3C;--hs:#FFF0E3}.hue-slate{--h:#5A7186;--hs:#EAF0F4}
.hue-amber{--h:#E8A71C;--hs:#FFF6DE}.hue-steel{--h:#6A86A8;--hs:#EBF1F8}
.hue-aqua{--h:#17B5A0;--hs:#E2F7F3}.hue-rose{--h:#EC6E8B;--hs:#FDEBF0}
.hue-lime{--h:#79B23C;--hs:#EFF7E5}.hue-pink{--h:#DA6AB5;--hs:#FBE9F5}

/* ---------- 章节详情 / 知识点 ---------- */
.detail-hero{background:linear-gradient(135deg,var(--h),var(--h) 60%,rgba(255,255,255,.3));border-radius:16px;padding:16px;color:#fff;margin-bottom:12px;position:relative;overflow:hidden}
.detail-hero h3{margin:0 0 4px;font-size:18px}
.detail-hero p{margin:0;font-size:11.5px;opacity:.92;line-height:1.6}
.detail-hero .meta{margin-top:10px;display:flex;gap:8px}
.detail-hero .meta span{background:rgba(255,255,255,.22);border-radius:6px;padding:3px 9px;font-size:10.5px}
.kp{background:#fff;border-radius:14px;padding:13px;margin-bottom:10px;box-shadow:var(--shadow)}
.kp-head{display:flex;align-items:flex-start;gap:9px;margin-bottom:8px}
.kp-no{width:22px;height:22px;border-radius:7px;background:var(--hs);color:var(--h);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.kp-head h4{margin:0;font-size:14px;font-weight:700;flex:1;line-height:1.45}
.kp-sum{font-size:12px;color:var(--h);background:var(--hs);border-radius:8px;padding:7px 10px;margin:0 0 9px;font-weight:600}
.kp ul li{position:relative;padding-left:14px;font-size:12.5px;line-height:1.75;color:var(--sub);margin-bottom:5px}
.kp ul li::before{content:"";position:absolute;left:2px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--h);opacity:.6}
.tip{margin-top:9px;background:var(--warn-soft);border-radius:9px;padding:9px 11px;font-size:11.5px;color:#9A6518;line-height:1.65;display:flex;gap:7px}
.tip b{color:#C77A17;flex:none}
.kp-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
.kp-foot button{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px}
.kp-foot button svg{width:13px;height:13px}
.kp-foot button.on{color:var(--brand)}
.kp.learned{border-left:3px solid var(--ok)}

/* ---------- 元素周期表 ---------- */
.ptable{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(4,1fr);gap:5px;margin:4px 0 10px}
.el{aspect-ratio:1/1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;position:relative;transition:.15s;min-width:0;padding:0;overflow:hidden}
.el:active{transform:scale(.9)}
.el .z{position:absolute;top:2px;left:4px;font-size:7px;opacity:.8;line-height:1.1}
.el .s{font-size:15px;font-weight:750;line-height:1.1}
.el .n{font-size:8.5px;opacity:.92;line-height:1.1;margin-top:2px;white-space:nowrap}
.el.nonmetal{background:#48B4D8}.el.metal{background:#F0A24A}.el.noble{background:#9B7BE8}.el.metalloid{background:#63B98A}
.el.dim{opacity:.32}
.el.sel{outline:2px solid var(--text);outline-offset:1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.extra-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.extra-grid .el{min-height:42px;aspect-ratio:auto;border-radius:8px}
.extra-grid .el .s{font-size:12px}.extra-grid .el .n{font-size:8px}

.el-detail .big{display:flex;align-items:center;gap:14px;background:var(--hs);border-radius:14px;padding:14px;margin-bottom:12px}
.el-detail .big .box{width:66px;height:66px;border-radius:13px;background:var(--h);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.el-detail .big .box b{font-size:26px;line-height:1}.el-detail .big .box span{font-size:11px;opacity:.9}
.el-detail .big h3{margin:0 0 3px;font-size:19px}
.el-detail .big p{margin:0;font-size:11.5px;color:var(--sub)}
.info-row{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px solid var(--line);font-size:12.5px}
.info-row span{color:var(--muted)}.info-row b{font-weight:600}

/* ---------- 化学方程式 ---------- */
.eq{background:#fff;border-radius:14px;padding:12px 13px;margin-bottom:9px;box-shadow:var(--shadow)}
.eq-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.eq-top h4{margin:0;font-size:13px;font-weight:700}
.formula{font-size:15px;font-weight:600;letter-spacing:.2px;line-height:1.9;color:#1D3550;word-break:break-word;font-family:"Cambria Math","Times New Roman",var(--font);padding:7px 9px;background:#F6F9FB;border-radius:9px;margin-bottom:7px;text-align:center}
.formula sub{font-size:.65em;vertical-align:-.25em}
.ar{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;vertical-align:middle;margin:0 3px;min-width:32px;position:relative;top:-2px}
.ar em{font-size:8.5px;font-style:normal;color:var(--brand-d);font-weight:600;line-height:1.1;white-space:nowrap;font-family:var(--font)}
.ar i{font-style:normal;font-size:17px;line-height:1;color:var(--brand)}
.eq-line{font-size:11.5px;color:var(--sub);display:flex;gap:6px;margin-top:4px;line-height:1.6}
.eq-line b{color:var(--muted);flex:none;font-weight:600}
.eq .fav{color:#CDD6DC}.eq .fav svg{width:14px;height:14px}.eq .fav.on{color:var(--warn)}

/* ---------- 口诀速查 ---------- */
.cheat{background:#fff;border-radius:14px;padding:13px;margin-bottom:10px;box-shadow:var(--shadow);border-left:3px solid var(--h)}
.cheat h4{margin:0 0 9px;font-size:14px;display:flex;align-items:center;gap:8px}
.cheat .line{font-size:12.5px;line-height:1.85;color:var(--sub);padding-left:12px;position:relative}
.cheat .line::before{content:"";position:absolute;left:2px;top:10px;width:4px;height:4px;border-radius:50%;background:var(--h);opacity:.65}
.cheat .note{margin-top:9px;font-size:11px;color:var(--h);background:var(--hs);padding:7px 9px;border-radius:8px;line-height:1.6}

/* ---------- 练习 ---------- */
.quiz-tabs{display:flex;gap:8px;margin-bottom:12px}
.quiz-tabs button{flex:1;padding:9px;border-radius:11px;background:#fff;font-size:12.5px;color:var(--sub);border:1px solid var(--line-2);font-weight:600}
.quiz-tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 4px 12px rgba(18,184,166,.25)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.stat-box{background:#fff;border-radius:13px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.stat-box b{display:block;font-size:20px;font-weight:750;color:var(--brand);line-height:1.2}
.stat-box span{font-size:10.5px;color:var(--muted)}

.qcard{background:#fff;border-radius:16px;padding:15px;box-shadow:var(--shadow)}
.qmeta{display:flex;align-items:center;gap:6px;margin-bottom:10px;font-size:10.5px;color:var(--muted)}
.qtext{font-size:14.5px;font-weight:600;line-height:1.7;margin:0 0 14px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:9px;border:1.5px solid var(--line-2);border-radius:11px;padding:10px 11px;font-size:13px;line-height:1.55;transition:.16s;background:#fff;text-align:left;width:100%}
.opt .lab{width:21px;height:21px;border-radius:6px;background:#F2F5F7;color:var(--sub);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.opt:active{transform:scale(.99)}
.opt.correct{background:var(--ok-soft);border-color:var(--ok)}
.opt.correct .lab{background:var(--ok);color:#fff}
.opt.wrong{background:var(--err-soft);border-color:var(--err)}
.opt.wrong .lab{background:var(--err);color:#fff}
.opt.disabled{opacity:.72}
.explain{margin-top:12px;border-radius:11px;padding:12px;background:#F5F9FB;font-size:12.5px;line-height:1.75;animation:fade .25s}
.explain .head{font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.explain .head.ok{color:var(--ok)}.explain .head.no{color:var(--err)}
.qactions{display:flex;gap:8px;margin-top:13px}
.qactions .btn{flex:1}
.progress-line{height:4px;border-radius:3px;background:#E7EDF0;overflow:hidden;margin-bottom:12px}
.progress-line i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--blue));border-radius:3px;transition:width .3s}

.wrong-item{background:#fff;border-radius:13px;padding:12px;margin-bottom:9px;box-shadow:var(--shadow)}
.wrong-item .t{font-size:12.5px;font-weight:600;line-height:1.6;margin:0 0 7px}
.wrong-item .a{font-size:11.5px;color:var(--ok);margin-bottom:3px}
.wrong-item .e{font-size:11.5px;color:var(--sub);line-height:1.6}
.wrong-item .foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted)}

/* ---------- 我的 ---------- */
.profile{background:linear-gradient(135deg,#14BFA9,#3E7BE0);border-radius:18px;padding:18px;color:#fff;display:flex;align-items:center;gap:13px;margin-bottom:12px}
.avatar{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:700;flex:none}
.profile h3{margin:0 0 3px;font-size:16px}.profile p{margin:0;font-size:11px;opacity:.88}
.menu{background:#fff;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px}
.menu-item{display:flex;align-items:center;gap:11px;padding:13px 14px;border-bottom:1px solid var(--line);font-size:13px;width:100%;text-align:left}
.menu-item:last-child{border-bottom:none}
.menu-item .mi{width:28px;height:28px;border-radius:9px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;flex:none}
.menu-item .mi svg{width:15px;height:15px;color:var(--brand)}
.menu-item .v{margin-left:auto;color:var(--muted);font-size:11.5px}
.menu-item .arrow{color:#CCD5DB}.menu-item .arrow svg{width:14px;height:14px}
.bar-row{margin-bottom:11px}
.bar-row .l{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:5px}
.bar-row .l b{font-weight:600}
.bar-track{height:7px;border-radius:4px;background:#EDF2F4;overflow:hidden}
.bar-track i{display:block;height:100%;border-radius:4px;background:var(--h,var(--brand));transition:width .5s}

/* ---------- 底部 TabBar ---------- */
.tabbar{
  height:62px;flex:none;background:rgba(255,255,255,.97);border-top:1px solid var(--line);
  display:flex;align-items:flex-start;padding-top:6px;z-index:45;backdrop-filter:blur(10px);
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:#9AA7B2;font-size:10px;transition:.18s}
.tab svg{width:22px;height:22px;stroke-width:1.8}
.tab.on{color:var(--brand);font-weight:700}
.tab.on svg{stroke-width:2.2}
.tab .ic{position:relative}
.tab .badge-dot{position:absolute;top:-3px;right:-7px;min-width:14px;height:14px;border-radius:8px;background:var(--err);color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;padding:0 3px;font-weight:700}
.home-ind{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:120px;height:4px;border-radius:3px;background:#1B2530;opacity:.85;z-index:55}

/* ---------- 弹层 ---------- */
.mask{position:absolute;inset:0;background:rgba(18,32,42,.42);z-index:80;opacity:0;pointer-events:none;transition:opacity .22s}
.mask.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:#fff;border-radius:20px 20px 0 0;z-index:85;transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.8,.25,1);display:flex;flex-direction:column;overflow:hidden}
.sheet.show{transform:none}
.sheet-head{flex:none;padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.sheet-head h3{margin:0;font-size:15px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-head .close{width:26px;height:26px;border-radius:50%;background:#F1F4F6;color:var(--muted);font-size:16px;display:flex;align-items:center;justify-content:center;margin-left:10px;flex:none}
.sheet-body{overflow-y:auto;padding:14px 16px 26px;-webkit-overflow-scrolling:touch}
.sheet-body::-webkit-scrollbar{width:0}
.grabber{width:34px;height:4px;border-radius:3px;background:#DDE4E8;margin:7px auto 0}

.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);background:rgba(24,38,48,.88);color:#fff;padding:11px 18px;border-radius:11px;font-size:12.5px;z-index:95;opacity:0;pointer-events:none;transition:.22s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* ---------- 响应式：真机全屏 ---------- */
@media (max-width:480px){
  body{background:var(--bg);display:block;overflow:hidden}
  .phone{width:100%;height:100%;border-radius:0;box-shadow:none}
  .phone::after{display:none}
  .home-ind{display:none}
  .statusbar{height:env(safe-area-inset-top,20px);min-height:20px;padding-top:0}
  .page{padding-bottom:20px}
}
@media (min-width:481px) and (max-height:700px){
  .phone{height:96vh}
}

<script>
/* ============================================================
   初中化学学习小程序 - 知识库数据
   依据人教版《化学》九年级上册 / 下册整理
   ============================================================ */

window.CHEM_CHAPTERS = [
{
  id:'c1', no:'01', t:'走进化学世界', v:'九年级上册', badge:'入门', hue:'teal',
  intro:'建立"物质变化"与"实验操作"两大基础观念，是整个初中化学的起点。',
  points:[
    {t:'物理变化与化学变化', s:'是否有新物质生成，是唯一判断依据',
     d:['物理变化：只改变形状、状态、大小，没有新物质生成。如冰雪融化、酒精挥发、玻璃破碎、矿石粉碎。',
        '化学变化：有新物质生成。常伴随发光放热、颜色改变、放出气体、生成沉淀等现象。',
        '伴随现象只能辅助判断，不能作为依据：灯泡通电发光放热是物理变化；气球爆炸、轮胎爆胎多属物理变化。'],
     tip:'只看"有没有新物质"，不看"有没有发光发热"。'},
    {t:'物理性质与化学性质', s:'是否需要通过化学变化才能表现出来',
     d:['物理性质：颜色、状态、气味、密度、熔点、沸点、硬度、溶解性、导电导热性、挥发性、延展性。',
        '化学性质：可燃性、助燃性、氧化性、还原性、稳定性、酸碱性、毒性、腐蚀性。',
        '语言标志：带"能 / 会 / 可以 / 易 / 难"多描述性质；带"了 / 在 / 正在"多描述变化。'],
     tip:'"铁能生锈"是化学性质，"铁生锈了"是化学变化。'},
    {t:'化学实验基本操作', s:'取用、加热、连接、洗涤的规范',
     d:['药品取用"三不"：不手摸、不凑近直接闻（用手在瓶口轻轻扇闻）、不品尝。',
        '固体取用：块状用镊子，"一横二放三慢竖"；粉末用药匙或纸槽，"一斜二送三直立"。',
        '液体倾倒：瓶塞倒放、标签向手心、瓶口紧挨试管口；量筒读数时视线与凹液面最低处保持水平。',
        '给液体加热：液体不超过试管容积的 1/3，管口不对着自己或他人，先均匀预热再集中加热。',
        '酒精灯：用外焰加热；禁止用嘴吹灭（用灯帽盖灭，提起再盖一次）；禁止向燃着的酒精灯内添加酒精。'],
     tip:'量筒仰视读数偏小、俯视读数偏大；若按读数量取液体，实际体积结论正好相反。'},
    {t:'过滤与蒸发', s:'"一贴二低三靠"是必考操作',
     d:['一贴：滤纸紧贴漏斗内壁，中间不留气泡（否则过滤变慢）。',
        '二低：滤纸边缘低于漏斗口；漏斗内液面低于滤纸边缘。',
        '三靠：烧杯口紧靠玻璃棒；玻璃棒下端轻靠三层滤纸一侧；漏斗下端管口紧靠烧杯内壁。',
        '玻璃棒作用：过滤时引流；蒸发时搅拌，防止局部温度过高造成液滴飞溅。',
        '蒸发皿中出现较多固体时停止加热，利用余热蒸干，不能直接把水蒸干。'],
     tip:'过滤后滤液仍浑浊：滤纸破损、液面高于滤纸边缘、承接的烧杯不干净。'},
    {t:'科学探究：蜡烛与呼吸气体', s:'观察 → 猜想 → 实验 → 结论',
     d:['蜡烛火焰分外焰、内焰、焰心三层，外焰温度最高（火柴梗平放 1 秒后两端先变黑）。',
        '干冷烧杯罩在火焰上方，内壁出现水雾 → 生成水；倒转后倒入澄清石灰水变浑浊 → 生成二氧化碳。',
        '呼出气体与空气相比：氧气含量减少，二氧化碳和水蒸气含量增多。',
        '检验方法：燃着的木条比氧气多少；澄清石灰水比二氧化碳多少；干冷玻璃片比水蒸气多少。'],
     tip:'熄灭蜡烛时的"白烟"是石蜡蒸气凝成的固体小颗粒，用火柴可以点燃并引燃烛芯。'}
  ]
},
{
  id:'c2', no:'02', t:'我们周围的空气', v:'九年级上册', badge:'空气', hue:'blue',
  intro:'从空气成分到氧气制取，第一次系统接触"气体制备"的完整思路。',
  points:[
    {t:'空气的成分', s:'氮气 78%、氧气 21%（体积分数）',
     d:['氮气 78%、氧气 21%、稀有气体 0.94%、二氧化碳 0.03%~0.04%、其他气体和杂质 0.03%。',
        '注意是体积分数，不是质量分数。',
        '空气是混合物；氮气化学性质不活泼，常用作保护气、食品防腐；稀有气体通电发光可制霓虹灯。'],
     tip:'"含量最多"问的是体积分数；不要写成质量分数。'},
    {t:'空气中氧气含量的测定', s:'红磷燃烧，约消耗 1/5 体积',
     d:['原理：4P + 5O2 → 2P2O5，红磷燃烧消耗氧气且生成固体，使瓶内压强减小，水被压入集气瓶。',
        '现象：产生大量白烟，放出热量；冷却后打开止水夹，水进入约 1/5 体积。',
        '结论：氧气约占空气体积的 1/5；剩余气体主要是氮气，不支持燃烧、难溶于水。',
        '不能用木炭、硫粉代替红磷（生成气体，压强变化不明显）；不能用镁条（还能与氮气、二氧化碳反应）。'],
     tip:'结果偏小的常见原因：红磷不足、装置漏气、未冷却到室温就打开止水夹。'},
    {t:'氧气的性质', s:'助燃性、氧化性，本身不可燃',
     d:['物理性质：无色无味气体，密度比空气略大，不易溶于水；液态、固态氧呈淡蓝色。',
        '木炭在氧气中燃烧发白光，生成能使石灰水变浑浊的气体；硫燃烧发出明亮蓝紫色火焰，生成有刺激性气味的 SO2。',
        '铁丝在氧气中剧烈燃烧、火星四射、生成黑色固体 Fe3O4；瓶底要预先放少量水或细沙，防止熔融物炸裂瓶底。',
        '红磷燃烧产生大量白烟（不是白雾）。'],
     tip:'"烟"是固体小颗粒，"雾"是小液滴；氧气只助燃，不能作燃料。'},
    {t:'实验室制取氧气', s:'三套原理 + 查装定点收离熄',
     d:['2KMnO4 → K2MnO4 + MnO2 + O2↑（加热，试管口塞一团棉花防粉末进入导管）。',
        '2H2O2 → 2H2O + O2↑（MnO2 催化，不加热，最常用、最环保）。',
        '2KClO3 → 2KCl + 3O2↑（MnO2 催化并加热）。',
        '操作步骤口诀：查（气密性）装（药品）定（固定）点（点灯）收（收集）离（移导管）熄（灭灯）。',
        '收集：排水法（较纯净）或向上排空气法（较干燥）；验满用带火星木条放在瓶口，检验用带火星木条伸入瓶内。'],
     tip:'先移导管再熄灯，防止水倒吸使试管炸裂。'},
    {t:'催化剂与基本反应类型', s:'"一变两不变"',
     d:['催化剂：改变其他物质的化学反应速率，而本身的质量和化学性质在反应前后都不变。',
        '化合反应：多变一（A+B→AB）；分解反应：一变多（AB→A+B）。',
        '氧化反应：物质与氧发生的反应；剧烈氧化（燃烧、爆炸）与缓慢氧化（铁生锈、呼吸、食物腐败）都放热。',
        'MnO2 只对特定反应起催化作用，不能说"MnO2 是所有反应的催化剂"。'],
     tip:'催化剂只改变化学反应速率，不改变生成物的质量。'}
  ]
},
{
  id:'c3', no:'03', t:'物质构成的奥秘', v:'九年级上册', badge:'微观', hue:'violet',
  intro:'从分子、原子、离子进入微观世界，建立"结构决定性质"的核心思维。',
  points:[
    {t:'分子与原子', s:'分子是保持物质化学性质的最小粒子',
     d:['分子的性质：质量和体积都很小、不断运动（温度越高运动越快）、粒子间有间隔、同种分子性质相同。',
        '由分子构成的物质，分子是保持其化学性质的最小粒子；由原子直接构成的物质（金属、稀有气体、金刚石等），原子保持其化学性质。',
        '化学变化的实质：分子分成原子，原子重新组合成新分子；原子是化学变化中的最小粒子。',
        '用分子观点解释：热胀冷缩是间隔改变，不是粒子大小改变；闻到气味、湿衣服晾干是分子不断运动。'],
     tip:'"最小"必须加前提：化学变化中原子最小，保持化学性质时分子最小。'},
    {t:'原子的构成', s:'核电荷数 = 质子数 = 核外电子数 = 原子序数',
     d:['原子由带正电的原子核（质子 + 中子）和带负电的核外电子构成；原子核体积很小但集中了几乎全部质量。',
        '质子数决定元素种类；最外层电子数决定元素的化学性质；质子数与中子数之和近似等于相对原子质量。',
        '原子不显电性：核内质子所带正电荷数 = 核外电子所带负电荷数。',
        '相对原子质量是以碳-12 原子质量的 1/12 为标准的比值，没有单位（单位为 1）。'],
     tip:'普通氢原子核内没有中子；相对原子质量 ≈ 质子数 + 中子数。'},
    {t:'核外电子排布与离子', s:'最外层 8 电子（第一层 2 个）为稳定结构',
     d:['排布规律：第一层最多 2 个，第二层最多 8 个，最外层最多 8 个；先排满内层再排外层。',
        '金属原子最外层一般少于 4 个，易失电子形成阳离子；非金属原子最外层一般多于 4 个，易得电子形成阴离子。',
        '离子符号：数字在前、正负号在后，写在元素符号右上角，如 Mg2+、Cl−、SO4 2−；1 省略不写。',
        '原子 → 阳离子：质子数 > 电子数；原子 → 阴离子：质子数 < 电子数。'],
     tip:'元素符号周围四种数字：前面是粒子个数，正上方是化合价，右上角是离子电荷，右下角是原子个数。'},
    {t:'元素与元素符号', s:'元素是质子数相同的一类原子的总称',
     d:['元素只讲种类、不讲个数；物质由元素组成，分子由原子构成。',
        '元素符号含义：表示一种元素、表示该元素的一个原子；由原子直接构成的物质还表示这种物质（如 Fe、C、He）。',
        '元素周期表：7 个周期（周期数 = 电子层数）、16 个族；同一周期从左到右最外层电子数依次递增。',
        '地壳中含量前四：氧、硅、铝、铁；空气中最多是氮；人体中最多是氧。'],
     tip:'"2H"只表示 2 个氢原子，不能说成"2 个氢元素"。'},
    {t:'化合价与化学式', s:'化合物中正负化合价代数和为零',
     d:['单质中元素化合价为 0；在化合物中氧通常 −2、氢通常 +1；金属一般显正价，非金属与金属结合时显负价。',
        '书写化学式：正价在前、负价在后（NH3、CH4 例外），用最小公倍数法使正负化合价代数和为 0。',
        '化学式含义：物质、元素组成、一个分子、一个分子的原子构成（宏观 / 微观各两条）。',
        '相对分子质量 = 各原子相对原子质量 × 原子个数之和；元素质量比 = 相对原子质量 × 个数之比。'],
     tip:'原子团（OH、NO3、CO3、SO4、NH4）在反应中常作为一个整体，写个数时要加括号。'},
    {t:'根据化学式的计算', s:'质量分数、元素质量、物质质量的换算',
     d:['某元素质量分数 =（该元素相对原子质量 × 原子个数）÷ 相对分子质量 × 100%。',
        '某元素质量 = 物质质量 × 该元素的质量分数。',
        '物质质量 = 某元素质量 ÷ 该元素的质量分数。',
        '例：NH4NO3 中氮元素质量分数 = (14×2) ÷ 80 × 100% = 35%。'],
     tip:'计算前先检查化学式是否配平、原子个数是否数对（括号要乘开）。'}
  ]
},

{ch:'燃料及其利用', lv:'基础', q:'天然气的主要成分是（　）', o:['一氧化碳','氢气','甲烷','乙醇'], a:2, ex:'天然气、沼气、瓦斯的主要成分都是甲烷 CH4，它是最简单的有机物，燃烧 CH4 + 2O2 → CO2 + 2H2O。'},
{ch:'燃料及其利用', lv:'基础', q:'被认为是最清洁的燃料，其燃烧产物只有水的是（　）', o:['煤','汽油','氢气','天然气'], a:2, ex:'氢气燃烧产物只有水，无污染、热值高；目前未广泛使用主要受制取成本高、储存运输困难限制。'},
{ch:'燃料及其利用', lv:'基础', q:'形成酸雨的主要气体是（　）', o:['CO2 和 CO','SO2 和 NO2','CH4 和 H2','O2 和 N2'], a:1, ex:'煤燃烧产生的 SO2 和汽车尾气中的 NO2 溶于雨水形成酸雨（pH < 5.6）。CO2 引起温室效应，但不属于酸雨成因，也不是计入空气污染指数的污染物。'},
{ch:'金属和金属材料', lv:'基础', q:'下列金属中，能与稀硫酸反应放出氢气的是（　）', o:['Cu','Ag','Zn','Au'], a:2, ex:'金属活动性顺序中排在氢前面的金属能置换出稀硫酸、盐酸中的氢。Zn 排在氢前；Cu、Ag、Au 排在氢后，不反应。'},
{ch:'金属和金属材料', lv:'基础', q:'下列反应属于置换反应的是（　）', o:['2H2O2→2H2O+O2↑','Fe+CuSO4→FeSO4+Cu','CaO+H2O→Ca(OH)2','HCl+NaOH→NaCl+H2O'], a:1, ex:'置换反应是"单质 + 化合物 → 新单质 + 新化合物"。Fe + CuSO4 → FeSO4 + Cu 符合；A 是分解、C 是化合、D 是复分解（中和）。'},
{ch:'金属和金属材料', lv:'基础', q:'铁生锈的必要条件是（　）', o:['只与水接触','只与氧气接触','同时与氧气和水接触','在干燥空气中'], a:2, ex:'控制变量实验表明：铁在干燥空气中和在无氧的水中都不易生锈，只有同时与氧气和水接触才生锈；酸、碱、盐会加速锈蚀。'},
{ch:'金属和金属材料', lv:'提升', q:'关于合金，下列说法正确的是（　）', o:['合金是纯净物','合金的硬度一般比组成它的纯金属大','合金的熔点一定比纯金属高','生铁和钢的主要区别是颜色不同'], a:1, ex:'合金是混合物；硬度一般更大、熔点一般更低、抗腐蚀性更好；生铁与钢的区别主要是含碳量（2%~4.3% 与 0.03%~2%）。'},
{ch:'金属和金属材料', lv:'提升', q:'工业炼铁反应 3CO + Fe2O3 → 2Fe + 3CO2 中，还原剂是（　）', o:['Fe2O3','CO','Fe','CO2'], a:1, ex:'CO 夺取 Fe2O3 中的氧，使铁被还原，自身被氧化为 CO2，故 CO 是还原剂、Fe2O3 是氧化剂。注意该反应不属于置换反应（反应物中没有单质）。'},
{ch:'溶液', lv:'基础', q:'下列物质溶于水时，溶液温度明显降低的是（　）', o:['氢氧化钠固体','浓硫酸','硝酸铵','氯化钠'], a:2, ex:'NH4NO3 溶解时扩散吸热占优势，溶液温度明显降低；NaOH 固体和浓硫酸溶解放热（生石灰是与水反应放热）；NaCl 温度基本不变。'},
{ch:'溶液', lv:'基础', q:'关于溶液，下列说法正确的是（　）', o:['溶液一定无色','溶液一定是均一、稳定的混合物','溶液中溶质一定是固体','溶液上层比下层浓度大'], a:1, ex:'溶液的本质特征是均一性和稳定性，且一定是混合物。CuSO4 溶液呈蓝色、FeCl2 浅绿；溶质可以是气体（盐酸中的 HCl）或液体（酒精溶液）；均一性决定各部分组成相同。'},
{ch:'溶液', lv:'提升', q:'20℃ 时 NaCl 的溶解度为 36 g，其含义是（　）', o:['100 g 溶液中含 NaCl 36 g','100 g 水中最多溶解 NaCl 36 g','36 g 水中最多溶解 NaCl 100 g','100 g 水中溶解 36 g NaCl 即不饱和'], a:1, ex:'溶解度四要素：一定温度、100 g 溶剂（不是溶液）、达到饱和状态、单位是 g。此时饱和溶液质量为 136 g。'},
{ch:'溶液', lv:'基础', q:'配制 50 g 溶质质量分数为 6% 的 NaCl 溶液，需要 NaCl 的质量为（　）', o:['3 g','6 g','47 g','50 g'], a:0, ex:'溶质质量 = 溶液质量 × 溶质质量分数 = 50 g × 6% = 3 g；需水 50 − 3 = 47 g（约 47 mL）。'},
{ch:'溶液', lv:'提升', q:'配制一定质量分数的溶液时，量取水仰视读数，会导致结果（　）', o:['质量分数偏大','质量分数偏小','无影响','无法确定'], a:1, ex:'仰视读数时实际量取的水偏多，溶剂增多而溶质不变，故溶质质量分数偏小。若砝码与药品放反且用了游码，称得的溶质偏少，同样使结果偏小。'},
{ch:'酸和碱', lv:'基础', q:'能使紫色石蕊试液变红的是（　）', o:['稀盐酸','氢氧化钠溶液','食盐水','石灰水'], a:0, ex:'紫色石蕊遇酸性溶液变红；稀盐酸呈酸性。NaOH 溶液、石灰水呈碱性使石蕊变蓝；食盐水呈中性，石蕊仍为紫色。'},
{ch:'酸和碱', lv:'基础', q:'稀释浓硫酸的正确操作是（　）', o:['把水缓慢倒入浓硫酸中','把浓硫酸沿器壁缓慢注入水中并不断搅拌','把两者同时快速倒入烧杯','把浓硫酸倒入量筒中稀释'], a:1, ex:'浓硫酸密度比水大且溶解放出大量热，若把水倒入浓硫酸，水会浮在上面沸腾并使酸液飞溅。必须"酸入水、沿器壁、慢慢倒、不断搅"，且不能在量筒中配制。'},
{ch:'酸和碱', lv:'提升', q:'用 pH 试纸测某酸性溶液的 pH 时，若先用水润湿试纸，测得结果将（　）', o:['偏小','偏大','不变','无法测定'], a:1, ex:'润湿相当于稀释待测液，酸性减弱，pH 偏大（更接近 7）；若测碱性溶液则 pH 偏小；测中性溶液无影响。正确做法是把待测液滴在干燥试纸上。'},
{ch:'酸和碱', lv:'基础', q:'中和反应属于哪种基本反应类型（　）', o:['化合反应','分解反应','置换反应','复分解反应'], a:3, ex:'中和反应是酸与碱交换成分生成盐和水，符合 AB + CD → AD + CB，属于复分解反应。注意：生成盐和水的反应不一定是中和反应。'},
{ch:'酸和碱', lv:'基础', q:'复分解反应能够发生的条件是生成物中有（　）', o:['沉淀、气体或水','单质','氧化物','金属'], a:0, ex:'两种化合物交换成分后，必须生成沉淀、气体或水（难电离物质）之一，反应才能发生。这是判断离子能否共存和除杂方案是否可行的核心依据。'},
{ch:'盐 化肥', lv:'基础', q:'下列物质中，属于盐但俗称中带"碱"字的是（　）', o:['NaOH','Na2CO3','Ca(OH)2','NH3·H2O'], a:1, ex:'Na2CO3 俗称纯碱、苏打，由金属离子和酸根离子构成，属于盐；其水溶液呈碱性，所以名字里带"碱"但不是碱。'},
{ch:'盐 化肥', lv:'提升', q:'鉴别 Na2CO3 溶液与 NaCl 溶液，下列试剂中不能达到目的的是（　）', o:['稀盐酸','澄清石灰水','氯化钠溶液','氯化钙溶液'], a:2, ex:'稀盐酸与 Na2CO3 反应产生气泡；石灰水、氯化钙溶液与 Na2CO3 反应生成白色沉淀；三种试剂与 NaCl 均无明显现象，都能鉴别。氯化钠溶液与两者都不反应，无任何现象，无法鉴别。'},
{ch:'盐 化肥', lv:'基础', q:'下列物质可用作氮肥的是（　）', o:['KCl','Ca3(PO4)2','CO(NH2)2','K2SO4'], a:2, ex:'尿素 CO(NH2)2 含氮元素，属于氮肥。KCl、K2SO4 是钾肥，Ca3(PO4)2 是磷肥；含 N、P、K 中两种以上的叫复合肥，如 KNO3。'},
{ch:'盐 化肥', lv:'提升', q:'铵态氮肥不能与草木灰（主要成分 K2CO3，呈碱性）混合施用，原因是（　）', o:['会产生沉淀堵塞土壤','反应放出氨气，降低肥效','会放出有毒气体','会发生燃烧'], a:1, ex:'NH4⁺ 与碱性物质反应生成 NH3 逸出，氮元素损失，肥效降低。鉴别铵态氮肥的方法就是加熟石灰研磨，闻到刺激性气味。'},
{ch:'盐 化肥', lv:'提升', q:'检验某溶液中含有 SO4²⁻，应选用的试剂组合是（　）', o:['Ba(NO3)2 溶液和稀硝酸','AgNO3 溶液和稀盐酸','无色酚酞试液','NaOH 溶液'], a:0, ex:'加 Ba(NO3)2 生成白色沉淀，再加稀硝酸沉淀不溶解，可确认是 BaSO4。用硝酸钡而非氯化钡是为了避免引入 Cl⁻ 与溶液中可能存在的 Ag⁺ 生成 AgCl 造成干扰；加稀硝酸用于排除 CO3²⁻ 的干扰。'},
{ch:'化学与生活', lv:'基础', q:'下列物质属于有机合成材料的是（　）', o:['棉花','羊毛','塑料','蚕丝'], a:2, ex:'三大有机合成材料是塑料、合成纤维、合成橡胶。棉花、麻是天然纤维（纤维素），羊毛、蚕丝是天然蛋白质纤维。'},
{ch:'化学与生活', lv:'基础', q:'人体缺乏下列哪种元素会引起贫血（　）', o:['钙','铁','碘','氟'], a:1, ex:'铁是血红蛋白的组成成分，缺铁引起缺铁性贫血；缺钙致佝偻病/骨质疏松；缺碘致甲状腺肿大；缺氟易患龋齿。'},
{ch:'化学与生活', lv:'基础', q:'鉴别羊毛线与涤纶线，最简便的方法是（　）', o:['观察颜色','灼烧闻气味','比较弹性','放入水中看是否溶解'], a:1, ex:'羊毛是蛋白质纤维，灼烧有烧焦羽毛气味、灰烬易碎；合成纤维（涤纶）灼烧有特殊刺激性气味、灰烬结成硬球。'},
{ch:'化学与生活', lv:'提升', q:'下列做法不会危害人体健康的是（　）', o:['用甲醛溶液浸泡海鲜保鲜','食用霉变后洗净煮熟的花生','用碳酸氢钠作发酵粉蒸馒头','用工业酒精勾兑白酒'], a:2, ex:'NaHCO3（小苏打）受热分解产生 CO2，是常用食品膨松剂，安全。甲醛使蛋白质变性、黄曲霉毒素耐高温、工业酒精含甲醇（致盲甚至致死），均有害。'},
{ch:'综合提升', lv:'提升', q:'某物质在氧气中完全燃烧，生成 CO2 和 H2O，关于该物质组成的判断正确的是（　）', o:['一定含有 C、H、O 三种元素','一定含 C、H，可能含 O','一定只含 C、H','一定含 O'], a:1, ex:'根据质量守恒定律，生成物中的 C、H 必来自该物质，故一定含 C、H；氧元素可能全部来自氧气，也可能部分来自该物质，因此 O 是"可能含有"。'},
{ch:'综合提升', lv:'提升', q:'下列除去杂质的方法正确的是（　）', o:['用点燃法除去 CO2 中的少量 CO','用 NaOH 溶液除去 CO2 中的少量 HCl','用稀盐酸除去 NaCl 中的 Na2CO3','用过滤除去水中的可溶性钙镁化合物'], a:2, ex:'Na2CO3 + 2HCl → 2NaCl + H2O + CO2↑，杂质转化为主要物质且不引入新杂质（适量盐酸），符合"不增、不减、易分离"。A 中 CO 无法在 CO2 中点燃；B 中 NaOH 也会吸收 CO2；D 中过滤不能除去可溶性离子。'}
];

/* ---------------- 化学方程式渲染 ---------------- */
/* 正文里的化学式自动下标：CO2 → CO<sub>2</sub>，系数与独立数字不受影响 */
function rich(s){ return esc(s).replace(/([A-Za-z\)\]])(\d{1,3})/g,'$1<sub>$2</sub>'); }
function fmtNum(s){ return esc(s).replace(/([A-Za-z\)])(\d+)/g,'$1<sub>$2</sub>'); }
function fmt(e,cond){
  var s = esc(e).replace(/→/g,'\u0001');
  s = s.replace(/([A-Za-z\)\]])(\d+)/g,'$1<sub>$2</sub>');
  var ar = '<span class="ar">'+(cond?'<em>'+fmtNum(cond)+'</em>':'')+'<i>⟶</i></span>';
  return s.split('\u0001').join(ar);
}

var MODES=['全部题目','上册','下册','错题重练'].concat(C.map(function(c){return c.t;}));
function buildOrder(mode){
  var idx=QUIZ.map(function(_,i){return i;});
  if(mode==='全部题目') return idx;
  if(mode==='错题重练') return S.wrong.slice();
  var up=['走进化学世界','我们周围的空气','物质构成的奥秘','自然界的水','化学方程式','碳和碳的氧化物','燃料及其利用'];
  return idx.filter(function(i){
    var n=QUIZ[i].ch;
    if(mode==='上册') return up.indexOf(n)>=0;
    if(mode==='下册') return up.indexOf(n)<0 && n!=='综合提升';
    return n===mode;
  });
}
function startQuiz(mode){
  S.quizMode=mode||S.quizMode;
  S.q={order:buildOrder(S.quizMode),idx:0,picked:null,sessionCorrect:0,sessionTotal:0};
  if(!S.q.order.length){ toast('这里还没有题目，先去刷题吧'); return false; }
  return true;
}

  }
  if(eqs.length){
    h+='<div class="sec-head"><h3>收藏的方程式</h3><span class="more">'+eqs.length+' 条</span></div>';
    h+=eqs.map(function(o){return '<div class="eq"><div class="eq-top"><h4>'+esc(o.e.n)+'</h4></div><div class="formula">'+fmt(o.e.e,o.e.cond)+'</div>'+
      '<div class="eq-line"><b>考点</b><span>'+esc(o.e.tip)+'</span></div></div>';}).join('');
  }
  if(qs.length){
    h+='<div class="sec-head"><h3>收藏的题目</h3><span class="more">'+qs.length+' 题</span></div>';
    h+=qs.map(function(o){return '<div class="wrong-item"><p class="t">'+rich(o.q.q)+'</p><div class="a">答案：'+['A','B','C','D'][o.q.a]+'</div>'+
      '<div class="e">'+rich(o.q.ex)+'</div></div>';}).join('');
  }
  return h;
}

/* ---------------- 我的 ---------------- */
function renderMine(){
  var pct=TOTAL_KP?Math.round(S.learned.size/TOTAL_KP*100):0;
  var rate=S.stats.total?Math.round(S.stats.correct/S.stats.total*100):0;
  var h='<div class="profile"><div class="avatar">化</div><div><h3>化学学习助手</h3><p>人教版九年级 · 已坚持学习 '+Math.max(1,Math.ceil(S.stats.total/5))+' 天</p></div></div>';
  h+='<div class="card"><div class="sec-head" style="margin:0 0 10px"><h3>知识点掌握进度</h3><span class="more">'+S.learned.size+' / '+TOTAL_KP+'</span></div>'+
     '<div class="bar-row"><div class="l"><span>总体进度</span><b>'+pct+'%</b></div><div class="bar-track"><i style="width:'+pct+'%"></i></div></div>';
  h+=C.map(function(c,i){
    var d=c.points.reduce(function(n,p,j){return n+(S.learned.has(kpKey(i,j))?1:0)},0);
    var v=Math.round(d/c.points.length*100);
    return '<div class="bar-row hue-'+c.hue+'"><div class="l"><span>'+esc(c.t)+'</span><b>'+d+'/'+c.points.length+'</b></div><div class="bar-track"><i style="width:'+v+'%"></i></div></div>';
  }).join('')+'</div>';
  h+='<div class="stat-grid"><div class="stat-box"><b>'+S.stats.total+'</b><span>累计答题</span></div>'+
     '<div class="stat-box"><b>'+rate+'%</b><span>正确率</span></div>'+
     '<div class="stat-box"><b>'+(S.favKp.size+S.favEq.size)+'</b><span>收藏内容</span></div></div>';
  h+='<div class="menu">'+
     '<button class="menu-item" data-act="quiz-tab" data-t="wrong"><span class="mi">'+ic('info')+'</span>错题本<span class="v">'+S.wrong.length+' 题待复习</span><span class="arrow">'+ic('right')+'</span></button>'+
     '<button class="menu-item" data-act="quiz-tab" data-t="fav"><span class="mi">'+ic('star')+'</span>我的收藏<span class="v">'+(S.favKp.size+S.favEq.size)+' 条</span><span class="arrow">'+ic('right')+'</span></button>'+
     '<button class="menu-item" data-act="about"><span class="mi">'+ic('bulb')+'</span>关于本应用<span class="arrow">'+ic('right')+'</span></button>'+
     '<button class="menu-item" data-act="clear-wrong"><span class="mi" style="background:var(--warn-soft)">'+ic('trash')+'</span>清空错题本<span class="arrow">'+ic('right')+'</span></button>'+
     '<button class="menu-item" data-act="reset"><span class="mi" style="background:var(--err-soft)">'+ic('refresh')+'</span>重置全部学习记录<span class="arrow">'+ic('right')+'</span></button>'+
     '</div>';
  h+='<p style="text-align:center;color:var(--muted);font-size:10.5px;margin:14px 0 0">数据仅保存在本机浏览器，不会上传 · v1.0</p>';
  return h;
}

/* ---------------- 弹层内容 ---------------- */
function openKp(ci,pi){
  var c=C[ci],p=c.points[pi],key=kpKey(ci,pi);
  openSheet(p.t,'<div class="hue-'+c.hue+'"><div style="display:flex;gap:6px;margin-bottom:10px"><span class="tag gray">'+esc(c.t)+'</span>'+
    '<span class="tag gray">第 '+(pi+1)+' 个知识点</span></div>'+
    '<div class="kp-sum" style="background:var(--hs);color:var(--h);border-radius:9px;padding:9px 11px;font-size:12.5px;font-weight:600;margin-bottom:12px">'+rich(p.s)+'</div>'+
    '<ul style="margin-bottom:12px">'+p.d.map(function(d){return '<li style="position:relative;padding-left:14px;font-size:12.5px;line-height:1.8;color:var(--sub);margin-bottom:6px"><span style="position:absolute;left:2px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--h);opacity:.6"></span>'+rich(d)+'</li>';}).join('')+'</ul>'+
    '<div class="tip" style="background:var(--warn-soft);border-radius:9px;padding:10px 11px;font-size:12px;color:#9A6518"><b>易错提醒</b><span>'+rich(p.tip)+'</span></div>'+
    '<div style="display:flex;gap:9px;margin-top:16px"><button class="btn ghost block" data-act="fav-kp" data-key="'+key+'">'+ic('star')+(S.favKp.has(key)?'取消收藏':'收藏')+'</button>'+
    '<button class="btn block" data-act="learn" data-key="'+key+'">'+ic('check')+(S.learned.has(key)?'取消已学':'标记已学')+'</button></div></div>');
}
function openEl(z){
  var e=null; E.forEach(function(x){if(x.z===z)e=x;}); if(!e)return;
  var color=e.cat==='金属'?'#F0A24A':e.cat==='稀有气体'?'#9B7BE8':e.cat==='类金属'?'#63B98A':'#48B4D8';
  var rows=[['原子序数',e.z],['元素符号',e.sym],['相对原子质量',e.mass],['元素类别',e.cat],['常见化合价',e.val],['周期 / 最外层电子',e.p?('第 '+e.p+' 周期 · '+outerElectrons(e)+' 个电子'):'常考补充元素']];
  openSheet(e.name+' · '+e.sym,'<div class="el-detail"><div class="big" style="--h:'+color+';--hs:#F4F8FA">'+
    '<div class="box" style="background:'+color+'"><b>'+e.sym+'</b><span>'+e.z+'</span></div>'+
    '<div><h3>'+esc(e.name)+'</h3><p>'+esc(e.cat)+' · 相对原子质量 '+e.mass+'</p></div></div>'+
    rows.map(function(r){return '<div class="info-row"><span>'+r[0]+'</span><b>'+esc(r[1])+'</b></div>';}).join('')+
    '<div class="tip" style="background:var(--brand-soft);color:var(--brand-d);border-radius:10px;padding:11px;margin-top:14px;font-size:12px;line-height:1.7"><b>考点</b><span>'+rich(e.note)+'</span></div></div>');
}
function aboutHtml(){
  return '<div style="font-size:12.5px;line-height:1.85;color:var(--sub)">'+
    '<p><b style="color:var(--text)">初中化学学习小程序</b> v1.0</p>'+
    '<p>依据人教版《化学》九年级上册、下册整理，覆盖 '+C.length+' 个单元、'+TOTAL_KP+' 个知识点、'+E.length+' 种元素、'+Q.length+' 条化学方程式、'+K.length+' 张速查口诀、'+QUIZ.length+' 道带解析的练习题。</p>'+
    '<p>功能：知识课堂、元素周期表、方程式速查、必背口诀、闯关练习、错题本、收藏夹、学习进度统计。</p>'+
    '<p>所有学习数据保存在本机浏览器（localStorage），不上传、不联网，清除浏览器数据会一并清空。</p>'+
    '<p style="color:var(--muted);font-size:11px">题目与知识点仅供复习参考，请以教材和课堂讲授为准。</p></div>';
}

/* ---------------- 主渲染 ---------------- */
function render(){
  renderChrome();
  var h;
  switch(S.view){
    case 'home': h=renderHome();break;
    case 'knowledge': h=renderKnowledge();break;
    case 'chapter': h=renderChapter(S.chapter);break;
    case 'tools': h=renderTools();break;
    case 'quiz': h=renderQuiz();break;
    case 'mine': h=renderMine();break;
    default: h=renderHome();
  }
  $page.className='page'; void $page.offsetWidth;
  $page.className='page active'; $page.innerHTML=h;
}

/* ---------------- 事件 ---------------- */
function onAct(act,el,e){
  var d=el.dataset;
  switch(act){
    case 'tab': go(d.tab); break;
    case 'back': go('knowledge','knowledge'); break;
    case 'quick':
      if(d.to==='toolseq'){ S.toolTab='equation'; go('tools'); }
      else go(d.to);
      break;
    case 'open-ch': S.chapter=+d.i; go('knowledge','chapter'); break;
    case 'open-kp': openKp(+d.ci,+d.pi); break;
    case 'learn': {
      var k=d.key;
      if(S.learned.has(k)){S.learned.delete(k);toast('已取消掌握标记');}
      else{S.learned.add(k);toast('已标记为掌握');}
      save(); closeSheet(); render(); break;
    }
    case 'fav-kp': {
      var k2=d.key;
      if(S.favKp.has(k2)){S.favKp.delete(k2);toast('已取消收藏');}
      else{S.favKp.add(k2);toast('已加入收藏');}
      save(); closeSheet(); render(); break;
    }
    case 'fav-quiz': {
      var qk='q:'+d.i;
      if(S.favKp.has(qk)){S.favKp.delete(qk);toast('已取消收藏');}
      else{S.favKp.add(qk);toast('本题已收藏');}
      save(); refreshQuiz(); renderChrome(); break;
    }
    case 'tool-tab': S.toolTab=d.t; render(); $page.scrollTop=0; break;
    case 'eq-cat': S.eqCat=d.c; render(); $page.scrollTop=0; break;
    case 'fav-eq': {
      var i=+d.i;
      if(S.favEq.has(i)){S.favEq.delete(i);toast('已取消收藏');}else{S.favEq.add(i);toast('方程式已收藏');}
      save(); var l=document.getElementById('eqList'); if(l)l.innerHTML=eqListHtml(); break;
    }
    case 'clear-eq': S.eqQuery=''; render(); break;
    case 'clear-kp': S.kpQuery=''; render(); break;
    case 'el': openEl(+d.z); break;
    case 'daily':
      S.quizTab='practice'; S.q={order:[dailyIndex()],idx:0,picked:null,sessionCorrect:0,sessionTotal:0};
      S.quizMode='全部题目'; go('quiz'); break;
    case 'quiz-ch':
      S.quizTab='practice'; if(startQuiz(d.ch)) go('quiz'); break;
    case 'quiz-tab': S.quizTab=d.t; if(S.tab!=='quiz'){go('quiz');}else{render();$page.scrollTop=0;} break;
    case 'quiz-mode':
      S.quizTab='practice'; if(startQuiz(d.m)){ render(); $page.scrollTop=0; } break;
    case 'opt': {
      if(S.q.picked!==null)return;
      var pick=+d.i, qi=S.q.order[S.q.idx], qq=QUIZ[qi];
      S.q.picked=pick; S.q.sessionTotal++; S.stats.total++;
      if(pick===qq.a){ S.q.sessionCorrect++; S.stats.correct++; }
      else if(S.wrong.indexOf(qi)<0) S.wrong.push(qi);
      save(); refreshQuiz(); renderChrome(); break;
    }
    case 'next-q': S.q.idx++; S.q.picked=null; refreshQuiz(); break;
    case 'restart': startQuiz(S.quizMode); render(); $page.scrollTop=0; break;
    case 'retry-wrong':
      S.quizTab='practice'; if(startQuiz('错题重练')){ render(); $page.scrollTop=0; } break;
    case 'wrong-remove': {
      var qi2=+d.i, p=S.wrong.indexOf(qi2);
      if(p>=0)S.wrong.splice(p,1); save(); render(); toast('已移出错题本'); break;
    }
    case 'clear-wrong': confirmDo('清空错题本','将移除全部 '+S.wrong.length+' 道错题，此操作不可撤销。',function(){
      S.wrong=[];save();render();toast('错题本已清空'); }); break;
    case 'reset': confirmDo('重置学习记录','将清空已学标记、收藏、错题和答题统计，且不可恢复。',function(){
      S.learned.clear();S.favKp.clear();S.favEq.clear();S.wrong=[];S.stats={total:0,correct:0};
      save();startQuiz('全部题目');render();toast('已重置全部记录'); }); break;
    case 'about': openSheet('关于本应用',aboutHtml()); break;
    case 'close-sheet': closeSheet(); break;
    case 'confirm-ok': { var fn=S.pending; S.pending=null; closeSheet(); if(fn)fn(); break; }
  }
}

function init(){
  $page=document.getElementById('page');
  $navTitle=document.getElementById('navTitle');
  $navBack=document.getElementById('navBack');
  $mask=document.getElementById('mask');
  $sheet=document.getElementById('sheet');
  $sheetTitle=document.getElementById('sheetTitle');
  $sheetBody=document.getElementById('sheetBody');
  $toast=document.getElementById('toast');
  $tabbar=document.getElementById('tabbar');

  document.addEventListener('click',function(e){
    var t=e.target.closest('[data-act]');
    if(t){ e.preventDefault(); onAct(t.dataset.act,t,e); return; }
    if(e.target.id==='mask'){ closeSheet(); }
  });
  document.addEventListener('input',function(e){
    var type=e.target.dataset.search;
    if(type==='kp'){
      S.kpQuery=e.target.value;
      var r=document.getElementById('kpResults'); if(r)r.innerHTML=kpResultsHtml();
      var c=document.querySelector('[data-act="clear-kp"]');
      if(S.kpQuery&&!c){ e.target.insertAdjacentHTML('afterend','<span class="clear" data-act="clear-kp">×</span>'); }
      else if(!S.kpQuery&&c){ c.remove(); }
    }else if(type==='eq'){
      S.eqQuery=e.target.value;
      var l=document.getElementById('eqList'); if(l)l.innerHTML=eqListHtml();
      var c2=document.querySelector('[data-act="clear-eq"]');
      if(S.eqQuery&&!c2){ e.target.insertAdjacentHTML('afterend','<span class="clear" data-act="clear-eq">×</span>'); }
      else if(!S.eqQuery&&c2){ c2.remove(); }
    }
  });
  // 状态栏时间
  function tick(){
    var d=new Date(), hh=('0'+d.getHours()).slice(-2), mm=('0'+d.getMinutes()).slice(-2);
    var el=document.getElementById('clock'); if(el)el.textContent=hh+':'+mm;
  }
  tick(); setInterval(tick,30000);

  startQuiz('全部题目');
  render();
}
init();
})();

</script>
</body>
</html>
